      let items = hls;
      if (q) items = items.filter(h => [h.q.text, h.b.title, h.b.author].join(" ").toLowerCase().includes(q));
      // 책마다 남긴 글귀를 책별로 묶어 보여 준다 (형광펜 칠한 부분은 그대로 표시)
      const order = [];
      items.forEach(h => { let g = order.find(x => x.b === h.b); if (!g) { g = { b: h.b, qs: [] }; order.push(g); } g.qs.push(h); });
      order.sort((a, b) => readOrder(a.b, b.b));
      // 책 제목만 보이게 접어 두고, 누르면 글귀가 펼쳐진다. 검색 중에는 모두 펼친다
      const isOpen = id => !!q || qOpen.has(id);
      const allOpen = order.length && order.every(g => isOpen(g.b.id));
      el.innerHTML = order.length
        ? `${q ? "" : `<div class="q-tools-row"><button class="btn ghost sm" data-qall="${allOpen ? "close" : "open"}">${allOpen ? "모두 접기" : "모두 펼치기"}</button></div>`}<div class="quote-list">${order.map(g => { const open = isOpen(g.b.id); return `<section class="q-book${open ? " open" : ""}"><button class="q-book-h" data-qtoggle="${esc(g.b.id)}" aria-expanded="${open}"><span class="chev" aria-hidden="true">›</span><span class="t">${esc(g.b.title)}</span>${g.b.author ? `<span class="author">${esc(g.b.author)}</span>` : ""}<span class="c">${g.qs.length}</span></button>${open ? g.qs.map(h => quoteHTML(h.b, h.q, h.i, false)).join("") + `<button class="btn ghost sm q-openbook" data-open="${esc(g.b.id)}">이 책 열기 →</button>` : ""}</section>`; }).join("")}</div>`
        : `<div class="empty"><p>${q ? `“${esc(query)}”에 맞는 문장이 없어요.` : "읽은 책에 오래 머문 문장을 남기면 여기에 책별로 모여요."}</p></div>`;
      return;
    }

    let list = tab === "read" ? read : tab === "reading" ? reading : want;
    // 꼬리표 모음
    const tc = {}; list.forEach(b => tagsOf(b).forEach(t => tc[t] = (tc[t] || 0) + 1));
    const tagNames = Object.keys(tc).sort((a, b) => tc[b] - tc[a] || a.localeCompare(b, "ko"));
    if (tagFilter && !tc[tagFilter]) tagFilter = "";
    $("#tagbar").innerHTML = tagNames.length ? `<button class="tag" data-tagf="" aria-pressed="${!tagFilter}">전체</button>` +
      tagNames.map(t => `<button class="tag" data-tagf="${esc(t)}" aria-pressed="${tagFilter === t}">#${esc(t)}<span class="c">${tc[t]}</span></button>`).join("") : "";
    if (tagFilter) list = list.filter(b => tagsOf(b).includes(tagFilter));
    if (q) list = list.filter(b => [b.title, b.author, b.memo, b.oneLine, b.shelf, ...tagsOf(b), ...(b.quotes || []).map(x => x.text)].join(" ").toLowerCase().includes(q));
    const shelves = shelfList();
    if (tab === "read") {
      const sc = {}; list.forEach(b => { const k = shelves.includes(b.shelf) ? b.shelf : ""; sc[k] = (sc[k] || 0) + 1; });
      if (shelfFilter && !shelves.includes(shelfFilter)) shelfFilter = "";
      const narrowing = !!(q || tagFilter);
      const names = narrowing ? shelves.filter(n => sc[n]) : shelves;
      const allLabel = settings.allLabel || "전체 서재";
      $("#shelfbar").innerHTML = `<button class="tag sh" data-shf="" aria-pressed="${!shelfFilter}">${esc(allLabel)}</button>`
        + (canWrite ? `<button class="sh-rename" data-allrename aria-label="${esc(allLabel)} 이름 바꾸기" title="이름 바꾸기">${EDIT_PEN}</button>` : "")
        + names.map(n => `<button class="tag sh" data-shf="${esc(n)}" aria-pressed="${shelfFilter === n}">${esc(n)}<span class="c">${sc[n] || 0}</span></button>`).join("")
        + (canWrite ? `<button class="tag sh add" data-addshelf aria-label="칸 추가" title="칸 추가">＋</button>` : "")
        + `<span class="viewtog" role="group" aria-label="보기 방식"><button data-view="spine" aria-pressed="${viewMode === "spine"}">꽂아 보기</button><button data-view="cover" aria-pressed="${viewMode === "cover"}">표지 보기</button></span>`;
    } else $("#shelfbar").innerHTML = "";
    const sorters = {
      read: readOrder,
      reading: (a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0),
      want: (a, b) => (b.createdAt || 0) - (a.createdAt || 0)
    };
    list = list.slice().sort(sorters[tab]);

    if (!list.length) {
      const msg = { read: "다 읽은 책을 기록해 보세요. 표지 사진, 별점, 마음에 남은 글귀, 메모를 함께 남길 수 있어요.",
        reading: "지금 읽고 있는 책을 넣어 두세요. 읽기 시작한 날도 함께 남아요.",
        want: "나중에 읽고 싶은 책의 제목과 저자를 적어 두세요." }[tab];
      el.innerHTML = q || tagFilter ? `<div class="empty"><p>찾는 책이 없어요.</p></div>`
        : `<div class="empty"><p>${msg}</p>${canWrite ? `<button class="btn primary" data-add="${tab}">＋ ${STATUS_NAME[tab]} 추가</button>` : ""}</div>`;
      return;
    }
    if (tab === "want" || tab === "reading") {
      el.innerHTML = `<ul class="wlist">${list.map(b => `<li><button data-open="${esc(b.id)}"><span class="t">${esc(b.title)}</span><span class="a">${esc(b.author)}</span></button></li>`).join("")}</ul>`;
      return;
    }
    const card = b => `
      <button class="book" data-open="${esc(b.id)}">
        ${coverHTML(b)}
        <div class="meta">
          <div class="t">${esc(b.title)}</div>
          <div class="a">${esc(b.author)}</div>
          ${tab === "read" ? starsHTML(b.rating) : ""}
          ${tab === "read" && b.oneLine ? `<div class="one">${esc(b.oneLine)}</div>` : ""}
          ${tab === "read" && b.date ? `<span class="stamp">${fmtDate(b.date)}</span>` : ""}
        </div>
      </button>`;
    const spine = b => {
      const h = hashN(b.id), t = b.title || "";
      // 제목과 저자가 다 들어가도록 책등 높이·두께 계산
      // 띄어쓰기에서만 줄을 나눠 한 단어가 갈라지지 않게 줄 수를 셈다
      const wordsOf = x => String(x || "").split(/\s+/).filter(Boolean).map(w => [...w].length);
      const colsFor = (ws, per) => { let cols = 0, cur = 0; for (let n of ws) { while (n > per) { if (cur) { cols++; cur = 0; } cols++; n -= per; } if (!n) continue; if (!cur) cur = n; else if (cur + 1 + n <= per) cur += 1 + n; else { cols++; cur = n; } } return cols + (cur ? 1 : 0); };
      const tw = wordsOf(t), aw = wordsOf(b.author), tl = [...t].length, al = [...(b.author || "")].length;
      // 책등 크기는 모두 같게, 제목이 길면 글자를 줄여서 맞춘다
      const ht = 190, w = 44, inner = w - 10;
      // 저자: 한 줄에 다 들어가면 한 줄, 아니면 띄어쓰기에서 두 줄로. 글자는 칸에 맞게 줄인다
      const AREA = 62, aWords = String(b.author || "").trim().split(/\s+/).filter(Boolean);
      let aCols = [], aFs = 10.5;
      if (al) {
        const one = aWords.join(" "), oneLen = [...one].length;
        if (AREA / oneLen >= 8.5 || aWords.length < 2 && oneLen <= 7) { aCols = [one]; aFs = Math.min(10.5, AREA / oneLen); }
        else {
          let best = null;
          if (aWords.length >= 2) for (let k = 1; k < aWords.length; k++) { const L = aWords.slice(0, k).join(" "), R = aWords.slice(k).join(" "); const m = Math.max([...L].length, [...R].length); if (!best || m < best.m) best = { L, R, m }; }
          else { const c = [...one], k = Math.ceil(c.length / 2); best = { L: c.slice(0, k).join(""), R: c.slice(k).join(""), m: k }; }
          aCols = [best.L, best.R]; aFs = Math.min(10.5, AREA / best.m, inner / 2 / 1.15);
        }
        aFs = Math.max(7, Math.round(aFs * 10) / 10);
      }
      const authorH = al ? Math.ceil(Math.max(...aCols.map(c => [...c].length)) * aFs * 1.1) + 10 : 0;
      const avail = ht - 46 - (al ? authorH + 6 : 0);
      // 제목을 단어 단위로 줄에 나눠 담는다 (예: 그리스인 / 조르바)
      const tWords = t.trim().split(/\s+/).filter(Boolean);
      const pack = per => { const cols = []; let cur = ""; for (let wd of tWords) { while ([...wd].length > per) { if (cur) { cols.push(cur); cur = ""; } cols.push([...wd].slice(0, per).join("")); wd = [...wd].slice(per).join(""); } if (!wd) continue; if (!cur) cur = wd; else if ([...cur].length + 1 + [...wd].length <= per) cur += " " + wd; else { cols.push(cur); cur = wd; } } if (cur) cols.push(cur); return cols; };
      let fs = 9, tCols = pack(Math.max(1, Math.floor(avail / (9 * 1.04))));
      for (const f of [14, 13, 12, 11, 10, 9]) {
        const per = Math.max(1, Math.floor(avail / (f * 1.04))), maxCols = Math.max(1, Math.floor(inner / (f * 1.18)));
        const cols = pack(per);
        if (cols.length <= maxCols) { fs = f; tCols = cols; break; }
      }
      const src = coverSrc(b);
      return `<button class="spine" data-open="${esc(b.id)}" ${src ? `data-cover="${esc(src)}"` : ""} title="${esc(t)}${b.author ? " · " + esc(b.author) : ""}"
        style="--h:${ht}px;--w:${Math.round(w)}px;--fs:${fs}px;--ah:${authorH}px;--sp:${SPINE_COLORS[h % SPINE_COLORS.length]}"><span class="st">${tCols.map(esc).join("<br>")}</span>${al ? `<span class="sa" style="font-size:${aFs}px">${aCols.map(esc).join("<br>")}</span>` : ""}${src ? `<span class="face">${coverHTML(b)}</span>` : ""}</button>`;
    };
    // 선반마다 대표 책 한 권은 표지가 앞을 보게
    const pickFace = list => {
      const withCover = list.filter(b => coverSrc(b)); if (!withCover.length) return null;
      return withCover.slice().sort((a, b) => (+b.rating || 0) - (+a.rating || 0) || (b.quotes || []).length - (a.quotes || []).length || (b.createdAt || 0) - (a.createdAt || 0))[0];
    };
    const shelfRow = list => {
      const f = null;   // 꽂아 보기에서는 모두 책등으로
      return (f ? `<button class="faceout" data-open="${esc(f.id)}" title="${esc(f.title)}">${coverHTML(f)}</button>` : "") + list.filter(b => b !== f).map(spine).join("");
    };
    const groups = shelves.map(n => ({ name: n, books: list.filter(b => b.shelf === n) })).filter(g => g.books.length || !(q || tagFilter));
    const rest = list.filter(b => !shelves.includes(b.shelf));
    if (rest.length) groups.push({ name: "", books: rest });
    const shown = shelfFilter ? groups.filter(g => g.name === shelfFilter) : groups;
    el.innerHTML = shown.map(g => `<section class="sh-sec">
      <div class="sh-head" data-shhead="${esc(g.name)}"><h3>${g.name ? esc(g.name) : "아직 칸을 정하지 않은 책"}</h3><span class="c">${g.books.length}권</span>
        ${canWrite && g.name ? `<button class="sh-rename" data-shrename="${esc(g.name)}" aria-label="${esc(g.name)} 칸 이름 바꾸기" title="칸 이름 바꾸기">${EDIT_PEN}</button>` : ""}</div>
      ${!g.books.length ? `<div class="spines"><span class="shelf-empty">아직 꽂힌 책이 없어요. 책을 추가하거나 수정할 때 이 칸을 고르면 여기에 꽂혀요.</span></div>`
        : viewMode === "spine" ? `<div class="spines">${shelfRow(g.books)}</div>` : `<div class="grid">${g.books.map(card).join("")}</div>`}</section>`).join("");
    if (viewMode === "spine") paintSpines();
  }

  // ---------- 한 해 돌아보기 ----------
  function reviewHTML(read) {
    const years = [...new Set(read.map(b => (b.date || "").slice(0, 4)).filter(Boolean).concat(String(new Date().getFullYear())))].sort().reverse();
    if (!years.includes(reviewYear)) reviewYear = years[0];
    const yb = read.filter(b => (b.date || "").startsWith(reviewYear));
    let quotes = 0; yb.forEach(b => (b.quotes || []).forEach(q => { if (q.text) quotes++; }));
    const byMonth = Array.from({ length: 12 }, () => []);
    yb.slice().sort((a, b) => (a.date || "").localeCompare(b.date || "")).forEach(b => { const m = +(b.date || "").slice(5, 7); if (m) byMonth[m - 1].push(b); });
    const now = new Date(); const curM = String(now.getFullYear()) === reviewYear ? now.getMonth() : -1;
    const rated = yb.filter(b => +b.rating > 0);
    const avg = rated.length ? (rated.reduce((s, b) => s + +b.rating, 0) / rated.length).toFixed(1) : "–";
    const tc = {}; yb.forEach(b => tagsOf(b).forEach(t => tc[t] = (tc[t] || 0) + 1));
    const tags = Object.entries(tc).sort((a, b) => b[1] - a[1]).slice(0, 8);
    const best = rated.slice().sort((a, b) => +b.rating - +a.rating || (b.date || "").localeCompare(a.date || "")).filter(b => +b.rating >= 4).slice(0, 5);
    const goal = +((settings.goals || {})[reviewYear]) || 0;
    const pct = goal ? Math.min(100, Math.round(yb.length / goal * 100)) : 0;
    const goalHTML = `<div class="goal" id="goalBox">${goal
      ? `<div class="g-top"><span><b>${reviewYear}년 목표</b> ${goal}권 중 <b class="g-num">${yb.length}권</b> 읽었어요</span>${canWrite ? `<button class="btn ghost sm" data-goaledit>목표 바꾸기</button>` : ""}</div>
         <div class="g-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${goal}" aria-valuenow="${yb.length}"><span style="width:${pct}%"></span></div>
         <div class="g-note">${pct >= 100 ? "목표를 이뤘어요!" : `${goal - yb.length}권 남았어요`}</div>`
      : `<div class="g-top"><span>${reviewYear}년에 몇 권 읽을지 목표를 정해 보세요.</span>${canWrite ? `<button class="btn sm" data-goaledit>목표 정하기</button>` : ""}</div>`}</div>`;
    return `
      <div class="years">${years.map(y => `<button class="tag" data-year="${y}" aria-pressed="${y === reviewYear}">${y}년</button>`).join("")}</div>
      ${goalHTML}
      <div class="tiles">
        <div class="tile"><div class="v">${yb.length}<small>권</small></div><div class="k">읽은 책</div></div>
        <div class="tile"><div class="v">${quotes}<small>개</small></div><div class="k">남긴 글귀</div></div>
        <div class="tile"><div class="v">${avg}${rated.length ? "<small>점</small>" : ""}</div><div class="k">평균 별점</div></div>
      </div>
      <div class="r-sec"><h3>달마다 읽은 책</h3>
        <div class="mcal">${byMonth.map((list, i) => `<div class="mc${list.length ? "" : " none"}${i === curM ? " now" : ""}">
          <div class="mh"><b>${i + 1}월</b>${list.length ? `<span>${list.length}권</span>` : ""}</div>
          ${list.length ? `<div class="mbooks">${list.map(b => `<button class="book" data-open="${esc(b.id)}" title="${esc(b.title)}">${coverHTML(b)}</button>`).join("")}</div>` : ""}
        </div>`).join("")}</div>
      </div>
      ${tags.length ? `<div class="r-sec"><h3>많이 읽은 꼬리표</h3><div class="tagbar" style="margin:0">${tags.map(([t, c]) => `<span class="tag">#${esc(t)}<span class="c">${c}</span></span>`).join("")}</div></div>` : ""}
      ${best.length ? `<div class="r-sec"><h3>별점 높은 책</h3><ul class="best">${best.map(b => `<li><button data-open="${esc(b.id)}"><span class="t">${esc(b.title)}</span>${starsHTML(b.rating)}${b.oneLine ? `<span class="one">${esc(b.oneLine)}</span>` : ""}</button></li>`).join("")}</ul></div>` : ""}
      ${yb.length ? "" : `<div class="empty"><p>${reviewYear}년에 다 읽은 날짜가 적힌 책이 아직 없어요.</p></div>`}
      <div class="r-sec" style="margin-top:34px"><h3>내려받기</h3>
        <div class="exp">
          <button class="exp-btn" data-export="xlsx"><b>기록 내려받기</b><span>서재 전체를 엑셀 표로 받아요. 백업할 때 좋아요.</span></button>
          <button class="exp-btn" data-export="doc"><b>오래 머문 문장 모음</b><span>문장을 책별로 엮은 문서예요. 인쇄하거나 나눌 때 좋아요.</span></button>
        </div>
        <p class="exp-msg" id="expMsg" aria-live="polite"></p>
      </div>
      ${!window.SEED && (!store || window.FIREBASE_CONFIG) ? `<div class="r-sec"><h3>서재 옮기기</h3>
        <div class="exp">
          <button class="exp-btn" data-backup="save"><b>서재 파일 저장</b><span>책, 문장, 표지, 칸까지 파일 하나로 저장해요. 백업할 때 좋아요.</span></button>
          <label class="exp-btn" style="cursor:pointer"><b>서재 파일 불러오기</b><span>저장해 둔 서재 파일로 다른 컴퓨터나 새 주소에서 이어 써요.</span><input type="file" id="restoreFile" accept=".json,application/json" hidden></label>
        </div>
        <div class="exp-msg" id="bkMsg" aria-live="polite">${esc(bkNote)}</div>
      </div>` : ""}
    `;
  }

  // ---------- sheets ----------
  const layer = $("#layer");
  function openSheet(html) {
    const keepScroll = layer.querySelector(".sheet")?.scrollTop;
    layer.innerHTML = `<div class="overlay" data-close><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
    document.body.style.overflow = "hidden";
    return keepScroll;
  }
  function closeSheet() { layer.innerHTML = ""; document.body.style.overflow = ""; render(); }

  function showDetail(id) {
    const b = books.find(x => x.id === id); if (!b) return;
    const st = statusOf(b);
    const quotes = (b.quotes || []).map((q, i) => ({ q, i })).filter(x => x.q.text);
    const tags = tagsOf(b);
    if (st !== "read") {
      openSheet(`
        <div class="sheet-head"><h2>${STATUS_NAME[st]}</h2><button class="btn ghost" data-close-btn aria-label="닫기">닫기 ✕</button></div>
        <h3 class="d-title">${esc(b.title)}</h3>${b.author ? `<div class="author">${esc(b.author)}</div>` : (canWrite ? `<button class="tag add" data-editfocus="f-author" data-book="${esc(b.id)}">＋ 저자</button>` : "")}
        ${canWrite ? `<div class="row actions">
          ${st === "want" ? `<button class="btn primary" data-start="${esc(b.id)}">읽기 시작</button>` : ""}
          <button class="btn primary" data-finish="${esc(b.id)}">다 읽었어요</button>
          <button class="btn" data-edit="${esc(b.id)}">수정</button>
          <button class="btn danger" data-del="${esc(b.id)}">삭제</button>
        </div><div id="delConfirm"></div>` : ""}`);
      return;
    }
    openSheet(`
      <div class="sheet-head"><h2>${STATUS_NAME[st]}</h2><button class="btn ghost" data-close-btn aria-label="닫기">닫기 ✕</button></div>
      <div class="detail-top">${coverHTML(b)}
        <div><h3>${esc(b.title)}</h3>${b.author ? `<div class="author">${esc(b.author)}</div>` : (canWrite ? `<button class="tag add" data-editfocus="f-author" data-book="${esc(b.id)}">＋ 저자</button>` : "")}
        ${st === "read" ? (canWrite ? `<div class="star-pick quick" role="group" aria-label="별점">${[1,2,3,4,5].map(n => `<button type="button" class="${starCls(n, clampRate(b.rating))}" data-qr="${n}" data-book="${esc(b.id)}" aria-label="별 ${n}개">★</button>`).join("")}</div>` : starsHTML(b.rating)) : ""}
        ${st === "read" && b.date ? `<span class="stamp">${fmtDate(b.date)} 읽음</span>` : ""}
        ${b.shelf ? `<span class="tag sh" style="margin-top:6px">${esc(b.shelf)}</span>` : ""}</div>
      </div>
      ${b.oneLine ? `<p class="d-one">${esc(b.oneLine)}</p>` : ""}
      <div class="d-tags">${tags.map(t => `<span class="tag">#${esc(t)}</span>`).join("")}
        ${canWrite && st === "read" && !b.oneLine ? `<button class="tag add" data-editfocus="f-one" data-book="${esc(b.id)}">＋ 한 줄 평</button>` : ""}
        ${canWrite && !tags.length ? `<button class="tag add" data-editfocus="f-tags" data-book="${esc(b.id)}">＋ 꼬리표</button>` : ""}</div>
      ${quotes.length ? `<div class="sec-label">오래 머문 문장</div>${quotes.map(x => quoteHTML(b, x.q, x.i, false)).join("")}` : ""}
      ${b.memo ? `<div class="sec-label">메모</div><div class="memo">${esc(b.memo)}</div>` : ""}
      ${canWrite ? `<div class="row actions">

    if (fs < 30) { fs = 30; ctx.font = `${fs}px ${FONT}`; lh = fs * 1.72; lines = layoutLines(ctx, text, MAXW); }

    if (lines.length > maxLines) { lines = lines.slice(0, maxLines); cut = true; }

    let y0 = Math.max(250, (H - blockH) / 2 - 60);

    ctx.font = `${fs}px ${FONT}`;

      let x = X, k = s;
      const end = e;
      while (k < end) {
        const on = marked[k]; let j = k; while (j < end && marked[j] === on) j++;

    const t = e.target;
    if (t.matches("[data-close]") || t.closest("[data-close-btn]")) return closeSheet();
    if (cardClick(e)) return;
    const ed = t.closest("[data-edit]"); if (ed) return showForm(books.find(x => x.id === ed.dataset.edit));
    const ef = t.closest("[data-editfocus]");
    if (ef) { showForm(books.find(x => x.id === ef.dataset.book)); const f = $("#" + ef.dataset.editfocus); if (f) { f.scrollIntoView({ block: "center" }); f.focus(); } return; }
    const qr = t.closest("[data-qr]");
    if (qr) {
      const b = JSON.parse(JSON.stringify(books.find(x => x.id === qr.dataset.book)));
      b.rating = rateFromClick(qr, +qr.dataset.qr, e, b.rating);
      qr.parentElement.querySelectorAll("[data-qr]").forEach(x => { x.className = starCls(+x.dataset.qr, b.rating); });
      const k = books.findIndex(x => x.id === b.id); books[k] = b;
      try { await saveBook(b); } catch { showNotice("별점을 저장하지 못했어요. 다시 눌러 주세요."); }
      return;
    }
    const sta = t.closest("[data-start]");
    if (sta) {
      const b = JSON.parse(JSON.stringify(books.find(x => x.id === sta.dataset.start)));
      b.status = "reading"; b.date = "";
      sta.disabled = true;
      try { const k = books.findIndex(x => x.id === b.id); books[k] = b; await saveBook(b); showDetail(b.id); } catch { sta.disabled = false; showNotice("저장하지 못했어요. 다시 눌러 주세요."); }
      return;
    }
    const fin = t.closest("[data-finish]");
    if (fin) { const b = books.find(x => x.id === fin.dataset.finish); showForm({ ...b, status: "read", date: today(), startDate: b.startDate || "" }); return; }
    const del = t.closest("[data-del]");
    if (del) { $("#delConfirm").innerHTML = `<div class="notice" style="margin-top:14px">이 기록을 지울까요? 되돌릴 수 없어요.
        <div class="row" style="margin-top:10px"><button class="btn danger sm" data-del-yes="${esc(del.dataset.del)}">지우기</button><button class="btn sm" data-del-no>그대로 두기</button></div></div>`; return; }
    if (t.closest("[data-del-no]")) { $("#delConfirm").innerHTML = ""; return; }
    const yes = t.closest("[data-del-yes]");
    if (yes) { yes.disabled = true; try { await removeBook(books.find(x => x.id === yes.dataset.delYes)); closeSheet(); } catch { yes.disabled = false; yes.textContent = "다시 시도"; } return; }

    const st = t.closest("[data-status]");
    if (st) { syncDraft(); draft.status = st.dataset.status;
      if (draft.status === "read" && !draft.date) draft.date = today();
      if (draft.status === "read") $("#f-date").value = draft.date;
      layer.querySelectorAll("[data-status]").forEach(x => x.setAttribute("aria-pressed", x === st)); applyStatusVisibility(); return; }
    const rt = t.closest("[data-rate]");
    if (rt) { draft.rating = rateFromClick(rt, +rt.dataset.rate, e, draft.rating); $("#starPick").innerHTML = starPick(); return; }
    const ps = t.closest("[data-pickshelf]");
    if (ps) { draft.shelf = ps.dataset.pickshelf; $("#shelfPick").innerHTML = shelfPick(); return; }
    if (t.closest("#addShelf")) {
      const inp = $("#f-newshelf"); const n = inp.value.trim(); if (!n) { inp.focus(); return; }
      const list = shelfList(); if (!list.includes(n)) { list.push(n); saveSettings({ shelves: list }); }
      draft.shelf = n; inp.value = ""; $("#shelfPick").innerHTML = shelfPick(); return;
    }
    const at = t.closest("[data-addtag]");
    if (at) { const inp = $("#f-tags"); const cur = inp.value.split(",").map(s => s.trim()).filter(Boolean); cur.push(at.dataset.addtag); inp.value = cur.join(", "); draft.tagsText = inp.value; $("#tagSugg").innerHTML = tagSugg(); return; }
    if (t.closest("#ocrCam")) { pickOcrPhoto(true); return; }
    if (t.closest("#ocrBtn")) { pickOcrPhoto(false); return; }
    if (t.closest("#addQuote")) { syncDraft(); draft.quotes.push({ text: "", page: "" }); $("#quotes").innerHTML = quoteRows(); $("#q-text-" + (draft.quotes.length - 1)).focus(); return; }
    if (markClick(e)) return;
    const qd = t.closest("[data-qdel]");
    if (qd) { syncDraft(); draft.quotes.splice(+qd.dataset.qdel, 1); if (!draft.quotes.length) draft.quotes.push({ text: "", page: "" }); $("#quotes").innerHTML = quoteRows(); return; }
    if (t.closest("#coverClear")) { syncDraft(); draft.cover = null; draft.coverData = null; draft._newCover = null; renderForm(draft._editing); return; }
  });
  function finishFormTitle(save) {
    const inp = $("#formTitleInput"); if (!inp || inp.hidden) return;
    inp.hidden = true; $("#formTitleBtn").hidden = false;
    if (!save) return;
    const s = draft.status; const def = `${STATUS_NAME[s]} 추가`;
    const v = inp.value.trim() || def;
    $("#formTitleText").textContent = v;
    const labels = { ...(settings.addLabels || {}) }; if (v === def) delete labels[s]; else labels[s] = v;
    saveSettings({ addLabels: labels });
  }
  layer.addEventListener("click", e => {
    if (!e.target.closest("#formTitleBtn") || !canWrite) return;
    const inp = $("#formTitleInput"); inp.value = $("#formTitleText").textContent;
    $("#formTitleBtn").hidden = true; inp.hidden = false; inp.focus(); inp.select();
  });
  layer.addEventListener("keydown", e => {
    if (e.target.id === "f-newshelf" && e.key === "Enter") { e.preventDefault(); $("#addShelf").click(); return; }
    if (e.target.id !== "formTitleInput") return;
    if (e.key === "Enter") { e.preventDefault(); finishFormTitle(true); }
    if (e.key === "Escape") { e.stopPropagation(); finishFormTitle(false); }
  });
  layer.addEventListener("focusout", e => { if (e.target.id === "formTitleInput") finishFormTitle(true); });
  layer.addEventListener("input", e => { if (e.target.id === "f-tags") { draft.tagsText = e.target.value; $("#tagSugg").innerHTML = tagSugg(); } });
  layer.addEventListener("change", async e => {
    if (e.target.id !== "f-cover" || !e.target.files[0]) return;
    syncDraft();
    const msg = $("#coverMsg");
    try {
      msg.textContent = "사진을 불러오는 중…";
      const big = await resizeImage(e.target.files[0], 900, 0.85);
      const small = await resizeImage(e.target.files[0], 360, 0.75);
      draft._newCover = { blob: big.blob, dataUrl: big.dataUrl, small: small.dataUrl };
      // 미리보기는 그린 그림(canvas)을 바로 보여 준다
      $("#coverPrev").innerHTML = coverHTML({ ...draft, cover: null, coverData: null });
      const cv = big.canvas; cv.className = "prev-canvas"; $("#coverPrev .cover").appendChild(cv);
      msg.textContent = "표지를 골랐어요. 저장하면 표지가 들어가요.";
      $("#coverClear").hidden = false;
    } catch { msg.textContent = "이 사진은 열 수 없어요. JPG나 PNG 사진으로 다시 골라 주세요."; }
  });
  layer.addEventListener("submit", e => { e.preventDefault(); submitForm(); });
  // 서재 파일 불러오기
  let pendingRestore = null;
  let bkNote = "";
  $("#list").addEventListener("change", e => {
    if (e.target.id !== "restoreFile" || !e.target.files[0]) return;
    const fr = new FileReader();
    fr.onload = () => {
      const msg = $("#bkMsg");
      try {
        const d = JSON.parse(fr.result);
        if (!d || !Array.isArray(d.books)) throw 0;
        pendingRestore = { books: d.books, settings: d.settings || {} };
        msg.innerHTML = `<div class="notice" style="margin:8px 0 0">서재 파일에 책 <b>${d.books.length}권</b>이 있어요. 어떻게 할까요?
          <div class="row" style="margin-top:8px"><button class="btn primary sm" data-restore="merge">지금 서재에 더하기</button><button class="btn sm" data-restore="replace">이 파일로 바꾸기</button><button class="btn ghost sm" data-restore="cancel">그만두기</button></div>
          <div style="font-size:12.5px;margin-top:6px;color:var(--muted)">'바꾸기'를 고르면 지금 서재의 기록은 사라지고 파일의 기록만 남아요.</div></div>`;
      } catch { msg.textContent = "서재 파일이 아니에요. '서재 파일 저장'으로 만든 파일을 골라 주세요."; }
      e.target.value = "";
    };
    fr.readAsText(e.target.files[0]);
  });

  // ---------- 형광펜: 드래그로 고른 부분만 칠하기 ----------
  const float = $("#hlFloat");
  let pending = null;
  function offsetIn(qt, node, off) { const r = document.createRange(); r.selectNodeContents(qt); r.setEnd(node, off); return r.toString().length; }
  function onSelection() {
    pending = null;
    const sel = getSelection();
    if (!canWrite || !sel || !sel.rangeCount || sel.isCollapsed) { float.hidden = true; return; }
    const range = sel.getRangeAt(0);
    const qa = (range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement)?.closest(".qt");
    const qb = (range.endContainer.nodeType === 1 ? range.endContainer : range.endContainer.parentElement)?.closest(".qt");
    if (!qa || qa !== qb) { float.hidden = true; return; }
    const bq = qa.closest("blockquote");
    let a = offsetIn(qa, range.startContainer, range.startOffset), b = offsetIn(qa, range.endContainer, range.endOffset);
    const txt = qa.textContent;
    while (a < b && /\s/.test(txt[a])) a++;
    while (b > a && /\s/.test(txt[b - 1])) b--;
    if (b <= a) { float.hidden = true; return; }
    pending = { id: bq.dataset.b, i: +bq.dataset.i, a, b };
    const rect = range.getBoundingClientRect();
    float.innerHTML = PEN + "형광펜 칠하기";
    float.hidden = false;
    const fh = float.offsetHeight || 36;
    const top = rect.top - fh - 10 < 8 ? rect.bottom + 10 : rect.top - fh - 10;
    const half = (float.offsetWidth || 140) / 2;
    float.style.top = top + "px";
    float.style.left = Math.min(innerWidth - half - 8, Math.max(half + 8, rect.left + rect.width / 2)) + "px";
  }
  document.addEventListener("selectionchange", () => requestAnimationFrame(onSelection));
  window.addEventListener("scroll", () => { if (!float.hidden) onSelection(); }, true);
  float.addEventListener("pointerdown", e => e.preventDefault());
  float.addEventListener("mousedown", e => e.preventDefault());
  float.addEventListener("click", () => {
    if (!pending) return;
    const { id, i, a, b } = pending;
    const bk = books.find(x => x.id === id); if (!bk) return;
    const marks = getMarks(bk.quotes[i]).concat([[a, b]]);
    getSelection().removeAllRanges(); float.hidden = true; pending = null;
    setMarks(id, i, marks);
  });
  function markClick(e) {
    const bq = e.target.closest("blockquote[data-b]"); if (!bq || !canWrite) return false;
    const sel = getSelection(); if (sel && !sel.isCollapsed) return true;
    const id = bq.dataset.b, i = +bq.dataset.i;
    const bk = books.find(x => x.id === id); if (!bk) return false;
    if (e.target.closest("[data-hlclear]")) { setMarks(id, i, []); return true; }
    const m = e.target.closest("mark[data-m]");
    if (m) { const marks = getMarks(bk.quotes[i]); marks.splice(+m.dataset.m, 1); setMarks(id, i, marks); return true; }
    return false;
  }

  init();
})();
</script>

</body>
