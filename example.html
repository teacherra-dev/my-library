<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="icon-192.png">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>나의 서재 · 예시</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
<style>
/* Layout: library-card shelf — tabs + search, cover grid, detail sheet slides over */
:root {
  --paper: #eef1ea;
  --card: #fbfcf8;
  --ink: #1f2a3a;
  --muted: #5d6877;
  --line: #d3d9cd;
  --accent: #23477a;
  --accent-soft: #dbe4f1;
  --stamp: #b5651d;
  --danger: #a3332b;
  --hl: #f6e46a; --hl-edge: #d9c23a;
  --star: #c98a12;
  --ledge: #cdd3c4;
  --shadow: 0 1px 2px rgba(31,42,58,.08), 0 6px 18px rgba(31,42,58,.08);
  --f-display: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #151a20; --card: #1d242c; --ink: #e6eaee; --muted: #9aa5b1; --line: #2e3842;
  --accent: #8fb0e0; --accent-soft: #24354b; --stamp: #e0a060; --danger: #e27a70; --hl: #6b5d12; --hl-edge: #a8921f; --star: #e8b84a; --ledge: #36424e;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #151a20; --card: #1d242c; --ink: #e6eaee; --muted: #9aa5b1; --line: #2e3842;
  --accent: #8fb0e0; --accent-soft: #24354b; --stamp: #e0a060; --danger: #e27a70; --hl: #6b5d12; --hl-edge: #a8921f; --star: #e8b84a; --ledge: #36424e;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark }

/* 탭마다 바탕색: 읽은 책(연두 종이) · 읽는 중(모래빛) · 읽고 싶은 책(하늘빛) */
body[data-tab="reading"] { --paper: #f4eee4; --line: #ddd3c4 }
body[data-tab="want"] { --paper: #e8eef5; --line: #cfd8e3 }
body[data-tab="hl"] { --paper: #f6f3df; --line: #e2dcbd }
body[data-tab="year"] { --paper: #f1eaf0; --line: #ddd0db }
:root[data-theme="dark"] body[data-tab="hl"] { --paper: #1e1c13; --line: #3b3825 }
:root[data-theme="dark"] body[data-tab="year"] { --paper: #1c1720; --line: #382f3d }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body[data-tab="hl"] { --paper: #1e1c13; --line: #3b3825 } :root:not([data-theme="light"]) body[data-tab="year"] { --paper: #1c1720; --line: #382f3d } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body[data-tab="reading"] { --paper: #1d1a16; --line: #3a342c } :root:not([data-theme="light"]) body[data-tab="want"] { --paper: #141b24; --line: #2c3846 } }
:root[data-theme="dark"] body[data-tab="reading"] { --paper: #1d1a16; --line: #3a342c }
:root[data-theme="dark"] body[data-tab="want"] { --paper: #141b24; --line: #2c3846 }
* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; transition: background-color .25s ease }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
button, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 22px }
.title-btn { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-align: left; display: inline-flex; align-items: center; gap: 8px }
.title-btn .pen { width: 18px; height: 18px; color: var(--muted); opacity: 0; transition: opacity .15s }
.title-btn:hover .pen, .title-btn:focus-visible .pen { opacity: 1 }
@media (hover: none) { .title-btn .pen { opacity: .5 } }
.title-input { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--accent); border-radius: 8px; padding: 0 8px; width: min(100%, 16em) }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 5vw, 36px); line-height: 1.2; margin: 0; text-wrap: balance }
.sub { color: var(--muted); font-size: 14px; margin-top: 4px; font-variant-numeric: tabular-nums }
.motto { margin-top: 6px; font-family: var(--f-display); font-size: 15px; color: var(--muted); max-width: 100% }
.motto .title-btn { font-family: var(--f-display); font-weight: 400; text-align: left }
.motto .title-btn .pen { width: 14px; height: 14px; flex: none }
.motto .title-btn span { min-width: 0; word-break: keep-all; overflow-wrap: anywhere }
.motto .title-input { font-size: 15px; width: min(100%, 30em) }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 9px 14px; font-weight: 500 }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card) }
.btn.primary:hover { filter: brightness(1.08) }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)) }
.btn.ghost { border-color: transparent; background: transparent }
.btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 6px }
#addBtn { padding: 1px 10px; font-size: 12px; border-radius: 99px; line-height: 1.6; font-weight: 500 }
.head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px }
.who { font-size: 12px; color: var(--muted) }
.who button { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 12px }
.login { position: fixed; inset: 0; z-index: 60; background: var(--paper); display: grid; place-items: center;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)) }
.login-box { max-width: 360px; text-align: center; display: grid; gap: 14px; justify-items: center }
.login-box h2 { font-family: var(--f-display); font-size: 34px; margin: 0 }
.login-box p { margin: 0; color: var(--muted); font-family: var(--f-display) }
.login-box .btn { padding: 10px 20px; font-size: 15px; border-radius: 99px }
.login-note { font-family: var(--f-body) !important; font-size: 13px; line-height: 1.6 }
.login-err { color: var(--danger) !important; font-size: 13px; font-family: var(--f-body) !important }

/* 오늘의 문장 */
.today { background: var(--card); border-radius: 8px; padding: 8px 14px; margin-bottom: 16px; border-left: 3px solid var(--hl-edge); display: grid; grid-template-columns: 1fr auto; gap: 0 8px; align-items: start }
.today > * { min-width: 0 }
.today .lbl { display: contents }
.today .lbl > span { grid-column: 1; font-size: 11px; letter-spacing: .08em; font-weight: 600; color: var(--muted) }
.today .lbl > button { grid-column: 2; grid-row: 1 / span 3; padding: 0 4px; font-size: 12px; color: var(--muted); align-self: center }
.today .txt { grid-column: 1; font-family: var(--f-display); font-size: 16.5px; line-height: 1.6; color: var(--ink); -webkit-text-stroke: .3px currentColor; margin: 1px 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.today .src { grid-column: 1 }
.today .txt mark { color: inherit; background: linear-gradient(transparent 50%, var(--hl) 50%, var(--hl) 94%, transparent 94%) }
.today .src { border: 0; background: none; padding: 0; color: var(--muted); font-size: 12px; text-align: left }
.today .src:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px }

.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); margin-bottom: 14px }
.tabs { display: flex; gap: 2px; flex-wrap: wrap }
.tab { border: 0; background: none; padding: 10px 12px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
.tab .n { font-variant-numeric: tabular-nums; font-size: 13px; margin-left: 4px; color: var(--muted) }
.search { flex: 0 1 170px; min-width: 0; margin-bottom: 8px; border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 4px 12px; font-size: 13px }
.search::placeholder { color: var(--muted) }
.tagbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px }
.tagbar:empty { display: none }
.tag { display: inline-block; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 99px; padding: 2px 10px; font-size: 12.5px; line-height: 1.6 }
button.tag:hover { border-color: var(--accent); color: var(--ink) }
.tag[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card) }
.tag .c { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 3px }
#list { margin-top: 8px }
.shelfbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; align-items: center }
.shelfbar:empty { display: none }
.tag.sh { border-radius: 5px; font-weight: 500 }
.sh-sec { margin-bottom: 38px }
.sh-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; min-width: 0 }
.sh-head h3 { font-family: var(--f-display); font-size: 19px; margin: 0; word-break: keep-all }
.sh-head .c { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }
.sh-rename { border: 0; background: none; color: var(--muted); padding: 2px; opacity: .55; align-self: center; display: grid }
.sh-rename:hover { opacity: 1 }
.sh-rename svg { width: 15px; height: 15px }
.sh-input { font-family: var(--f-display); font-size: 18px; border: 1px solid var(--accent); border-radius: 6px; padding: 0 6px; background: var(--card); width: 12em; max-width: 100% }
.viewtog { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; background: var(--card) }
.viewtog button { border: 0; background: none; font-size: 12.5px; padding: 2px 11px; color: var(--muted) }
.viewtog button[aria-pressed="true"] { background: var(--accent); color: var(--card) }
.spines { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 3px; padding: 14px 8px 0; border-bottom: 7px solid var(--ledge); border-radius: 0 0 2px 2px; box-shadow: 0 7px 8px -7px rgba(0,0,0,.28) }
.spine { --sp: #6f7f68; --sp-ink: #fbfcf8; border: 0; padding: 22px 0 24px; flex: none; border-radius: 2px 3px 3px 2px; color: var(--sp-ink);
  background: linear-gradient(to bottom, transparent 12px, rgba(255,255,255,.22) 12px 14px, transparent 14px calc(100% - 16px), rgba(255,255,255,.22) calc(100% - 16px) calc(100% - 14px), transparent 0), linear-gradient(90deg, rgba(0,0,0,.14), rgba(255,255,255,.08) 30%, rgba(0,0,0,.06) 70%, rgba(0,0,0,.2)), var(--sp);
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 6px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s ease }
.spine { position: relative; width: var(--w); height: var(--h); transition: transform .15s ease, width .28s ease }
.spine .face { position: absolute; inset: 0; opacity: 0; transition: opacity .22s ease; pointer-events: none }
.spine .face .cover { height: 100%; aspect-ratio: auto; border-radius: 2px 4px 4px 2px; box-shadow: none }
.spine .face .ph { display: none }
.spine.peek, .spine:focus-visible { transform: translateY(-5px) }
.spine.peek[data-cover], .spine[data-cover]:focus-visible { width: calc(var(--h) * 0.667) }
.spine.peek .face, .spine:focus-visible .face { opacity: 1 }
@media (hover: hover) {
  .spine:hover { transform: translateY(-5px) }
  .spine[data-cover]:hover { width: calc(var(--h) * 0.667) }
  .spine:hover .face { opacity: 1 }
}
.faceout { border: 0; background: none; padding: 0; flex: none; width: 128px; margin-right: 6px; align-self: flex-end; transition: transform .15s ease }
.faceout:hover { transform: translateY(-4px) }
.faceout .cover { box-shadow: 0 2px 6px rgba(0,0,0,.28) }
.spine .st { writing-mode: vertical-rl; font-family: var(--f-display); font-weight: 700; font-size: var(--fs, 14px); line-height: 1.15; letter-spacing: .02em; min-height: 0; flex: 1 1 auto; max-width: 100%; white-space: nowrap }
.spine .sa { writing-mode: vertical-rl; font-family: var(--f-body); font-weight: 300; font-size: 10.5px; line-height: 1.15; opacity: .8; flex: none; white-space: nowrap; letter-spacing: .08em; padding-top: 7px; border-top: 1px solid currentColor; border-top-color: color-mix(in srgb, currentColor 35%, transparent) }
.author { font-family: var(--f-body); font-weight: 300; letter-spacing: .06em; color: var(--muted) }
.shelf-empty { align-self: center; color: var(--muted); font-size: 13px; padding: 26px 4px 30px }
.tag.sh.add { border-style: dashed; color: var(--muted) }
.shelfbar .sh-rename { margin-left: -4px }
.sh-new { font-size: 12.5px; border: 1px solid var(--accent); border-radius: 5px; padding: 2px 8px; width: 9em; background: var(--card) }
.sh-sec .grid { padding-bottom: 16px; border-bottom: 7px solid var(--ledge); border-radius: 0 0 2px 2px; box-shadow: 0 7px 8px -7px rgba(0,0,0,.28) }
.newshelf { display: flex; gap: 6px; margin-top: 8px; align-items: center }
.newshelf input { flex: 1; min-width: 0 }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 22px 16px }
.book { border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.cover { aspect-ratio: 2 / 3; width: 100%; max-width: 100%; border-radius: 3px 6px 6px 3px; overflow: hidden; box-shadow: var(--shadow); background: var(--card); position: relative; transition: transform .18s ease }
.book:hover .cover { transform: translateY(-3px) }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block }
.cover img.blur { object-fit: cover; filter: blur(12px) saturate(1.1); transform: scale(1.2); opacity: .9 }
.cover::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: linear-gradient(90deg, rgba(0,0,0,.18), transparent) }
.ph { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 16px 14px 14px 18px;
  background: var(--accent-soft); color: var(--ink) }
.ph b { font-family: var(--f-display); font-size: 17px; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere }
.ph span { font-size: 12px; color: var(--muted) }
.meta { min-width: 0; display: flex; flex-direction: column; gap: 2px }
.meta .t { font-family: var(--f-display); font-weight: 700; font-size: 14.5px; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere }
.meta .a { color: var(--muted); font-size: 12.5px; font-family: var(--f-body); font-weight: 300; letter-spacing: .05em }
.meta .one { font-family: var(--f-display); font-size: 13.5px; line-height: 1.5; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px }
.stars { color: var(--star); letter-spacing: 1px; font-size: 13px; line-height: 1.3 }
.stars .off { color: var(--line) }
.stamp { display: inline-block; align-self: flex-start; margin-top: 6px; font-size: 12px; font-variant-numeric: tabular-nums; letter-spacing: .04em;
  color: var(--stamp); border: 1.5px solid currentColor; border-radius: 3px; padding: 0 6px; transform: rotate(-2deg) }
.stamp.soft { color: var(--accent); border-style: dashed; transform: none }
.chip { display: inline-block; font-size: 11px; letter-spacing: .04em; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-left: 4px; vertical-align: middle }

/* 읽고 싶은 책: 목록 */
.wlist { list-style: none; margin: 0; padding: 0; max-width: 720px; border-top: 1px solid var(--line) }
.wlist button { width: 100%; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 13px 4px }
.wlist button:hover { background: var(--card) }
.wlist .t { font-family: var(--f-display); font-weight: 700; font-size: 17px; word-break: keep-all; overflow-wrap: anywhere; min-width: 0 }
.wlist .a { color: var(--muted); font-size: 13.5px; font-family: var(--f-body); font-weight: 300; letter-spacing: .06em }

.empty { border: 1.5px dashed var(--line); border-radius: 12px; padding: 40px 20px; text-align: center; color: var(--muted) }
.empty p { margin: 0 0 14px }
.notice { background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-bottom: 18px }

/* 돌아보기 */
.years { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 26px }
.tile { background: var(--card); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow) }
.tile .v { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums }
.tile .v small { font-size: 15px; font-weight: 400; margin-left: 2px; color: var(--muted) }
.tile .k { font-size: 13px; color: var(--muted) }
.r-sec { margin-bottom: 28px }
.goal { background: var(--card); border-radius: 10px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 14px }
.g-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: 15px }
.g-top .g-num { color: var(--accent); font-family: var(--f-display); font-size: 18px }
.g-bar { height: 10px; border-radius: 99px; background: var(--paper); margin-top: 10px; overflow: hidden }
.g-bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease }
.g-note { font-size: 12.5px; color: var(--muted); margin-top: 6px }
.goal-input { width: 5.5em; border: 1px solid var(--accent); border-radius: 6px; padding: 3px 8px; background: var(--paper); font-variant-numeric: tabular-nums }
.exp { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px }
.exp-btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 14px 16px; text-align: left; display: flex; flex-direction: column; gap: 4px }
.exp-btn:hover { border-color: var(--accent) }
.exp-btn b { font-family: var(--f-display); font-size: 16px }
.exp-btn span { font-size: 13px; color: var(--muted) }
.exp-msg { font-size: 13px; color: var(--muted); min-height: 1.2em; margin: 8px 0 0 }
.m-h { font-family: var(--f-display); font-size: 19px; margin: 0 }
.m-l { font-size: 13px; color: var(--muted); margin-bottom: 6px }
.m-check { display: flex; align-items: center; gap: 8px; font-size: 14px }
.r-sec h3 { font-size: 13px; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0 0 10px }
.months { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; align-items: end; height: 190px; background: var(--card); border-radius: 10px; padding: 14px 12px 10px; box-shadow: var(--shadow) }
.mo { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; min-width: 0 }
.mo .cnt { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink); min-height: 1em }
.mo .b { width: 100%; max-width: 30px; background: var(--accent); border-radius: 4px 4px 1px 1px; min-height: 2px }
.mo .b.zero { background: var(--line) }
.mo .m { font-size: 11.5px; color: var(--muted); white-space: nowrap }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 12px }
.shelf .book { gap: 4px }
.shelf .book .cap { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums }
.best { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.best button { border: 0; background: var(--card); box-shadow: var(--shadow); border-radius: 8px; padding: 10px 14px; width: 100%; text-align: left; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline }
.best .t { font-family: var(--f-display); font-weight: 700 }
.best .one { flex-basis: 100%; font-family: var(--f-display); font-size: 14px; color: var(--muted) }

/* sheet */
.overlay { position: fixed; inset: 0; background: rgba(15,20,28,.45); display: flex; justify-content: flex-end; z-index: 20 }
.sheet { background: var(--card); width: min(560px, 100%); height: 100%; overflow-y: auto;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) 20px;
  box-shadow: -8px 0 30px rgba(0,0,0,.18) }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px }
.sheet-head h2 { font-family: var(--f-display); font-size: 22px; margin: 0 }
.detail-top { display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: start; margin-bottom: 18px }

c5DfanNuQl1dZAM+WMbdoJLen+JrbspHmsoZJDl2QEnFWNo9KMY6UXKUbdTktLWOHxfMjI/mOsjIxUjI3DJ/MkfhXXVH5Efned5a+YBjfjnHpmpKG7ihHlQUUUUixG+6aWiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigD//Z", "createdAt": 1793064300000, "date": "", "memo": "", "oneLine": "", "quotes": [{"marks": [], "page": "71", "text": "빨랫줄에 오소소 널린 새하얀 빨래를 보면 내 슬픔도 고민도 깨끗이 빨아 탁탁 털어 널고 싶어진다."}, {"marks": [], "page": "", "text": "하지만 우리는 문명화되지 않았던 시절의 노동의 소중함과 느리고 불편하지만 낭만이 있던 추억을 지금도 사랑한다."}, {"marks": [], "page": "91", "text": "세상에는 수많은 사람들과의 관계가 존재한다. 가족만큼 촘촘한 이웃도 있고, 근근이 안부만 묻는 관계도 있고, 아주 오랜 시간 보지 않아도 용수철처럼 제자리로 돌아와 가까워지는 관계도 있고, 매일 보는 사이지만 절대 간격이 좁혀지지 않는 사이도 있다."}, {"marks": [], "page": "100", "text": "누구나 반짝거리는 시절과 건강하게 이별해야 하는 날이 온다. 하나같이 지나간 건강한 날들의 회상이어서 자꾸 눈물이 났던 거다. 살아가면서 만나는 많은 정서들을 주머니에 담으며 지낸다면, 나이가 들수록 주머니에 가장 많아지는 건 ‘그리움’이 아닐까. 조약돌을 계속 쓰다듬으면 조약돌에도 광이 나는 것처럼 그리움이라는 단어가 가장 맨들거릴 것이다."}, {"marks": [], "page": "113", "text": "어릴 적 내가 자리에 누워 있으면 들리던 할머니와 엄마의 시시콜콜한 잔소리들이 지금도 마음을 따뜻하게 한다. 엄마만이 아라고 있는 김치를 담글 때의 순서라든지, 닭볶음탕을 끓일 때의 제일 적당한 당근의 크기는 어느 정도인지, 이불 빨래는 어떤 날씨에 하는 것이 좋고, 여름이 되면 어떤 돗자리를 사는 것이 더 좋은지, 지난 시간 동안 엄마가 말했던 잔소리들을 하나하나 되짚어볼 참이다."}, {"marks": [], "page": "136", "text": "진정한 탐험의 여정은 새로운 경치를 찾는 데 있는 것이 아니라 새로운 시각으로 보는 데에 있다."}, {"marks": [], "page": "156", "text": "매년 찾아와 떠나지 않을 것 같던 긴 겨울도 결국엔 지나간다. 인생은 끝없이 사계절을 받아들이며 반복된다. 봄을 받아들이고, 여름을 인정하며, 가을을 기다리고, 겨울을 맞이하는 일."}, {"marks": [], "page": "164", "text": "사람은 결국 보고 싶은 사람을 보고, 하고 싶은 일을 하며 살아야 행복한 단순한 존재다. 내 마음에 순응하며 살아가는 일이 쉽지 않은 세상이더라고, 사실보다 미화된 성공담보다는 나의 속도에 맞추어 살아가는 삶을 살고 싶다."}, {"marks": [], "page": "", "text": "넘어져도 무조건 일어나라고 섣부른 응원만 하는 게 아니다. 일단 오늘부터 행복해지는 것이 중요하니, 곁에 있는 사람들과 오늘의 행복을 잘 느끼고 함께 내일을 이야기해보자고 말한다. 더 나은 내일을 위해 오늘을 견뎌나가는 삶이 아니라 더 나은 내일을 위해 오늘을 즐기는 삶."}, {"marks": [], "page": "", "text": "삶은 우리가 만들어나가는 것이에요. 언제나 그랬고, 앞으로도 그럴 겁니다.-"}], "rating": 0, "shelf": "에세이", "status": "read", "tags": [], "title": "모지스 할머니, 평범한 삶의 행복을 그리다", "updatedAt": 1793065456358, "id": "imp01"}, {"au 달았다.\n사람을 사귀는 것보다\n자기 자신과 사이좋게 지내는 것이\n더 어렵다는 사실을."}, {"marks": [], "page": "", "text": "이것밖에 없다고 하니 싱싱한 수선화를 양팔 가득 안고 싶은 강한 충동을 느꼈다."}, {"marks": [], "page": "", "text": "사람은 가지지 못한 것에 욕심을 낸다."}, {"marks": [], "page": "", "text": "나는 매일 아침 몹시 겸허하고 선량한 사람으로 변한다. 작고 여린 나뭇잎을 기특해하다 보면 이윽고 우주까지도 기특하게 여겨졌다. 그런다고 자리를 박차고 일어나 나무까지 달려가지는 않지만, 제아무리 마음이 언짢을 때라도 창밖을 보고라면 상쾌한 기분이 얼굴을 쏙 내민다."}, {"marks": [], "page": "", "text": "나는 깨달았다. 사람을 사귀는 것보다 자기 자신과 사이좋게 지내는 것이 더 어렵다는 사실을, 나는 스스로와 사이좋게 지내지 못했다. 그것도 60년씩이나."}, {"marks": [], "page": "", "text": "나는 나와 가장 먼저 절교하고 싶다."}, {"marks": [], "page": "", "text": "편안하고 안락하다. 화사한 마음 따윈 잊어버렸다. 세월만이 길러낼 수 있는 신뢰. 꽃도 태풍도 뛰어넘어 망중한을 즐길 날을 위해 결혼하는 것이다."}, {"marks": [], "page": "", "text": "인간은 신기하다. 인생이 갑자기 알차게 변했다. 매일이 즐거워서 견딜 수 없다. 죽는다는 사실을 아는 건 자유의 획득이나 다름없다."}], "rating": 0, "shelf": "에세이", "status": "read", "tags": [], "title": "사는 게 뭐라고", "updatedAt": 1793064299000, "id": "imp02"}, {"author": "김언수", "cover": null, "coverData": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAGuASwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDzb4iTyf8ACwvES5wFv5cY471yu/OeuT712/j+zjl+IGvsZ9pa+l7Z5z0rml02NuBdJuHYKf51YrozAMkDk08KWXJPA4I7/WtE6Sc/LOhOeh4xUUlnLCc7lY5/hOaLBdFTG0EDB96ac89c1ZeMnJEWAO39aelhPLjZGxXH5UWC6Krbv 다고 생각했어. 그날 오후에, 둘은 아주 천천히, 마치 그 낯선 동네에 집을 얻으려는 나이 든 신혼부부마냥 골목 여기저기를 구경하고 다녔어."}, {"marks": [], "page": "", "part": "미스조와 거북이와 나", "text": "어떤 사람이 제멋대로 나를 침범하고 휘젓는 것을 묵묵히 견디게 하는 건 사랑이지만, 또 그이유로 떠나기도 하지. 사랑을 지키기 위해서."}, {"marks": [], "page": "", "part": "미스조와 거북이와 나", "text": "그래도 우리는 살아갈 것이고 천천히 소멸해갈 것이다. 샥샥은 샥샥의 속도로, 나는 나의 속도로, 바위는 바위의 속도로."}, {"marks": [], "page": "", "part": "아무것도 아닌 것", "text": "하늘이 유난히 새파랬다. 파란 빛깔의 돔형 지붕이 이 세계를 뚜껑처럼 덮고 있는 것 같았다. 거대한 뚜껑이었다."}, {"marks": [], "page": "", "part": "우리 안의 천사", "text": "애니의 관이 화장로에 들어가려는 찰나, 남우가 울기 시작했다. 그는 꺽꺽 소리 내어 통곡했다. 내 눈에서도 주르르 눈물이 흘렀다. 이제 우리는 어떻게 해도 헤어질 수 없는 사이가 되어버렸다는 것을 알았다."}, {"marks": [], "page": "", "part": "우리 안의 천사", "text": "내가 잠시 한눈을 팔아도 세상에는 아무 일도 일어나지 않는다. 단죄가 또 유예되었다는 사실에 나는 안도하고 절망했다. 극적인 파국이 닥치면, 속죄와 구원도 머지않을 텐데. 또다시 살아가기 위하여 나는 바다 쪽을 향해 무거운 발걸음을 뗐다."}, {"marks": [], "page": "", "part": "영영, 여름", "text": "과거의 정열과 무관하게 현재 그들의 삶은 몇 모금 마신 다음 뚜껑을 열어놓고 방치한 페트병 속 탄산수 같았다."}, {"marks": [], "page": "", "part": "영영, 여름", "text": "문제가 분명해 보일 때 어떤 사람은 원인을 제거하는 쪽을 택한다. 그러나 모두가 그런 것은 아니었다. 어떤 사람은 방 안으로 조용히 숨어들어 문을 걸어 잠근다. 인생이 반드시 순간순간의 암흑을 돌파하며 앞으로 나아가는 고단한 여정일 필요는 없지 않은가?"}, {"marks": [], "page": "", "part": "영영, 여름", "text": "바래는 것과 사라지는 것 중에서 어떤 쪽이 더 나을까. 전화를 끊고서 나는 천천히 침을 삼켰다."}, {"marks": [], "page": "", "part": "영영, 여름", "text": "단단하고 부서지기 쉬운 것들, 부서지지 않는 것들에 대하여 생각하는 동안 해가 완전히 사라졌다. 어둑한 하늘에 해가 있던 흔적처럼 투명한 워의 테두리가 남았다. 어떤 비밀을 이해하기 위해서라면 한동안 여기 더 머물러야 한다는 것을 알았다."}, {"marks": [], "page": "", "part": "영영, 여름", "text": "순식간에 20년이 지나버렸다. 침묵만이 남은 미래에서 나는 암흑과 뒤섞일 때까지 앉아 있었다."}, {"marks": [], "page": "", "part": "밤의 대관람차", "text": "누구나 죽는다. 언젠가 장의 부고도 받게 될 것이다. 장이 양의 부고를 받는 것이 먼저일 수도 있었다. 최후의 문장이 누구의 것이든 애도는 남아 있는 자의 의무였다. 그녀에겐 여전히 긴 오후가 남아 있었다."}, {"marks": [], "page": "", "part": "서랍 속의 집", "text": "눈으로 확인하지 않아도 믿는 이들이 있었다. 눈으로 확인하지 않아야 믿는 이들도 있었다. 더 철저히 믿는 쪽이 이기는 것이 거래의 규칙인지도 몰랐다."}, {"marks": [], "page": "", "part": "서랍 속의 집", "text": "달리는 내내 부부는 정적을 지켰다. 대화가 없어도, 음악이 없어도, 라디오 소리가 없어도, 사랑이 없어도, 세상 모든 소리와 빛이 사그라진 곳에서도 어색하지 않은 관계였다."}, {"marks": [], "page": "", "part": "안나", "text": "아니에요. 고통은 울퉁불퉁한 자갈길에서 맨발로 혼자 버둥거리는 것과 비슷해서, 누가 손을 내밀면 조금 덜 어렵게 빠져 나올 수 있어요."}, {"marks": [], "page": "", "part": "안나", "text": "누군가에게 고마운 마음을 가지는 것은 참 좋은 일이라고 말하면서 경은 아이의 얼굴을 쓰다듬었다. 벽에 붙은 하트 모양의 수면 등을 끄자 세상이 꽉 닫힌 어둠에 잠겼다."}, {"marks": [], "page": "", "part": "작가의 말", "text": "소설은 어떤 풍경 속으로 우리를 끌어당기는 힘과 그 유혹에 이끌리는 욕망이 협업하는 구성체라고도 생각한다."}, {"marks": [], "page": "", "part": "작가의 말", "text": "누구는 질서를 버티고 누구는 공허를 버티는 것이 아니라, 또는 무력한 사람이 있고 용감한 다른 사람이 있는 것이 아니라, 모두 무언가를 버티면서 용감해지기기를 원하다 다시 무력해지기를 거듭하는 것이리라."}], "rating": 0, "shelf": "한국 소설", "status": "read", "tags": [], "title": "상냥한 폭력의 시대", "updatedAt": 1793067380331, "id": "imp04"}, {"author": "사노 요코", "cover": null, "coverData": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAG6ASwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD1rc394/nRub+8fzpKK2OS7F3N/eP50bm/vH86SigLsXc394/nRub+8fzpKKB3F3N/eP50bm/vH86SigLsXc394/nRub+8fzpKKAuxdzf3j+dG5v7x/OkphniWURNKgkIyELDJ/Ci3YVyTc394/nRub+8fzpKKB3F3N/eP50bm/vH86SigNRdzf3j+dG5v7x/OkooC4u5v7x/Ojc394/nSUUBcXc394/nRub+8fzpKKAuxdzf3j+dG5v7x/OkooC7F3N/eP50bm/vH86SigLsXc394/nRub+8fzpKKAuLub+8fzo3N/eP50lFArsXc394/nRub+8fzpKKAuxdzf3j+dG5v7x/OkooC7F3N/eP50bm/vH86SigLsXc394/nRu ybdYzn6iqlnqFxYJcrAygXMJhkyM5U4z/KqtFVyRtaw7BRRRVDCiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigD//2Q==", "createdAt": 1793064296000, "date": "", "memo": "", "oneLine": "", "quotes": [{"marks": [], "page": "", "text": "사람은 죽을 때 까지 살아있다."}, {"marks": [], "page": "", "text": "내가 사랑하는 사람은 모두 죽은 사람이다. 나는 알고 싶다. 죽은 뒤에서 미워하고픈 사람이 나타날까. 아무리 싫은 사람이라도 죽으면 용서하게 될까."}, {"marks": [], "page": "", "text": "“그렇게 살면 어떤 기분이 들어?” 내가 묻자 그는\n“바다에서 수면이 코 아래 1센티미터까지 차오른 기분이지, 발로 헤엄치면서 계속 흐느적거리지 않으면 바닷물이 콧속으로 들어오는 거야.”라고 말했다.\n꽤나 무서운 인생이 아닌가. 나라면 차라리 눈 딱 감고 물속으로 들어가 죽는 게 편할 것 같다."}, {"marks": [], "page": "", "text": "“사노 씨, 가슴 두근거릴 일이 없어진다는 건 쓸쓸하네요.”\n“흠, 마지막으로 두근거린 건 언제쯤인데요?”\n“어느 날 문득 두근거림이 없어졌단 사실을 깨달았어요.”\n으음, 나는 자각조차 하지 못했다. 벌써 몇십 년이나 두근거린 적이 없는데도 아무렇지 않았다.\n나도 질세라 두근거릴 일을 발굴하기로 마음먹었다."}, {"marks": [], "page": "", "text": "하지만 나는 최근의 줄리도 좋다. 지금 그는 외모 따위 개의치 않고 퍼먹은 것처럼 뚱뚱해졌다. 뚱뚱해도 태연자약해서 대범하게 느껴진다. 그에 비해 필사적으로 체형을 유지하는 고 히로미는 왠지 좀스럽고 옹졸해 보인다."}, {"marks": [], "page": "", "text": "마치 음악과도 같은 인생이다. 하지만 그녀는 사람을 원망하지 않는다. 원망에는 지속성이 필요하다."}, {"marks": [], "page": "", "text": "인간에게 언어란 매우 중요하다. 언어만이 인간ㄴ을 증명한다고도 할 수 있다."}, {"marks": [], "page": "", "text": "입버릇이 나쁜 인간은 고릴라보다도, 소보다도 못하다."}, {"marks": [], "page": "", "text": "동물들은 고독을 견디는 강인하고도 적막한 눈을 지니고 있다. 그러나 언어를 사용하는 동물은 고독한 눈을 잃어버렸다. 그런 눈은 온갖 욕망을 표현하는 도구로 전락항혀 탐욕스럽게 번들거린다. 우리 인간은 숙명적으로 그렇게 변해버렸다."}, {"marks": [], "page": "", "text": "하지만 그런 건 불가능했다. 무덤을 사거나 장례를 치를 절을 정하는 등의 준비를 해봐도, 살아 있으면 그만 잊어버리고 만다. 내가 죽는다는 사실을."}, {"marks": [], "page": "", "text": "“가장 중요한 것은 돈으로 살 수 없다.” 내게 가장 중요한 것은 무엇이었을까?\n아마도 ‘정情’이겠지."}, {"marks": [], "page": "", "text": "눈앞에서 사람이 픽픽 죽으며, 죽음이란 정말로 단순하고도 당연한 일처럼 여겨진다.\n나는 두려움과 공포를 모르는 사람이 되었다."}, {"marks": [], "page": "", "text": "죽지 않는 사람은 없다.\n죽어도 용서할 수 없는 사람은 아무도 없다.\n그리고 세계는 점점 쓸쓸해진다."}, {"marks": [], "page": "", "text": "아폴로호에 탄 과학자 세 사람은 우주에서 지구를 본 순간 모두 종교를 가졌다고 하죠. 인간은 자신의 지식을 뛰어넘는 광경을 보면 묘한 방식으로 순화되나 봐요."}, {"marks": [], "page": "", "text": "그때 나는 깜짝 놀랐다. 인간의 손바닥이란 이렇게 따뜻한 것인가. 그 따뜻함이 몸속으로 번져나갔다."}, {"marks": [], "page": "", "text": "아무리 냉정하고 침착한 사람이라도, 생각의 가장 안쪽과 마음의 가장 밑바닥에 무엇이 있는지는 본인조차 알 수 없다."}, {"marks": [], "page": "", "text": "막상 부닥쳐보지 않으면 모른다."}, {"marks": [], "page": "", "text": "어릴 적에 더 이상 가지고 놀지 않게 된 유리구슬 하나를 아무래도 찾을 수 없었을 때 느꼈던, 어쩔 도리 없는 쓸쓸함과도 비슷한 기분이 들었다."}, {"marks": [], "page": "", "text": "별안간 나는 이 세상이 아름답다는 생각이 들었다. 그렇게 생각하는 나 또한 원망과 분노의 개흙에 전신이 갈가리 찍어 발겨져 있다."}, {"marks": [], "page": "", "text": "나도 내일 죽을지 10년 뒤에 죽을지 모른다. 내가 죽더라도 아무 일도 없었던 양 잡초가 자라고 작은 꽃이 피며 비가 오고 태양이 빛날 것이다. 갓난아기가 태어나고 양로원에서 아흔넷의 미라 같은 노인이 죽는 매일매일. 그럼에도 불구하고 나는 이 세상이 아름답다고 생각하며 죽고 싶다. 똥에 진흙을 섞은 듯 거무죽죽하고 독충 같은 내가 그런 생각을 한다."}, {"marks": [], "page": "", "text": "고흐의 그림 속 빛나는 터치는 그가 창조해낸 것이 아니라, 실제롤 그의 눈에 보였던 광경이 아닌가. 정신병으로 세상을 뜬 고흐는 죽음의 곁에 있었기 때문에 세상이 그처럼 불타듯 보였던 게 아닌가."}, {"marks": [], "page": "", "text": "죽음에 직면한 사람에게는 분명 이 세상의 자연이 기이할 정도로 아름답게 밀려들지 않을까."}], "rating": 0, "shelf": "에세이", "status": "read", "tags": [], "title": "죽는 게 뭐라고", "updatedAt": 1793064296000, "id": "imp05"}, {"author": "김진나", "cover": null, "coverData": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAGNASwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD3SceZFkD5l6iq6uy4weKtuQv7wdCOaqYJGQKBD/tDLhSOaVbhycbefSox8w2nq C1L8Wnac3Mupbfar0OnaCpG7Ugfq2KKK4K3N0kz16Dpr7Cf3/wCZt6faaErDZeIf+BZrqtOsdEfHmX6D8cUUV4uLjJp+8z26dRqHuq3odDDpvhvaAbqAn18ypm0nw8w+W9hX6SiiivDnGafxv7zBzqX+Jkf9jaHnjVEH0kFWrex0mAgpq3/kWiis5qTWsn+H+Q25y3kzVils0ACX6t/20FWRcw4/1yn/AIGKKK4Z0Y3OKpT8xDeJj5ShP+8KoXdxdyKRFEp+jUUVpQjGDvY4MRRTjuzn7qHUCxLxPj26Vly26DiaME980UV9bl2Ibtoj5PHUlTd07+pVfTrGQ5aOPFVpNI04jKrGPbNFFfT0ddTip4mUXokVJNNsU5Pl4+tVpLfTlzkp+DUUVtKKPZoVZTjdlKeLTccEZ+tZk9tbE/IRz70UVzyOgoS2O7hXxVc6VMTxJmiikopibsMbSLrsxNRnTL1emaKKfIg5mN+wagvTd+dO+zal6tRRRyhzH//Z", "createdAt": 1793064294000, "date": "", "memo": "좋아하는 작가의 단편 소설.\n소외되고 무시당하는 사람들과 책들의 이야기가 역시나 인상적이다.\n특히 책의 비관적인 현실을 다룬 작품들이 재미있다. 이승우는 \"소설은 세상을 향한 내 가난한 소통의 수단이다. 나는 절필하지 않을 것이다\"(작가의 말)라고 단호하게 말하며, 열심히 소설을 쓰고 나는 열심히 소설을 읽고 있으니 그리 비관적이지는 않는 것 같다.", "oneLine": "", "quotes": [{"marks": [], "page": "", "part": "모르는 사람", "text": "아버지가 왜 떠났는지 오랫동안 궁금했다. 그 궁금증 속에는 아버지가 무엇으로부터 떠나려 했으까, 하는 질문이 숨어 있다. 무엇으로부터 떠났고 떠나려 했는지 안다면 왜 떠났고 떠나려 했는지도 알 수 있을 거라고 생각했던 것 같다. 떠난다는 것은 붙ㅌ어 있는데서 자기를 떼어내는 것을 뜻한다. 아버지는 어디서, 무엇으로부터 자기를 떼어내기를 원했던 것일까?"}, {"marks": [], "page": "", "part": "모르는 사람", "text": "이 세상은 견디는 것이다, 라고 말한 사람은 아버지였다."}, {"marks": [], "page": "", "part": "모르는 사람", "text": "가슴속에 뭄언가가 가득 차오르는 게 느껴졌다. 조금만 건드려도 금방 터져버릴 것 가틍ㄴ 그것이 무엇인지 모르지 않았다. 그러나 그 언젠가처럼아버지의 서재로 달아날 수는 없었다. 나는 바로 대답하지 못했다. 한참 있다가, 살고 싶은 삶을 살았으니, 네 아버지는 행복했겠구나, 하고 잦아드는 목소리로 어머니가 말했다."}, {"marks": [], "page": "", "part": "복숭아 향기", "text": "약간의 침문 후에, 다른 게 죄가 아니다, 욕심도 죄고 미혹도 죄고 분별력 없는 것도 죄다, 하고 자조 섞인 어조로 말했다."}, {"marks": [], "page": "", "part": "복숭아 향기", "text": "나는 내가 무엇을 원하는지 도무지 알 수 없었는데, 그것은 아무것도 말해주지 않아도 다 알 것 같으면서 또 모든 걸 말해준다 해도 아무것도 모를 것 같았기 때문이었다."}, {"marks": [], "page": "", "part": "복숭아 향기", "text": "그런데 왜 그랬을까, 나는 그 사람이, 받아들여졌어. 그 사람을 그냥 두고 달아나면 안 될 것 같아졌어. 천지를 뒤덮은 복숭아 향기 때문이었을까, 그 사람이 어찌나 측은하던지 마음이 저절로 그쪽으로, 마치 너울손이 그런 것처럼, 쭉 뻗어 나가는 걸 어쩔 수가 없었어."}, {"marks": [], "page": "", "part": "복숭아 향기", "text": "천지에 복숭아 향기만 가득했지. 취하는 것 같았어. 복숭아 향기 탓인지 어딘가 다른 데서 온 것 같은 묘한 분위기의 그 사람 인상 때문이었는지 모르겠어."}, {"marks": [], "page": "", "part": "복숭아 향기", "text": "그때 이런 생각을 했어. 아, 사람의 운명이란 게 이렇게 정해지는가보구나."}, {"marks": [], "page": "", "part": "윔블던, 김태호", "text": "현재의 나는 과거의 내가 내가 아니라고 주장하고 싶지만 그 주장이 허구라는 것은 현재의 내가 누구보다 잘 안다고, 알게 된 이상 모르는 것처럼 가만히 있을 수 없다고 그는 말했고 나는 들었다. 그의 모든 말들이 참이라는 사실을 증명해줄 사람은 없다."}, {"marks": [], "page": "", "part": "강의", "text": "그는 모든 것을 혼자서 감당하려고 했다. 감당할 수 있는 데까지 감당하려고 했고, 어떻게든 감당해냈다. 그러다가 어떻게도 감당할 수 없는 순간이 오자 어디에도 의지하지 않고, 이젠 지쳤다, 하고 숨을 멈춰버렸다."}, {"marks": [], "page": "", "part": "찰스", "text": "스치기만 해도 민감하게 알아차리는 살갗의 반응과 같은 것이었으리라. 그가 내 이름의 유래에 대해 말하고 있다는 식이 착각을 했을 리는 만무하지만, 무언가를 공유하고 있는 사람을 향한, 거의 본능에 가까운 신뢰 같은 것이 꿈틀하였던 것 같은데, 그와 동시에 그 꿈틀거리는 무조건의 신뢰에 제동을 걸려는 제동이 반사적으로 일어났던 것 같기도 하다."}, {"marks": [], "page": "", "part": "찰스", "text": "궁금한 것이 모두 물음이 되는 것은 아니다. 물음은, 때때로 그 물음에 대한 대답을 감당할 것을 요구한다. 어떤 물음들은 그런 자신감 내지 책임감 없이는 물어질 수 없다. 궁금함에도 불구하고 묻지 않거나 궁금하지 않은데도 불구하고 묻는 것은 그 때문이다. 어떤 궁금한 것들은 물어야 하지만 묻기가 어렵기 때문에 묻지 않고, 어떤 궁금하지 않은 것들은 묻지 않아도 되지만 묻기가 쉽기 때문에 물어진다. 궁금한 것은 왜 궁금하고, 궁금함에도 불구하고 어떤 것들은 왜 묻기가 어려운가. 궁금한 것은 닫혀 있는 상자이기 때문이고, 그런데도 묻기가 어려운 것은 그것을 열었을 때 무슨 일이 일어날지 알 수 없기 때문이다. 더 정확하게 말하면 무슨 일이 일어날지 어렴풋이, 어렴풋이만 예감하고 있기 때문이다."}, {"marks": [], "page": "", "part": "신의 말을 듣다", "text": "아무도 그가 흔들린다는 걸 인식하지 못했다. 그를 흔들리게 한 사람조차 그가 흔들린다는 사실을 인식하지 못했다. 그를 흔들리게 한 사람조차 그가 흔들린다는 사실을 인식하지 못했다. 것은 그를 흔들리게 한 사람에게 그를 흔들리게 하려는 의도가 없었기 때문이다. 바람이 불면 나뭇잎이 흔들리지만, 그 나뭇잎을 흔들리게 하려고 바람이 분 것이라고 할 수는 없다. 나뭇잎이 흔들렸다는 사실만으로 바람에게 그 나뭇잎을 흔들리게 하려는 의지가 있었다고 단정할 할 수는 없다."}, {"marks": [], "page": "", "part": "신의 말을 듣다", "text": "그런데도 그는 고개를 들지 않았기 때문에 수철이 자기를 보고 있지 않을 리 없다는 생각을 떨쳐버릴 수 없었다. 그 생각을 떨쳐버리려면 수철이 자기를 보고 잉ㅆ지 않다는 걸 확인해야 했지만 자기를 보고 있지 않다는 걸 확인하려다가 자기를 보고 있다는 걸 확인하게 될까봐, 그것이 두려워서 확인하려는 시도를 하지 못했다."}, {"marks": [], "page": "", "part": "신의 말을 듣다", "text": "그 말을 듣자마자 살면서 내가 저질러온 숱하게 많은, 그러나 발각되지 않아 나만 알고 있는 크고 작은 허물들이 우루루 떠오르는 거야. 살면서 잘못한 게 참 많더라."}, {"marks": [], "page": "", "part": "신의 말을 듣다", "text": "말한 것이 없어서가 아니라 말할 수 없어졌기 때문이다. 혹은 말하지 않기로 마음먹었기 때문이다. 말해지기 위해서는 말할 것이 ‘있어야’하고, ‘있는’것을, 혹은 있다는 것을 ‘알아야’한다.\n그러나 ‘있고’, 있는 것을 ‘안다’고 해서 다 말해지는 것은 아니다. 있고, 있다는 것을 앎에도 불구하고 어떤 것은 말해질 수 없거나 말하지 않기로 결정됨으로써 말해지지 않는다. 그것들은 언제든 말해질 수 있는 상태로 웅크리고 있다. 그것들은 말해지지 않음으로써 ‘있고’, 있다는 것을 ‘안다’는 사실을 상기시킨다."}, {"marks": [], "page": "", "part": "신의 말을 듣다", "text": "생각이 뭉쳐 있을 때면 두 바에 자기를 맡기고 무작정 걷는 것이 그가 하는 일이었다. 그러면 뭉친 생각들이 풀리기도 하고 풀렸다가 뒤엉키기도 했다. 엉켰다가 다시 뭉치기도 했지만 풀리기 전과 같은 상태로 뭉치는 법은 없었다. 늘 그런 것은 아니지만 그는 자주 그의 두 발이 그의 뇌보다 판단을 더 잘한다는 생각을 하곤 했다."}, {"marks": [], "page": "", "part": "신의 말을 듣다", "text": "그는 자기도 모르게 다시금 뛰다시피 걸었다. 바람이 쉬쉬 소리를 내며 스쳐갔다. “오래전에 먹은 신 포도가 지금의 이를 시게 하지 않는다. 나를 살린 말이야, 이게. 지금의 이를 시게 하는 것은 방금 먹은 신 포도다. 나는 이렇게 이해했다. 이것을 저것으로 대체할 수 없고 저것으로 이것을 덮을 수 없다.”"}, {"marks": [], "page": "", "part": "안정한 하루", "text": "그는 헤아릴 수 없는 궁금증과 의문을 헤아리지 않고 사는 데 익숙해 있었다. 궁금증과 의문을 갖지 않는 것이 최선이지만, 혹시 그런 것이 생기더라도 질문의 형식으로 노출하는 것을 피하는 것이 일상의 평온을 흐트러뜨리지 않는 방법이었다."}], "rating": 0, "shelf": "한국 소설", "status": "read", "tags": [], "title": "모르는 사람들", "updatedAt": 1793064294000, "id": "imp07"}, {"author": "김혜진", "cover": null, "coverData": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAGtASwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD2ulGKMUmcVgajqM02gUwJAaBTM06gB9NNFLjIpCGZpaQ9KTNMB1Lmm0tAC0U3rTqAFopDS5oAKKDRTAKKWjNACYpDTqSgAooooAB3pKWigAxxSUtJxQAoFLSA8 KDxSGgQFRmlxSZNFACjilBFNooAfSZptKKAHUUmaTNKwDqKTPFAp2AXNBNJQelKwC5zSZpuacKLAFJnmg0lFguLmjIpMUmKVgDNJuo70lOwIC3tRnjpRSjpTAbn2pOtOJpKAsJ0ox60vemnrQiWf//Z", "createdAt": 1793064293000, "date": "", "memo": "", "oneLine": "", "quotes": [{"marks": [], "page": "", "text": "언젠가부터 나는 뭔가를 바꿀 수 있다고 여기지 않는다. 지금 이 순간에도 나는 천천히 시간 밖으로 밀려나고 있다. 뭐든 무리하게 바꾸려면 너무나 큰 수고로움을 각오해야 한다."}, {"marks": [], "page": "", "text": "좋든 나쁘든. 모든 게 내 것이라고 인정해야 한다. 내가 선택했으므로 내 것이 된 것들. 그것들이 지금의 나다."}, {"marks": [], "page": "", "text": "내가 한 거라곤 연단이 올려다보이는 이곳에 앉아 남들이 엿들을지도 모를 말들을 가만히 손으로만 매만지면서 침묵을 키운 것뿐이다. 하고 싶은 말, 해야 하는 말, 할 수 없는 말, 해 서는 안 되는 말. 이제 나는 어떤 말에도 확신을 가질 수 없다. 이런 말을 도대체 누구에게 할 수 있을까. 누가 들어 주기나 할까. 할 수도 없고 들을 수도 없는 말. 주인이 없는 말들."}, {"marks": [], "page": "", "text": "그만큼 그 애는 때때로 지나치게 사려 깊다. 내게 어떤 말이 필요하고, 무슨 말을 듣기 원하는지 너무나 잘 알고 있는 것 같다."}, {"marks": [], "page": "", "text": "이대로 딸애를 계속 당기기만 하면 결국 이 팽팽하고 위태로운 끈이 끊어지고 말겠구나. 이대로 딸을 잃고 말겠구나."}, {"marks": [], "page": "", "text": "그러나 그게 이해를 뜻하는 건 아니다. 동의를 의미하는 것도 아니다. 나는 다만 내가 쥐고 있던 끈을 느슨하게 푼 것뿐이다."}], "rating": 0, "shelf": "한국 소설", "status": "read", "tags": [], "title": "딸에 대하여", "updatedAt": 1793064293000, "id": "imp08"}, {"author": "정한아", "cover": null, "coverData": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAFUASwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExc b7prB8HRCeRdPnYzWxGQkmDg+1FFduG+FmU/iLnjDTbeC9VYtyKEGADT/A+p3lrcNZpMzQg8K/OKKK7K+tBGdN/vDqfHWoXWn6EBZymFp32M6D5gMdvSvMNM06JpCzPIxPJJIOf0oorgpLQms9TdTT4QpGWP1x/hViKwhXpuooqzNFy2tI1l4LA5610dnvWNR5rke5oorKSLiaEcsmAdxzU67mU5duBxzRRWdjW5zfia8ntk8mB/LVxyV6/nXmuoIzyNmaTk9cj/Ciit6SM5sy2sIyTmSQ/iP8KaNPiz9+T8x/hRRWxmObT4h/G/5j/Ck+wR/33/Mf4UUUCJ47GMEYd/zH+FXxpcDW5YvJkc9R/hRRQ9hno/gm9uryxVLm4eXyXMalsZxjv61uavp9vPbyl15KEEiiiueC/eI6fsmD8PNOhsvt7RF8s4BDHiu5zRRVYv8AisdN+6GaM0UVzWLuwzRuooosguwzRmiiiwXZ/9k=", "createdAt": 1793064292000, "date": "", "memo": "", "oneLine": "", "quotes": [{"marks": [], "page": "", "text": "우리는 서로 못하는 이야기가 없는 친구 사이였고, 그만큼 마음이 통하는 사람을 이전에는 한 번도 만나지 못했거든요."}, {"marks": [], "page": "", "text": "각기 다른 형태의 관계가 있고, 그 나름의 행복의 기준이 있는 법이죠. 그 사람은 밤마다 제 쪽으로 돌아누워 그날 하루의 일을 이야기해줬어요."}, {"marks": [], "page": "", "text": "그 사람을 이렇게까지 몰고 간 것이 무엇일까요. 우리가 함께했던 시간은 무슨 의미일까요. 그리고 무엇보다 그는 대체 왜 그 이야기를 저에게 남겨둔 것일까요."}, {"marks": [], "page": "", "text": "그는 자신이 원하는 게 뭔지, 어떤 존재가 되어야 하는 지를 생각해본다. 하지만 아무것도 떠올릴 수 없다. 그는 비로소 자신이 텅 빈, 아무 쓸모가 없는 존재라는 사실을 깨닫는다. 깊은 바다 밑바닥의 난파선, 그 안을 둥둥 떠다니는 부속물, 해수에 불어 형체를 잃고 미끄덩거리는 이끼류, 그것이 바로 자신인 것이다."}, {"marks": [], "page": "", "text": "그 후 끔찍한 침묵이 시작되었다. 하지만 남편도 나도 끝내 헤어지자는 말을 내뱉지 않았다. 우리는 거울 속의 자신을 보듯 서로를 들여다보고 있었다. 십 년간의 결혼생활, 함께 아이를 낳았고, 그 아이가 서로를 반씩 닮은 얼굴로 자라고 있었다. 헤어진다는 것은 몸의 한 부분을 잘라내는 것과 같았다. 비록 곫아가고 있는 부분이라고 해도, 그것을 포기하기란 쉬운 일이 아니었다. 어쩌면 우리는 그 부분이 저절로 괴사하여 떨어져나가기를 기다리고 있는지도 몰랐다."}, {"marks": [], "page": "", "text": "이유미는 홀로 호숫가에 앉아 해가 지는 풍경을 바라보았다. 그녀는 그에게 말하고 싶었다. 모든 게 다 거짓은 아니었다고. 함께 했던 시간 동안, 그를 진심으로 사랑했었다고. 하지만 이제 그녀도 의심스러웠다. 그들이 나눈 게 진짜 사랑이었다면, 어떻게 이토록 간단히 깨질 수 있딴 말인가. 그를 정말 화나게 하는 것은 그녀의 거짓말이 아니라, 그녀가 번듯한 양복 체인의 상속녀가 아니라는 사실일지도 몰랐다."}, {"marks": [], "page": "", "text": "오래전, 나는 아침마다 그를 위해 이 음악을 틀어놓고 빵을 구웠다. 느린 피아노 선율과 빵 굽는 냄새, 그것이 우리 신혼 아침의 풍경이었다. 마주앉아 책을 읽고 글을 쓰던 거실의 작은 테이블, 하께 밤새워 웃고 떠들던 친구들, 아무 계획 없이 떠났던 기차 여행."}, {"marks": [], "page": "", "text": "사람은 누구나 자신을 보호하게 되어 있어요. 어쩔 수 없이 그 속에서 살아야 한다면, 상처받지 않는 쪽으로 단련되게 되어 있죠."}, {"marks": [], "page": "", "text": "하지만 삼십대가 되고 보니 알겠어요. 세상에는 설명할 수 없는 헤어짐이 훨씬 더 많다는 걸 말이에요."}, {"marks": [], "page": "", "text": "우리가 질서를 연기하는 한, 진짜 삶은 아무도 눈치채지 못한다. 그렇다면 진짜 삶은 어디 있는가? 그것은 인생의 마지막에서야 밝혀질 대목이다. 모든 걸 다 잃어버린 후, 폐허가 된 길목에서."}, {"marks": [], "page": "", "text": "그 후 그는 자신의 감정이 마비되었다고 생각했다. 남은 생이 너무 차갑고 시려서, 차라리 죽는 게 낫겠다는 심정이었다."}, {"marks": [], "page": "", "text": "젊은 시절 한때의 달콤함에 빠져 내게 주저앉은 아내를 봐도, 쉽게 알 수 있지요. 생각해보면 나 역시 그 여자를 붙잡기 위해 수업이 많은 거짓 노래를 불렀습니다. 나의 연약함을 감추기 위해 더욱 크게 발을 구르고, 목소리를 높였지요. 온 세상이 나에 대해 경고했지만 그녀는 듣지 않았어요. 속는 자와 속이는 자는 함께 쾌락에 빠져들기 마련입니다. 어떤 의미에서는 후자의 것보다 전자의 것이 더 크다고 할 수 있지요."}, {"marks": [], "page": "", "text": "장례식이 가짜처럼 보이면 웃음을 참을 수 없을 것이고, 진짜처럼 보이면 두려움을 견딜 수 없을 것이었다."}, {"marks": [], "page": "", "text": "그 일은 내 안에 있던 남자로서의 자부심과 믿음, 그 근간을 다 부숴버렸어. 나는 이제 내가 누구인지, 무엇을 원하는지, 어디로 가야 할지 몰라서 벌벌 떠는 꼴이 되었어. 당신이 알던 그 사람, 그 남자는 이제 여기 없어. 난 껍데기고, 흔적이고, 흩날리는 재야. 그러니 당신이 말해봐."}, {"marks": [], "page": "", "text": "그는 부드러운 목소리로 내게 물었다.\n나라는 유령을 볼 때 어떤 생각이 드는지, 어떤 후회를 하는지, 어떤 기도를 하는지."}, {"marks": [], "page": "", "text": "하지만 어떤 사기극이든 진실을 담보하기 마련이다. 그러지 않고는 사람들을 속여 넘길 수 없다."}, {"marks": [], "page": "", "text": "나는 늘 그애가 멀어지는 모습을 한참 지켜보았다. 결국 딸애는 나를 앞서갈 것이고, 지금처럼 그애의 뒤통수를 바라보는 것이 나의 인생이 될 것이었다. 내가 엄마에게 그랬듯이, 그애는 곧 나에 대해 잊을 것이다."}], "rating": 0, "shelf": "한국 소설", "status": "read", "tags": [], "title": "친밀한 이방인", "updatedAt": 1793064292000, "id": "imp09"}, {"author": "헤르만 헤세", "cover": null, "coverData": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAFdASwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQE GYtzjFaVFFaJJKyM223dhRRRTEFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUGiigCrdadZXxiN3awTmJt8ZljDbT6jPQ1jL4E8NqZSdMjbzH3sGZvveo5ro6KAOdk8DeHnt/JWw8lRIsoMMrowZQQCCDkdT+daWm6LaaXayW1v5zRSMSwnlaUnjHVieK0KKAMSXwjoMs1tJ/ZsCNbNuiES7ADnJ4HByakvfDOkX9za3E9mnm2pBhZPl24II6dvlH5Vr0UARTW8NzGY54klQnJV1DD8jWU/hPRHkt3NhHm2/1QBIC/NuAxnoGOa2qKAKS6Rp8dxJPHaRJLJGY3ZF2llJzg4rNi8FeHYLSa1h0yJIJirSIC3zFTlT17Vv0UAVrCwtdMs47SzhWG3jGEReg5zVmiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigD//Z", "createdAt": 1793064291000, "date": "", "memo": "세계 단일성의 체험을 통한 참다운 인류 발전\n수 많은 자기 발전의 단계를 거치며 그는 결국 생애의 막바지에는 세계 단일성의 환상 속에서 자기 완성에 이른다.\n강물을 보면서 단일 사상을 깨달은 싯다르타에게는 정신과 자연, 사상과 육욕, 선과 악의 대립이 이제 더 이상 존재하지 않으며 모든 것이 단일성의 한 극으로서 똑같이 긍정된다.", "oneLine": "", "quotes": [{"marks": [], "page": "", "text": "아버지의 행동거지는 곡요하고 고상하였으며, 삶은 순수하였으며, 말씀은 지혜로웠고, 두뇌는 훌륭하고 고귀한 생각들로 가득 차있었다. 그러면 그토록 많은 것을 알고 있는 아버지는 과연 행복하게 살며, 마음의 평화를 얻었던가, 아니면 아버지도 단지 구도자이자 목말라하는 자에 지나지 않은가?"}, {"marks": [], "page": "", "text": "싯다르타 앞에는 한 목표, 오직 하나뿐인 목표가 있었으나, 그것은 모든 것을 비우는 일이었다. 갈증으로부터 벗어나고, 소원으로부터 벗어나고, 꿈으로부터 벗어나고, 기쁨과 번뇌로부터 벗어나 자기를 비우는 일이었다. 자기 자신을 멸각시키는 것, 자아로부터 벗어나 이제 더 이상 나 자신이 아닌 상태로 되는 것, 믿음을 텅 비운 상태에서 평정함을 얻는 것, 자기를 초탈하는 사색을 하는 가운데 경이로움에 마음을 열어놓는 것, 이것이 그의 목표였다."}, {"marks": [], "page": "", "text": "그는 자기의 감각을 죽였고, 자기의 기억을 죽였다. 그는 자신의 자아로부터 슬그머니 빠져나와 수천 가지의 낯선 형체들 속으로 미끄러져 들어갔으며, 짐승이 되고, 썩은 고기가 되고, 돌이 되고, 나무가 되고, 물이 되었다. 그리고 그때마다 매번 깨어나면서 다시 자기 자신을 발견하였다."}, {"marks": [], "page": "", "text": "우리가 <배움>이라고 부르는 것은 사실상 존재하지 않는다고 생각해. 오, 친구, 존재하는 것은 오로지 앎뿐이며, 그것은 도처에 있고, 그것은 아트만이고, 그것은 나의 내면과 자네의 내면, 그리고 모든 존재의 내면에 있는 것이지."}, {"marks": [], "page": "", "text": "그러자 싯다르타에게는 그 손에 붙어 있는 다섯 손가락 모두의 마디마디가 가르침 그 자체인 것 같아 보였으며, 다섯 손가락 모두의 마디마디가 진리를 말해 주고, 진리를 호흡하고, 진리의 향기를 풍기고, 진리를 현란하게 빛내주는 것 같아 보였다."}, {"marks": [], "page": "", "text": "하지만 지식욕에 불타는 그대여, 덤불처럼 무성한 의견들 속에서 미로에 빠지는 것을, 말 때문에 벌어지는 시비 다툼을 경계하시오. 이런 저런 의견들은 전혀 중요하지 않소. 의견이란 아름다울 수도 있고, 추할 수도 있으며, 재치 있을 수도 있고 어리석을 수도 있소."}, {"marks": [], "page": "", "text": "어느 누구에게도 해탈은 가르침을 통하여 주어지는 것이 아니다, 바로 이것이 저의 생각입니다. 세존이시여, 당신은, 당신이 깨달은 시간에 무슨 일이 일어났는가를, 아무에게도 말이나 가르침으로 전달하여 주실 수도, 말하여 주실 수도 없습니다."}, {"marks": [], "page": "", "text": "다양성을 무시하고 통일성을 추구하며 깊이 사색하는 바라문에게는 무의미하고 우연한 현상계라는 것은 경멸스러웠다. 파랑은 파랑이고, 강은 강이었으며, 비록 싯다르타의 내면에 있는 파랑과 강물 속에, 하나이자 신적인 것이 숨어 있다 할지라도, 여기에 노랑, 여기에 파랑, 저기에 하늘, 저기에 숲, 그리고 여기에 싯다르타가 있다는 그 사실이야말로 신적인 것의 본성이요 의의였던 것이다. 의의와 본질은 사물들의 배후 어딘가에 있는 것이 아니라, 그 사물들 속에, 삼라만상 속에 있었던 것이다."}, {"marks": [], "page": "", "text": "이처럼 무엇인가를 추구함이 없이, 이처럼 단순소박하게, 이처럼 천진난만하게 세상을 바라보니, 이 세상이 아름답게 보였다. 달과 별들도 아름다웠고, 시냇물과 강 기슭, 숲과 바위, 염소와 황금풍뎅이, 꽃과 나비도 아름답게 보였다. 이처럼 주변의 가까운 사물에 마음의 문을 연 채로, 이처럼 아무 불신감도 없이 이 세상을 떠돌아다닌다는 것은 아름답고 기분 좋은 일이었다."}, {"marks": [], "page": "", "text": "감각과 사유 두 가지 다 상당히 좋은 것이었다. 그 두 가지의 배후에는 궁극적인 참듯이 숨어 있었다. 두 가지 모두 들어볼 만한 가치가 있고, 더불어 유희할 만한 가치가 있는 것이었다. 두 가지 가운데 어느 하나도 경시되거나 과대평가되어서는 안 되었으며, 그 두 가지로부터 가장 내밀한 것의 비밀스러운 소리들을 들어야 할 것이었다."}, {"marks": [], "page": "", "text": "이처럼 내면의 소리에 귀 기울이는 것, 만반의 준비 태세를 갖추는 것, 그것은 좋은 일이었으며, 반드시 필요한 일이었다."}, {"marks": [], "page": "", "text": "물론입니다. <모든 것은 다시 돌아온다!> 이것도 강으로부터 배운 것이지요. 사문인 당신도 다시 돌아올 것입니다."}, {"marks": [], "page": "", "text": "카말라의 입은 예쁘고 빨갛지요. 그러나 카말라의 뜻에 어긋나게 그 입에 한 번 입맞추려고 해보세요. 그러면 그렇게 많은 단맛을 줄 수 있는 그 입에서 당신은 단 한 방울의 단맛도 얻지 못할거예요."}, {"marks": [], "page": "", "text": "싯다르타, 당신이 말귀를 잘 알아듣는 분이라면 이것도 배워두세요. 사랑이란 구걸하여 얻을 수도 있고, 돈을 주고 살 수도 있고, 선물로 받을 수도 있고, 거리에서 주워 얻을 수도 있지만, 그러나 강탈할 수는 없는 거예요."}, {"marks": [], "page": "", "text": "저는 사색할 줄 압니다. 저는 기다릴 줄 압니다. 저는 단식할 줄 압니다.\n그게 전부인가요?\n저는 그게 전부라고 생각합니다."}, {"marks": [], "page": "", "text": "확실히 저는 즐기려고 출장을 떠났던 것입니다. 그 밖에 다른 목적이 무엇이 있겠습니까? 저는 여러 사람들과 지역들을 알게 되었으며, 친절과 신임을 얻는 기쁨을 누렸으며, 친구들을 사귀어 우정을 얻었습니다."}, {"marks": [], "page": "", "text": "그리고 그는 그런 부류의 사람들을 부러워하였는데, 자신이 그런 부류의 사람들과 닮아갈수록, 그만큼 더 그들을 부러워하였다. 그것은 자기 자신에게는 없는데 그들은 가지고 있는 한 가지, 즉 그들은 자신들의 삶에 중요성을 부여할 줄 안다는 사실 때문이었다. 그들은 기쁨도 불안함도 열렬하게 드러낼 줄 알았으며, 영원한 열애의 불안하지만 달콤한 행복을 맛볼 줄 알았다. 이런 부류의 사람들은 줄곧 자기 자신에게, 아내에게, 자식들에게, 명예나 돈에, 여러 계획이나 갖가지 희망에 홀딱 반해 있었다. 하지만 그는 이런 점, 바로 이런 점은, 그러니까 어린애 같은 즐거움이나 어린애 같은 어리석음은 그들한테서 배우지 않았다."}, {"marks": [], "page": "", "text": "그리고 바로 이 순간 자기가 모든 사람과 모든 사물을 가리지 않고 사랑하지 않고서는 배길 수 없을 것 같은 생각이 들었다. 경이로운 잠에서 깨어난 뒤의 이 찬란한 시간, 온몸이 온통 옴으로 충만된 이 순간에, 어떻게 사랑하지 않을 수 있단 말인가! 자기의 눈에 보인 모든 것을 다 사랑하는 것, 자기의 눈에 보인 모든 것을 다 기쁨이 넘치는 사랑의 감정으로 대하는 것, 바로 이것이야말로 잠을 자는 동안 옴의 작용을 통하여 자신의 내면에서 일어났던 매혹적인 현상의 본질인 것이다. 이제 돌이켜보니, 예전에는 마음이 너무나 병들어 있었다는 그 이유 때문에 사람이건 사물이건 아무것도 사랑할 수 없었던 것이 아닌가 하는 생각이 들었다."}, {"marks": [], "page": "", "text": "나의 가슴속에 있는 새도 역시 죽은 것이 아니었다. 그러나 무슨 놈의 길이 그렇게도 험난하였을까! 결국 내가 단지 또다시 어린애가 되고 또다시 새롭게 시작할 수 있기 위하여, 나는 얼마나 많은 어리석은 짓, 얼마나 많은 악덕, 얼마나 많은 오류, 얼마나 많은 구토증과 환멸과 비참함을 거치지 않으면 안 되었는가. 하지만 그것은 제대로 난 길이었어, 나의 마음은 그 점에 대하여 그렇다고 말하고 있으며, 나의 두 눈은 그 점에 대하여 웃음을 짓고 있어 내가 절망을 체험하지 않으면 안 되었고, 모든 생각들 중에서 가장 어리석은 생각, 그러니까 자살할 생각까지 품을 정도로 나락의 구렁텅이에 떨어지지 않으면 안 되었던 것은, 자비를 체험할 수 있기 위해서였으며, 다시 옴을 듣기 위해서였으며, 다시 올바로 잠을 자고 올바로 깨어날 수 있기 위해서였어. 내가 바보가 되지 않으면 안 되었던 것은 나의 내면에서 다시 아트만을 발견해 재기 위해서였어. 내가 죄를 저지르지 않으면 안 되었던 것은 다시 새로운 삶을 살 수 있기 위해서였어. 앞으로 나의 길이 나를 어디로 끌고 갈까? 그 길은 괴상하게 나 있을 테지, 어떠면 그 길은 꼬불꼬불한 길일지도 모르고, 어쩌면 그 길은 원형의 순환 도로일지도 모르지. 나고 싶은 대로 나 있으라지. 그 길이 어떻게 나 있든 상관없이 나는 그 길을 가야지."}, {"marks": [], "page": "", "text": "내가 지금부터 걸어가야 할 길, 내가 지금부터 살아가야 할 새로운 인생도 그곳 뱃사공의 오두막을 출발점으로 삼을 수 있다면 정말 좋을 텐데!"}, {"marks": [], "page": "", "text": "바주데바는 매우 주의 깊게 그의 말을 귀담아들었다. 그는 싯다르타가 이야기하는 내력, 유ㄹ년 시절, 배움, 구도 행위, 기쁨, 곤경 이 모든 것을 경청하면서 자기 내면에 받아들였다. 이것이야말로 뱃사공의 가장 큰 미덕들 가운데 하나였으니, 남의 말을 그보다 더 진지하게 귀기울여 들어주는 사람은 거의 없었다. 이야기를 하고 있는 싯다르타는 바ㅜ데바가 한 마디 말도 하지 않은 채 자기가 하는 말을 고요하게, 마음을 툭 터놓고, 느긋하게 마음속으로 받아들이고 있음을, 바주데바가 자기가 하는 말을 하나도 빠뜨리지 않고, 초조하게 다름 말을 기다리는 법이 없이, 자기가 말하는 중에는 칭찬의 말도 꾸중의 말도 하지 않고서, 다만 가만히 귀기울여 듣고만 있음을 느낄 수 있었다. 싯다르타는, 이런 식으로 자기 말을 들어주는 사람에게 자신을 고백한다는 것, 그리고 그런 사람의 마음속에다 자신의 인생, 자신의 구도 행위, 자신의 고뇌를 털어놓는다는 것이 얼마나 행복한 일인가를 느꼈다."}, {"marks": [], "page": "", "text": "당신이 말하고자 하는 바는, 강물은 어디에서나 동시에 존재하고 있다, 강의 원천에서나, 강 어귀에서나, 폭포에서나, 나루터에서나, 시냇물의 여울에서나, 바다에서나, 산에서나, 도처에서 동시에 존재하고 있다, 그리고 강에는 현재만이 있을 뿐, 과거라는 그림자도, 미래라는 그림자도 없다, 바로 이런 것이지요?"}, {"marks": [], "page": "", "text": "바로 그렇습니다. 싯다르타가 말했다. 그리고 그것을 배웠을 때 나는 나의 인생을 다시 바라보게 되었습니다. 그러자 나의 인생도 한 줄기 강물이었습니다. 소년 싯다르타는 장년 싯다르타와 노년 싯다르타로부터 단지 그림자에 의하여 분리되어 있을 뿐, 진짜 현실에 의하여 분리되어 있는 것은 아니라는 사실을 알게 되었습니다. 싯다르타의 전생들도 결코 과거의 일이 아니었으며, 싯다르타의 죽음이나 범천에로의 회귀도 결코 미래의 일이 아니었습니다. 아무것도 없었으며, 아무것도 없을 것입니다. 모든 것은 현존하는 것이며, 모든 것은 본질과 현재를 지니고 있습니다."}, {"marks": [], "page": "", "text": "당신이 어린 아들을 사랑하고 있기 때문에, 당신이 그 아이에게는 제발 번뇌와 고통과 환멸이 면제되었으면 좋겠다고 바라고 있기 때문에, 당신 아들에게는 그 길이 혹시 면제되었을지도 모르겠다, 이렇게 믿고 있는 겁니까? 그렇지만 설령 당신이 아들 대신 열 번을 죽어준다 하더라도, 그것으로 그 아이의 운명을 눈곱만큼이라도 덜어줄 수는 없을 겁니다."}, {"marks": [], "page": "", "text": "그런데 이제 자기 아들이 나타나고 나서부터는 싯다르타도 완전히 그런 어린애 같은 인간이 되어버렸던 것이다. 한 인간 때문에 고통스러워하고, 한 인간을 사랑하고, 어떤 사랑에 빠져버리고, 어떤 사랑 대문에 바보가 되어버리는 그런 어린애 같은 인간이 되어버렸던 것이다. 이제 그도 인생에서 한 번, 늘그막에 와서야 비로소 가장 강렬하고 가장 진기한 이러한 열정을 느끼게 되었으며, 그 열정 때문에 비참할 정도로 괴로운 슬픔을 맛보았다. 그는 이 사랑이, 자기 아들에 대한 이 맹목적인 사랑이, 일종의 번뇌요, 매우 인간적인 어떤 것이라는 사실과, 또한 이 사랑이 윤회요, 흐릿한 슬픔의 원천이요, 시커먼 강물이라는 사실을 잘 알고 있었다. 그럼에도 불구하고 그는 이와 동시에, 그 사랑이 가치 없는 것이 아니라는 것을, 그 사랑이 필수불가결한 것이며 자신의 본질에서 우러나오는 것임을 느꼈다. 이러한 쾌락도 만족시키고 싶었으며, 이러한 고통도 맛보고 싶었으며, 이런 어리석은 짓도 저질러보고 싶었다."}, {"marks": [], "page": "", "text": "그 아이는 이제 더 이상 어린아이가 아니니, 스스로 자구책을 강구하여 곤경에서 빠져나올 수 있을 겁니다. 그 점을 잊어서는 안됩니다. 그 아이는 당신이 해주어야 하는데 소홀하여 해주지 않았던 바로 그 일을 한 것입니다. 그 아이는 자기 스스로를 돌보고 있으며 제 갈 길을 가고 있는 거예요."}, {"marks": [], "page": "", "text": "그러고 나서 그는 자기를 이 장소까지 오게끔 내몰았던 욕망이 어리석은 욕망이라는 것을, 자기가 아들을 도와줄 수 없다는 것을, 자기가 아들에 집착하고 애착을 느껴서는 안된다는 것을 깨달았다. 그는 도망친 아들에 대한 사랑을 마치 하나의 상처처럼 가슴속 깊이 느꼈으며, 이와 동시에 이 상처가 결코 자기의 마음을 아프게 쑤셔놓으라고 주어진 것이 아니라는 것을, 이 상처가 장차 틀림없이 활짝 꽃을 피우고 빛을 발하게 되리라는 것을 느꼈다."}, {"marks": [], "page": "", "text": "이 모든 단순하고 어리석은, 그렇지만 어마어마하게 강한, 억센 생명력을 지닌, 끝까지 강력하게 밀어붙여 확고한 자리를 굳히는 충동들과 탐욕들이 싯다르타에게는 이제 더 이상 결코 어린애 같은 짓으로 여겨지지 않았다. 그는 바로 그런 것들 때문에 사람들이 살고 있다는 것을 알았으며, 바로 그런 것을 때문에 사람들이 무한한 업적을 이루고, 여행을 하고, 전쟁을 일으키고, 무한한 고통을 겪고, 무한한 고통을 감수한다는 것을 알았다."}, {"marks": [], "page": "", "text": "자기 말에 귀 기울이는 이런 사람에게 자시의 상처를 드러내 보인다는 것은, 마치 그 상처를 강물에 넣어 씻어서 결국은 상처가 아물어 강물과 하나가 되는 것과 똑같은 일이었다."}, {"marks": [], "page": "", "text": "그리고 싯다르타가 세심한 주의를 기울여서 이 강에, 이 수천 가지 소리가 어우러진 노래에 귀를 기울일 때면, 그가 고통의 소리에도 웃음소리에도 귀 기울이지 않고, 자신의 영혼을 어떤 특정한 소리에 묶어두거나 자신의 자아와 더불어 그 어떤 특정한 소리에 몰입하지 않고 모든 소리들을 듣고, 전체, 단일성에 귀를 기울일 때면, 그 수천의 소리가 어우러진 위대한 노래는 단 한 개의 말로 이루어지는 것이었으니, 그것은 바로 완성이라는 의미의 옴이라는 말이었다."}, {"marks": [], "page": "", "text": "진리란 오직 일면적일 때에만 말로 나타낼 수 있으며, 말이라는 겉껍질로 덮어씌울 수가 있다. 생각으로써 생각될 수 있고 말로써 말해질 수 있는 것, 그런 것은 모두 다 일면적이지..모두 다 일면적이며, 모두 다 반쪽에 불과하며, 모두 다 전체성이나 완전성, 단일성이 결여되어 있지."}, {"marks": [], "page": "", "text": "한 인간이나 한 행위가 전적인 유회나 전적인 영반인 경우란 결코 없으며, 한 인간이 온통 신성하거나 온통 죄악으로 가득 차 있는 경우란 결코 없네. 그런데도 그렇게 보이는 까닭은 우리가 시간을 실제로 존재하는 것으로 착각하고 있기 때문이네. 시간은 실제로 존재하는 것이 아니네, 고빈다, 나는 이것을 몇 번이나 거듭하여 체험하였네. 그리고 시간이 실제로 존재하지 않는 것이라면, 현세와 영원 사이에, 번뇌와 행복 사이에, 선과 악 사이에 가로놓여 있는 것처럼 보이는 간격이라는 것도 하나의 착각인 셈이지."}, {"marks": [], "page": "", "text": "과거에 존재하였던, 현재 존재하고 있는, 그리고 미래에 존재할 모든 생명을 동시적인 것으로 볼 수가 있어. 그러면 모든 것이 선하고, 모든 것이 완전하고, 모든 것이 바라문이야."}, {"marks": [], "page": "", "text": "나는 나 자신의 육신의 경험과 나 자신의 영혼의 경험을 통하여 이 세상을 혐오하는 일을 그만두는 법을 배우기 위하여, 이 세상을 사랑하는 법을 배우기 위하여, 이 쌍을 이제 더 이상 내가 소망하는 그 어떤 세상, 내가 상상하고 있는 그 어떤 세상, 내가 머릿속으로 생각해 낸 일종의 완벽한 상태와 비교하는 것이 아니라, 이 세상을 있는 그대로 놔둔 채 그 세상 자체를 사랑하기 위하여 그리고 기꺼이 그 세상의 일원이 되기 위하여 내가 죄악을 필요로 하였다는 것을, 내가 관능적 쾌락, 재물에 대한 욕심, 허영심을 필요로 하였다는 것을, 그리고 가장 수치스러운 절망 상태도 필요로 하였다는 것을 알게 되었네."}, {"marks": [], "page": "", "text": "이 돌멩이는 돌멩이다. 그것은 또한 짐승이기도 하며, 그것은 또한 신이기도 하며, 그것은 또한 부처이기도 하다. 내가 그것을 존중하고 사랑하는 까닭은 그것이 장차 언젠가는 이런 것 또는 저런 것이 될 수도 있기 때문이 아니라, 그것이 이미 오래전부터 그리고 항상 모든 것이기 때문이다."}, {"marks": [], "page": "", "text": "나에게는 말보다는 사물이 더 마음에 들며, 그 분의 행위와 삶이 그 분의 말씀보다 더 중요하며, 그 분의 손짓이 그 분의 사상들보다 더 중요해. 나는 그 분의위대성이 그 분의 말씀, 그 분의 사상에 있는 것이 아니라 오로지 그 분의 행위, 그 분의 삶에 있다고 생각해."}, {"marks": [], "page": "", "text": "그러자 고빈다는, 가면의 이러한 미소, 흘러가는 그 온갖 형상들을 내려다보며 던지는 이 단일성의 미소, 수천의 태어남과 죽음을 내려다보며 던지는 이 동시성의 미소, 싯다르타의 이 미소야말로 자신이 수백 번이나 외경심을 품고 우러러보았던 바로 그 부처 고타마의 미소와 하나도 다르지 않고 영락없이 똑같은 미소라는 것을 알게 되었다."}], "rating": 0, "shel : "", "text": "몰려오는 바람과 풍경들이 벅찼다. 하지만 눈을 감지 않았다. 눈을 뜨고 울었다. 슬프지 않았지만 눈물이 자꾸 났다. 바람이 사람을 울린다는 걸 우환은 마흔이 넘고 중반이 되어서야 처음 알았다."}, {"marks": [], "page": "", "text": "진짜 과거로 갈 수 있는지 모르겠지만, 크게 믿지도 않지만, 가게 된다면 그곳에 살고 있을 젊은 자신의 사진을 한 장 찍어 오라고 했다. 그뿐이었다."}, {"marks": [], "page": "", "text": "바다는 더 깊어지고, 어둠은 더 짙어지고 있다."}, {"marks": [], "page": "", "text": "남자는 왜 이곳에서 살 수 없다고 생각했는지, 의심했다.\n남자는 왜 자신이 행복해지면 안 되는지, 의심했다. 남자는 왜 여기서 흐르는 시간이 자신의 현재가 되면 안 되는지, 의심했다."}, {"marks": [], "page": "", "text": "가져가는 기억들은 하찮은 것이었다. 기억은 사라지는 것이다."}], "rating": 0, "shelf": "한국 소설", "status": "read", "tags": [], "title": "곰탕 1", "updatedAt": 1793064290000, "id": "imp11"}, {"author": "김영탁", "cover": null, "coverData": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAFWASwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD2WiiivmjtCiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooGFFFFAgoopjzRRlRJIiFjhQzAZ+lAD6KKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAK465m+IcWoSRW1roVxaZJSZ3dCB2BGetdhuGSMjI7ZoPQjOOOtXCXL0E9TlP+K/dB/yL0Lf9tWrmPEXiHx3oev6FprXekSvqc2wLBbNwARkncfQ1JoGoaxp3xhvvDk+s3N7potDMi3JBZScEDPtk1v6hpaXHxDtdev7m2isNNsysG+VRmVjyTk8YFdSXJK0ktuxG60OwPCknsK4//haHhNb6Synv5be5QkGOa2kU/liuksdX03VNwsNQtbor94QyqxH5V5Z40e6t/jh4emsLBby5FrkQlxHv  바랐는지도 모른다."}, {"marks": [], "page": "", "text": "하지만, 선택하지 않아도 절로 주어지는 유일한 것이 가족인지도 몰랐다. 바란다고 되는 것이 아니었다. 선택하지 않아도 되지만, 선택한다고 되는 것도 아니었다. 절로 주어지지 않으면 달리 수가 없었다. 바란다고 되는 것이, 아니었다."}, {"marks": [], "page": "", "text": "자신이 죽었다면 소년은 돌아갔을 것이고, 불안은 끝났을 것이다. 소년은 행복해졌을 것이고, 우환은 타인의 행복을 탐하지 않아도 되었을 것이다."}, {"marks": [], "page": "", "text": "여기서 이렇게 살고 있는 게 기쁠 때도 있습니다. 어찌되었든 그곳보다 나은 삶이다. 생각이 듭니다. 그곳보다 나은 삶이다, 나은 현재다. 이곳이 보다 나은 나의 현제다. 그렇게 믿고 살게 됩니다. 그렇게 믿고 싶죠."}, {"marks": [], "page": "", "text": "필요했던 것 체념뿐이었다. 결국은 행복해 질 수 없음을, 그때 알고 체념했어야 했다. 그럼에도 우환은 좀 더 기다렸다. 종인처럼 솥 앞에 앉아 국이 끓기를, 곰탕이 완성되기를, 종인처럼 식당에 앉아 순희가 돌아오기를."}, {"marks": [], "page": "", "text": "하지만, 기다림만으로 타인의 인생을 살 수는 없었다. 누구나 자신의 현재가 있었다."}, {"marks": [], "page": "", "text": "50년 만에 쓰나미가 다시 올지도 모른다는 말이 나돌았다. 소문이 아닐 수도 있었다. 하지만 사람들은 그냥 살았다. 두렵지 않아서가 아니었다. 살아가는 것에 익숙해져 있었다."}, {"marks": [], "page": "", "text": "우환은 아버지에게 모든 것을 털어놨다.\n아버지는 묵묵히 들었다.\n그리고 말했다.\n“인생 하나가, 지 혼자 망쳐니나.”"}, {"marks": [], "page": "", "text": "일흔아홉이 된 이순희는, 쉰아홉이 된 이우환에게 이어서 말한다.\n“니는 어떤지 모르겠다만, 나는 모든 게 달라졌다. 니가 태어난 후로.”"}], "rating": 0, "shelf": "한국 소설", "status": "read", "tags": [], "title": "곰탕 2", "updatedAt": 1793064289000, "id": "imp12"}, {"author": "다자이 오사무", "cover": null, "coverData": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAGOASwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJm  "", "text": "신에게 묻겠습니다. 신뢰는 죄인가요?"}, {"marks": [], "page": "", "text": "인간 실격.\n이제 저는 더 이상 인간이 아니었습니다."}, {"marks": [], "page": "", "text": "모든 것은 지나간다는 것.\n제가 지금까지 아비규환으로 살아온 소위 ‘인간’의 세계에서 단 한가지 진리처럼 느껴지는 것은 그것뿐입니다. 모든 것은 그저 지나갈 뿐입니다."}], "rating": 0, "shelf": "외국 소설", "status": "read", "tags": [], "title": "인간 실격", "updatedAt": 1793064288000, "id": "imp13"}, {"author": "김동식", "cover": null, "coverData": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAG0ASwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwB1FFFUeiFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUVNaxQzXKx3Fx9niPWTZux+FAENFej6T4J0Se2juftMt4jcgg7VP4CsTx5Z21jqFlFbQpEnknhBjPNBnGqnKyOTo6VNaWs19dR21um+RzgD/H2rtLC38K6G8a31yl1e/xtguin6DigqUuU4WivZH0jRdWsgVtreSJx8rxqB+RFeZeJNEbQ9UMAYtA43RMeuPQ0iIVVJ2MiiiimahRRRQAUUUUAPiRpZVjVN7McAA4/WtxbbToo75I/n2WeTI/I83IztOKwOTwM8+lbc2o3z2UsbWJRfs6wySEMPlHQ+maCZXMSiiigoKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiijvQB6t4E/5FeL2kf+dc38Rj/wATi0HpAf8A0Kuj8B/8ixH/ANdX/nXN/Eb/AJDNr/17/wDs1I5YfxTkobia2ZmhkaNnUqxU4JB7VHRW7ofhqXVY/tU06WtmDjzXI+b6CmdLaWrOn+HMkn9nXquT5SyjbnoOOaw/HGqwajq0cdu4dLdSrOOhbPNdn/wjlnNo6W  책은 ‘삶을 생각하는 마음’을 가르쳐주는 게 아닐까요?"}, {"marks": [], "page": "", "text": "문제는 산더미처럼 쌓여 있고 무엇 하나 해결되지 않았다. 그래도 스스로 선택한 소박한 일상을 자신의 발로 걸어가는 것이 지금 린타로에게 주어진 임무다."}, {"marks": [], "page": "", "text": "기분 좋은 향기가 피어오르는 가운데, 린타로는 조용히 책을 펼쳤다."}], "rating": 0, "shelf": "외국 소설", "status": "read", "tags": [], "title": "책을 지키려는 고양이", "updatedAt": 1793064285000, "id": "imp16"}, {"author": "조남주", "cover": null, "coverData": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAETASwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD349aSlPWkqQCiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAK5HxnZuRDfJ91Pkf2HY111Vr+CO4sJ4pVyjIcitKM3CaZjXpqdNxPKGX59+RVi2cxXCPjIB5ps0DIhbggdSDUcTEqea9vdHz70PVLDb9iiK/dK5q1XNeE9T8+2azkPzxcr7rXS14lWLjJpn0FCanTTQUUUVmbCnrSUp60lABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFQXi7rKcDuh/lU9MlG6Jx6g047oUtYs8kadnjKE8A81GjbW9jUk0ZS6njP8Ln+dM2fKTkAAdzXvR2PnGveaNjRLoWmrwyPwrHaT9a9GR1dcqQRXkccmOCTgdMV6B4b1D7dpyuxzLF8j+9cGMp39478BVt7jN+ikFLXnnqinrSUp60lABRRRQBDcXdvZoHuZ44UJwGkcKM/U1SPiLRVkSM6tZb3IVVE6kk+g5qzfWNlqVs1rfW8NxCcExyqGH5GuH8SaDoo8S+G4Ybaws7a1ne7nkVUjACLhQT7sw/KgZ6EORURuYROIDNGJSM+XuG7H060+N0kjV0ZWVhkMpyCK4PxdZX8Hjnw5rWn6PNf+Ss0c3kYBGQNu4noOvWgR0l/wCJIdN8RadpFxaz51DcIJ1wU3 1qpanMpBYiMUUUAW5o2ndUWXCkcDFQkmJYVhdt4POehoooAJpDC7k4EvGQBwaoM7NcHHBJzxRRQIv2LPJcL5jEsp/Otq5d45VdMDA5oooGZV5KVbcvyk8iorS4lJMhfO3sRRRQBJPLJLiQYD+tUmaQk5iTPeiigD//2Q==", "createdAt": 1793064282000, "date": "", "memo": "", "oneLine": "", "quotes": [{"marks": [], "page": "", "text": "나는 일종의 서글픔을 느꼈다. 서글픔은 물처럼 내 가슴속에서 출렁거렸다. 나는 가슴속의 물을 쏟기라도 할 것처럼 집까지 전속력으로 달렸다."}, {"marks": [], "page": "", "text": "삶이란 생각보다 엄숙하지도 않고 기대처럼 정연한 것도 아니라고, 맑았다가 흐리고, 비가 오다 해가 뜨는 거라고, 그런 게 삶이라고 속삭여주고 싶었다."}, {"marks": [], "page": "", "text": "무관심과 최소한의 대화와 불간섭은 관계의 최악의 경지임에 틀림없었다."}, {"marks": [], "page": "", "text": "그렇게 왔다, 사랑은. 마치 눈에 띄지 않은 사이에 꽃봉오리가 벌어지듯이, 그렇게 천천히."}, {"marks": [], "page": "", "text": "사랑이었을까, 그것이. 그러나 사랑이 아니라면 그것이 무엇이란 말인가."}, {"marks": [], "page": "", "text": "목소리는 이름을 부드럽게 쓰다듬는 듯했고, 표정은 이름을 부드럽게 쓰다듬는 목소리를 부드럽게 쓰다듬는 듯했다."}, {"marks": [], "page": "", "text": "그녀는 그가 했던 말을 단어나 문장의 뜻으로가 아니라 말하는 이의 진정을 헤아림으로써 다 알아들었다."}, {"marks": [], "page": "", "text": "몸이 말했다. 몸이 가장 정직하고 가장 확실하게 말했다. 몸보다 정직한 말은 없었다. 몸보다 확실한 말도 없었다."}, {"marks": [], "page": "", "text": "나무의 뿌리는 바다에 닿고, 바다는 나무를 품는다. 아니, 그 반대다. 나무가 바다를 품고 있다. 나무는 바다보다 크고 넓다."}, {"marks": [], "page": "", "text": "내 생각은, 나무는 움직이지 않는 것이 아니라 움직이는 모습이 보이지 않을 뿐이라는데로 귀착했다."}, {"marks": [], "page": "", "text": "그러나 가망 없는 꿈이었고 이제는 그것이 가망 없다는 것쯤 모르지 않는데도, 모르지 않는다고 생각해왔는데도 빌미만 주어지면 뾰루지처럼 툭툭 불거져 나오는 미련을 어떻게 해볼 수가 없었다. 사람의 마음이란 게 참 미묘하다는 생각은 새삼스럽지도 않았다."}, {"marks": [], "page": "", "text": "사랑의 원천인 증오, 사랑의 다른 쪽 얼굴인 증오, 그래서 아름답고 정결하고 성스러운 내 안의 증오를 떠올렸다."}, {"marks": [], "page": "", "text": "모든 나무들은 좌절된 사랑의 화신이다."}, {"marks": [], "page": "", "text": "지금의 존재를 버리고 전혀 다른 존재가 되기를 바라는 그의 변신에 대한 꿈은 얼마나 크고 절망적인 욕망인가. 존재를 건너뛰려는 욕망만큼 큰 욕망이 어디 있는가. 욕망을 지우려는 욕망만큼 절망적인 욕망이 어디 있는가."}, {"marks": [], "page": "", "text": "그리고 그때부터 지금까지 단 한순간도 너희 어머니를 사랑하지 않은 적이 없다. 그것은 너희 어머니가 그 사람을 그때 이후로 단 한순간도 사랑하지 않은 적이 없는 것과 같다, 하고 아버지는 쓸쓸하게 말했다. 내 눈에 다른 사람이 보이지 않은 것처럼 너희 어머니 눈에는 내가 보이지 않았다, 하고 아버지는 미트로 가라앉는 듯한 목소리로 말했다."}, {"marks": [], "page": "", "text": "사랑에 대한 이해는 단어의 뜻을 이해하는 것과는 같지 않았다. 누군가를 이해하기 위해 그 사람이 사용하는 단어의 뜻을 이해해야 하는 것은 아니었다."}, {"marks": [], "page": "", "text": "사랑은 다 다르다, 하고 나는 나에게 말했다. 사랑한다는 내용은 같아도 사람들이 사랑을 하는 방식은 하나도 같지 않다. 백 명의 사람들은 백 가지 방식으로 사랑한다. 그러니까 특별하지 않은 사랑은 하나도 없다."}, {"marks": [], "page": "", "text": "당신을 위해 준비했어요, 내 마음. 언제부터 서 있었는데 눈길 한번 안 주나요? 더 얼마나 서 있어야 하나요? 녹아내리기 전에, 스르르 녹아 흔적도 없이 사라지기 전에 내 마음을 찍어줘요, 사진사 아저씨....."}], "rating": 0, "shelf": "한국 소설", "status": "read", "tags": [], "title": "식물들의 사생활", "updatedAt": 1793064282000, "id": "imp19"}, {"author": "구병모", "cover": null, "coverData": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAHCAR4DASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDegj8y5ZInAAbgkZAFarRPawjaEdz1JOKy1tNmXUnd0AJqyBcFQHVsDvmjEPms7jwKcbxY57eWRWeRFOB24qsnllikwZc9CKkeVlYEOSfSmRyCac/aFAHUYqqV7eRtiqd7SYpS1iw4zI3ZWPAojZlyUwu70FTyNZsRiPbgH6VFDIApC8DtkVrduOxw0IqNZXEUun8R5NOMz4+8cU9wu0HeGJ647U1VQ5wcnNQo3Wp6bxMYytFE0G8Nglhnv2oMTDpyM0hd4yrq4Yr2NE19LJuIVFJPO0UezvsRPFyhqIWZRkrU4ZgB1zVVbkPjemcdM1OZQfmI6DpWbgl0HHFynsSwB5Q4GzgZ+Y01oJoxlcdPXio4X2Tqwx3+90rRt4XkhaYI0uCc7WwFUdTVOCWqMeZt6laOK9jTz/KYIf4tvBoS+w25uD9ODV+O/vJZPMVz9lzt+bGNv0rMlYmfK7cZPykcVlJRe5bUnsTm4STgsPfFQm5Taw9OhHGaYxc8BBkdgKgKyEEeWwNOMI7MV3EsebbsAd/I6jNK11GY/LBYA9xVSO3kdcqDg9zTRHPHNgI2fTbUSpQb0Y 실거리는 물결의 긴장."}, {"marks": [], "page": "", "text": "파도의 애무. 하백의 입김. 그 밖에도 그 이름은 서로를 향해 몸을 부대끼다 부서지는 물방울의 내밀한 언어를 떠올리게 했으며, 그토록 낭만적인 이름을 지닌 사람이 하필이면 그 이름의 뜻을 담은 물에 스스로를 포기할 리 없었다."}, {"marks": [], "page": "", "text": "그들은 모두 살아있었고, 살아 있는 건 언제 어디서라도 그걸 부르는 자에 의해 다른 이름을 가질 수 있었으며, 곤에게 의미 있는 건 그것을 뭐라고 부르는지가 아니라 그것이 얼마나 오래도록 또는 눈부시게 살아 숨 쉬는지였다."}, {"marks": [], "page": "", "text": "남고 같지 않은 것은 m 어디서도 환영받지 못하고 증오의 대상이 돼요. 아니면 잘해야 동정의 대상이 되는데, 그것은 타인이 시혜하는 동정과 그에 수반하는 불편한 시선을 기꺼이 받아들이겠다는 수혜자의 합의 아래에서 보통 이루어지곤 해요."}, {"marks": [], "page": "", "text": "곤, 보통 사람은 말이지요, 자신에게 결여된 부분을 남이 갖고 있으면 그걸 꼭 빼앗고 싶을 만큼 부럽거나 절실하지 않아도 공연히 질투를 느낄 수 있어요. 그러면서도 그게 자신에게 없다는 이유만으로 도리어 좋아하기도 하는 모순을 보여요."}, {"marks": [], "page": "", "text": "그리고 놀란 나머지 헹군 머리에서 떨어지는 물을 닦을 생각도 못 하고 이쪽을 바라보며 서 있는 곤에게 이어서 말했다.\n”예쁘다.“"}, {"marks": [], "page": "", "text": "곤한테 다시 후드를 씌운 뒤 조임줄을 당겨 머리에 단단히 밀착시키고 강하는 이어서 말했다.\n”그래도 살아줬으면 좋겠으니까.“"}, {"marks": [], "page": "", "text": "살아줬으면 좋겠다니! 곤은 지금껏 자신이 들어본 말 중에 최선이라고 생각했던 ‘예쁘다’가 지금 이 말에 비하면 얼마나 부질없는 것인지를 폭포처럼 와락 깨달았다."}, {"marks": [], "page": "", "text": "사람을 바라보는 사람의 마음은 매 순간 흔들리고 기울어지는 물 위의 뗏목 같아요. 그 불안정함과 막막함이야말로 사람이 다른 사람을 받아들이는 유일한 방법 아닐까요. 우리가 누군가를 사랑할 때 확신이라곤 없다는 사실뿐이지 않을까요."}], "rating": 0, "shelf": "한국 소설", "status": "read", "tags": [], "title": "아가미", "updatedAt": 1793064281000, "id": "imp20"}, {"author": "최은영", "cover": null, "coverData": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAGvASwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSEx 한다. 시작도 끝도 분명치 않은 그들의 사랑과 이후의 삶은 여름날의 불꽃놀이보다는 이 불꽃놀이가 끝난 후의 기나긴 여운과 닮아 있다. 하지만 이미 사라졌지만 여전히 남아 있는 것들이 주는 적막한 위로에 기대면서, 우리의 평범한 삶은 그 짧은 여름을 영원히 살아간다."}, {"marks": [], "page": "", "text": "자신이 느끼는 안도와 행복의 풍경이 언제나 상대의 외로움과 아픔을 철저히 밀봉했을 때에야 가능한 것임을 선연하게 의식하는 예민한 윤리."}, {"marks": [], "page": "", "text": "이것에 대해 알고 나면 왜 인물들이 쉽게 눈물을 흘리는 대신, 끝내 울음을 참아내는지도 이해할 수 있게 된다."}, {"marks": [], "page": "", "text": "단기간에 빠르게 솟구쳐 상대에게 범람하고 금세 소진되는 열정과 달리, 상대를 손쉽게 이해해버리지 않으려는 배려가 스며있는 거리감은 가늘게 반짝이는 빛처럼 오래 유지된다. 이 빛나는 실선 앞에 어두운 구름이 자리하고 있다는 사실을 잊지 않은 채로, 누군가가 전하는 작은 온기 뒤에 자리한 단단한 슬픔을 읽어내고, 관계의 어떤 미세한 균열도 사소하게 바라보지 않는 작가의 힘은 이 세계를 쓸쓸하지만 투명하게 빛나는 곳으로 비춰낸다."}], "rating": 0, "shelf": "한국 소설", "status": "read", "tags": [], "title": "내게 무해한 사람", "updatedAt": 1793064280000, "id": "imp21"}, {"author": "이승우", "cover": null, "coverData": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAGoASwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDz7W2H/CQan/19y/8AoZqh9Ku60f8Aif6l/wBfcv8A6GaqBCee1bHOT2EIuLxI2DFSTkL1rag0yO4YeVFthH3pHbaBWDDNJbyF4yVcgjI7ZqawDT3sEblmTdkqTxSexL1N949KgGxpPNI/gU7ua1NNMDFdmjJICPlzjr6mjVoLCyjhuAoe4KAmNAAWXscVuaRJEun+c+yKTYGKL2z05qHqjNvsaEF0bWNBdCKIM4VUj4Cjtk9jTLu+mjkOya3VRyAxzmvOdb1a5e/ltxP59ujcg9//ANVUp1+0xCRTnHGD1HtU+yQXfU7/AFNv7TgeGRY2LqCgI+
