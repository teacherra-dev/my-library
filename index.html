<body>
<title>나의 서재</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
<style>
/* Layout: library-card shelf — tabs + search, cover grid, detail sheet slides over */
:root {
  --paper: #eef1ea;
  --card: #fbfcf8;
  --ink: #1f2a3a;
  --muted: #5d6877;
  --line: #d3d9cd;
  --accent: #23477a;
  --accent-soft: #dbe4f1;
  --stamp: #b5651d;
  --danger: #a3332b;
  --hl: #f6e46a; --hl-edge: #d9c23a;
  --star: #c98a12;
  --ledge: #cdd3c4;
  --shadow: 0 1px 2px rgba(31,42,58,.08), 0 6px 18px rgba(31,42,58,.08);
  --f-display: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #151a20; --card: #1d242c; --ink: #e6eaee; --muted: #9aa5b1; --line: #2e3842;
  --accent: #8fb0e0; --accent-soft: #24354b; --stamp: #e0a060; --danger: #e27a70; --hl: #6b5d12; --hl-edge: #a8921f; --star: #e8b84a; --ledge: #36424e;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #151a20; --card: #1d242c; --ink: #e6eaee; --muted: #9aa5b1; --line: #2e3842;
  --accent: #8fb0e0; --accent-soft: #24354b; --stamp: #e0a060; --danger: #e27a70; --hl: #6b5d12; --hl-edge: #a8921f; --star: #e8b84a; --ledge: #36424e;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark }

/* 탭마다 바탕색: 읽은 책(연두 종이) · 읽는 중(모래빛) · 읽고 싶은 책(하늘빛) */
body[data-tab="reading"] { --paper: #f4eee4; --line: #ddd3c4 }
body[data-tab="want"] { --paper: #e8eef5; --line: #cfd8e3 }
body[data-tab="hl"] { --paper: #f6f3df; --line: #e2dcbd }
body[data-tab="year"] { --paper: #f1eaf0; --line: #ddd0db }
body[data-tab="map"] { --paper: #e9ecf4; --line: #cdd3e2 }
:root[data-theme="dark"] body[data-tab="hl"] { --paper: #1e1c13; --line: #3b3825 }
:root[data-theme="dark"] body[data-tab="year"] { --paper: #1c1720; --line: #382f3d }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body[data-tab="hl"] { --paper: #1e1c13; --line: #3b3825 } :root:not([data-theme="light"]) body[data-tab="year"] { --paper: #1c1720; --line: #382f3d } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body[data-tab="reading"] { --paper: #1d1a16; --line: #3a342c } :root:not([data-theme="light"]) body[data-tab="want"] { --paper: #141b24; --line: #2c3846 } }
:root[data-theme="dark"] body[data-tab="reading"] { --paper: #1d1a16; --line: #3a342c }
:root[data-theme="dark"] body[data-tab="want"] { --paper: #141b24; --line: #2c3846 }
* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; transition: background-color .25s ease }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
button, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 22px }
.title-btn { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-align: left; display: inline-flex; align-items: center; gap: 8px }
.title-btn .pen { width: 18px; height: 18px; color: var(--muted); opacity: 0; transition: opacity .15s }
.title-btn:hover .pen, .title-btn:focus-visible .pen { opacity: 1 }
@media (hover: none) { .title-btn .pen { opacity: .5 } }
.title-input { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--accent); border-radius: 8px; padding: 0 8px; width: min(100%, 16em) }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 5vw, 36px); line-height: 1.2; margin: 0; text-wrap: balance }
.sub { color: var(--muted); font-size: 14px; margin-top: 4px; font-variant-numeric: tabular-nums }
.motto { margin-top: 6px; font-family: var(--f-display); font-size: 15px; color: var(--muted); max-width: 100% }
.motto .title-btn { font-family: var(--f-display); font-weight: 400; text-align: left }
.motto .title-btn .pen { width: 14px; height: 14px; flex: none }
.motto .title-btn span { min-width: 0; word-break: keep-all; overflow-wrap: anywhere }
.motto .title-input { font-size: 15px; width: min(100%, 30em) }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 9px 14px; font-weight: 500 }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card) }
.btn.primary:hover { filter: brightness(1.08) }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)) }
.btn.ghost { border-color: transparent; background: transparent }
.btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 6px }
#addBtn { padding: 1px 10px; font-size: 12px; border-radius: 99px; line-height: 1.6; font-weight: 500 }
.head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px }
.who { font-size: 12px; color: var(--muted) }
.who button { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 12px }
.login { position: fixed; inset: 0; z-index: 60; background: var(--paper); display: grid; place-items: center;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)) }
.login-box { max-width: 360px; text-align: center; display: grid; gap: 14px; justify-items: center }
.login-box h2 { font-family: var(--f-display); font-size: 34px; margin: 0 }
.login-box p { margin: 0; color: var(--muted); font-family: var(--f-display) }
.login-box .btn { padding: 10px 20px; font-size: 15px; border-radius: 99px }
.login-note { font-family: var(--f-body) !important; font-size: 13px; line-height: 1.6 }
.login-err { color: var(--danger) !important; font-size: 13px; font-family: var(--f-body) !important }

/* 오늘의 문장 */
.today { background: var(--card); border-radius: 8px; padding: 8px 14px; margin-bottom: 16px; border-left: 3px solid var(--hl-edge); display: grid; grid-template-columns: 1fr auto; gap: 0 8px; align-items: start }
.today > * { min-width: 0 }
.today .lbl { display: contents }
.today .lbl > span { grid-column: 1; font-size: 11px; letter-spacing: .08em; font-weight: 600; color: var(--muted) }
.today .lbl > button { grid-column: 2; grid-row: 1 / span 3; padding: 0 4px; font-size: 12px; color: var(--muted); align-self: center }
.today .txt { grid-column: 1; font-family: var(--f-display); font-size: 16.5px; line-height: 1.6; color: var(--ink); -webkit-text-stroke: .3px currentColor; margin: 1px 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.today .src { grid-column: 1 }
.today .txt mark { color: inherit; background: linear-gradient(transparent 50%, var(--hl) 50%, var(--hl) 94%, transparent 94%) }
.today .src { border: 0; background: none; padding: 0; color: var(--muted); font-size: 12px; text-align: left }
.today .src:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px }

.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); margin-bottom: 14px }
.tabs { display: flex; gap: 2px; flex-wrap: wrap }
.tab { border: 0; background: none; padding: 10px 12px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
.tab .n { font-variant-numeric: tabular-nums; font-size: 13px; margin-left: 4px; color: var(--muted) }
.search { flex: 0 1 170px; min-width: 0; margin-bottom: 8px; border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 4px 12px; font-size: 13px }
.search::placeholder { color: var(--muted) }
.tagbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px }
.tagbar:empty { display: none }
.tag { display: inline-block; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 99px; padding: 2px 10px; font-size: 12.5px; line-height: 1.6 }
button.tag:hover { border-color: var(--accent); color: var(--ink) }
.tag[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card) }
.tag .c { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 3px }
#list { margin-top: 8px }
.shelfbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; align-items: center }
.shelfbar:empty { display: none }
.tag.sh { border-radius: 5px; font-weight: 500 }
.sh-sec { margin-bottom: 38px }
.sh-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; min-width: 0 }
.sh-head h3 { font-family: var(--f-display); font-size: 19px; margin: 0; word-break: keep-all }
.sh-head .c { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }
.sh-rename { border: 0; background: none; color: var(--muted); padding: 2px; opacity: .55; align-self: center; display: grid }
.sh-rename:hover { opacity: 1 }
.sh-rename svg { width: 15px; height: 15px }
.sh-input { font-family: var(--f-display); font-size: 18px; border: 1px solid var(--accent); border-radius: 6px; padding: 0 6px; background: var(--card); width: 12em; max-width: 100% }
.viewtog { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; background: var(--card) }
.viewtog button { border: 0; background: none; font-size: 12.5px; padding: 2px 11px; color: var(--muted) }
.viewtog button[aria-pressed="true"] { background: var(--accent); color: var(--card) }
.spines { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 3px; padding: 14px 8px 0; border-bottom: 7px solid var(--ledge); border-radius: 0 0 2px 2px; box-shadow: 0 7px 8px -7px rgba(0,0,0,.28) }
.spine { --sp: #6f7f68; --sp-ink: #fbfcf8; border: 0; padding: 22px 0 24px; flex: none; border-radius: 2px 3px 3px 2px; color: var(--sp-ink);
  background: linear-gradient(to bottom, transparent 12px, rgba(255,255,255,.22) 12px 14px, transparent 14px calc(100% - 16px), rgba(255,255,255,.22) calc(100% - 16px) calc(100% - 14px), transparent 0), linear-gradient(90deg, rgba(0,0,0,.14), rgba(255,255,255,.08) 30%, rgba(0,0,0,.06) 70%, rgba(0,0,0,.2)), var(--sp);
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 6px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s ease }
.spine { position: relative; width: var(--w); height: var(--h); transition: transform .15s ease, width .28s ease }
.spine .face { position: absolute; inset: 0; opacity: 0; transition: opacity .22s ease; pointer-events: none }
.spine .face .cover { height: 100%; aspect-ratio: auto; border-radius: 2px 4px 4px 2px; box-shadow: none }
.spine .face .ph { display: none }
.spine.peek, .spine:focus-visible { transform: translateY(-5px) }
.spine.peek[data-cover], .spine[data-cover]:focus-visible { width: calc(var(--h) * 0.667) }
.spine.peek .face, .spine:focus-visible .face { opacity: 1 }
@media (hover: hover) {
  .spine:hover { transform: translateY(-5px) }
  .spine[data-cover]:hover { width: calc(var(--h) * 0.667) }
  .spine:hover .face { opacity: 1 }
}
.faceout { border: 0; background: none; padding: 0; flex: none; width: 128px; margin-right: 6px; align-self: flex-end; transition: transform .15s ease }
.faceout:hover { transform: translateY(-4px) }
.faceout .cover { box-shadow: 0 2px 6px rgba(0,0,0,.28) }
.spine .st { writing-mode: vertical-rl; font-family: var(--f-display); font-weight: 700; font-size: var(--fs, 14px); line-height: 1.15; letter-spacing: .02em; min-height: 0; flex: 1 1 auto; max-width: 100%; white-space: nowrap }
.spine .sa { writing-mode: vertical-rl; font-family: var(--f-body); font-weight: 300; font-size: 10.5px; line-height: 1.15; opacity: .8; flex: none; white-space: nowrap; letter-spacing: .08em; padding-top: 7px; border-top: 1px solid currentColor; border-top-color: color-mix(in srgb, currentColor 35%, transparent) }
.author { font-family: var(--f-body); font-weight: 300; letter-spacing: .06em; color: var(--muted) }
.shelf-empty { align-self: center; color: var(--muted); font-size: 13px; padding: 26px 4px 30px }
.tag.sh.add { border-style: dashed; color: var(--muted) }
.shelfbar .sh-rename { margin-left: -4px }
.sh-new { font-size: 12.5px; border: 1px solid var(--accent); border-radius: 5px; padding: 2px 8px; width: 9em; background: var(--card) }
.sh-sec .grid { padding-bottom: 16px; border-bottom: 7px solid var(--ledge); border-radius: 0 0 2px 2px; box-shadow: 0 7px 8px -7px rgba(0,0,0,.28) }
.newshelf { display: flex; gap: 6px; margin-top: 8px; align-items: center }
.newshelf input { flex: 1; min-width: 0 }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 22px 16px }
.book { border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.cover { aspect-ratio: 2 / 3; width: 100%; max-width: 100%; border-radius: 3px 6px 6px 3px; overflow: hidden; box-shadow: var(--shadow); background: var(--card); position: relative; transition: transform .18s ease }
.book:hover .cover { transform: translateY(-3px) }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block }
.cover img.blur { object-fit: cover; filter: blur(12px) saturate(1.1); transform: scale(1.2); opacity: .9 }
.cover::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: linear-gradient(90deg, rgba(0,0,0,.18), transparent) }
.ph { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 16px 14px 14px 18px;
  background: var(--accent-soft); color: var(--ink) }
.ph b { font-family: var(--f-display); font-size: 17px; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere }
.ph span { font-size: 12px; color: var(--muted) }
.meta { min-width: 0; display: flex; flex-direction: column; gap: 2px }
.meta .t { font-family: var(--f-display); font-weight: 700; font-size: 14.5px; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere }
.meta .a { color: var(--muted); font-size: 12.5px; font-family: var(--f-body); font-weight: 300; letter-spacing: .05em }
.meta .one { font-family: var(--f-display); font-size: 13.5px; line-height: 1.5; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px }
.stars { color: var(--star); letter-spacing: 1px; font-size: 13px; line-height: 1.3 }
.stars .off { color: var(--line) }
.stamp { display: inline-block; align-self: flex-start; margin-top: 6px; font-size: 12px; font-variant-numeric: tabular-nums; letter-spacing: .04em;
  color: var(--stamp); border: 1.5px solid currentColor; border-radius: 3px; padding: 0 6px; transform: rotate(-2deg) }
.stamp.soft { color: var(--accent); border-style: dashed; transform: none }
.chip { display: inline-block; font-size: 11px; letter-spacing: .04em; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-left: 4px; vertical-align: middle }

/* 읽고 싶은 책: 목록 */
.wlist { list-style: none; margin: 0; padding: 0; max-width: 720px; border-top: 1px solid var(--line) }
.wlist button { width: 100%; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 13px 4px }
.wlist button:hover { background: var(--card) }
.wlist .t { font-family: var(--f-display); font-weight: 700; font-size: 17px; word-break: keep-all; overflow-wrap: anywhere; min-width: 0 }
.wlist .a { color: var(--muted); font-size: 13.5px; font-family: var(--f-body); font-weight: 300; letter-spacing: .06em }

.empty { border: 1.5px dashed var(--line); border-radius: 12px; padding: 40px 20px; text-align: center; color: var(--muted) }
.empty p { margin: 0 0 14px }
.notice { background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-bottom: 18px }
.notice.seed-banner { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 18px 20px; border: 2px solid var(--accent); background: var(--card) }
.seed-banner .sb-text { display: flex; flex-direction: column; gap: 2px }
.seed-banner .sb-text b { font-family: "Gowun Batang", serif; font-size: 26px; line-height: 1.3; color: var(--accent) }
.seed-banner .sb-text span { font-size: 15px; color: var(--muted) }
.seed-banner .sb-go { text-decoration: none; white-space: nowrap }

/* 돌아보기 */
.years { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 26px }
.tile { background: var(--card); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow) }
.tile .v { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums }
.tile .v small { font-size: 15px; font-weight: 400; margin-left: 2px; color: var(--muted) }
.tile .k { font-size: 13px; color: var(--muted) }
.r-sec { margin-bottom: 28px }
.goal { background: var(--card); border-radius: 10px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 14px }
.g-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: 15px }
.g-top .g-num { color: var(--accent); font-family: var(--f-display); font-size: 18px }
.g-bar { height: 10px; border-radius: 99px; background: var(--paper); margin-top: 10px; overflow: hidden }
.g-bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease }
.g-note { font-size: 12.5px; color: var(--muted); margin-top: 6px }
.goal-input { width: 5.5em; border: 1px solid var(--accent); border-radius: 6px; padding: 3px 8px; background: var(--paper); font-variant-numeric: tabular-nums }
.exp { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px }
.exp-btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 14px 16px; text-align: left; display: flex; flex-direction: column; gap: 4px }
.exp-btn:hover { border-color: var(--accent) }
.exp-btn b { font-family: var(--f-display); font-size: 16px }
.exp-btn span { font-size: 13px; color: var(--muted) }
.exp-msg { font-size: 13px; color: var(--muted); min-height: 1.2em; margin: 8px 0 0 }
.m-h { font-family: var(--f-display); font-size: 19px; margin: 0 }
.m-l { font-size: 13px; color: var(--muted); margin-bottom: 6px }
.m-check { display: flex; align-items: center; gap: 8px; font-size: 14px }
.r-sec h3 { font-size: 13px; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0 0 10px }
.months { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; align-items: end; height: 190px; background: var(--card); border-radius: 10px; padding: 14px 12px 10px; box-shadow: var(--shadow) }
.mo { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; min-width: 0 }
.mo .cnt { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink); min-height: 1em }
.mo .b { width: 100%; max-width: 30px; background: var(--accent); border-radius: 4px 4px 1px 1px; min-height: 2px }
.mo .b.zero { background: var(--line) }
.mo .m { font-size: 11.5px; color: var(--muted); white-space: nowrap }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 12px }
.shelf .book { gap: 4px }
.shelf .book .cap { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums }
.best { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }

  box-shadow: -8px 0 30px rgba(0,0,0,.18) }

blockquote { margin: 0 0 12px; padding: 12px 52px 12px 16px; border-left: 3px solid var(--stamp); background: var(--paper); border-radius: 0 8px 8px 0;
  font-family: var(--f-display); font-size: 16px; line-height: 1.75; overflow-wrap: anywhere; position: relative; min-height: 52px }

.qt mark { color: inherit; background: linear-gradient(transparent 48%, var(--hl) 48%, var(--hl) 94%, transparent 94%); -webkit-box-decoration-break: clone; box-decoration-break: clone; padding: 0 1px; cursor: pointer }

.hl-float { position: fixed; z-index: 40; display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--hl-edge);
  background: var(--hl); color: var(--ink); font-weight: 600; font-size: 14px; box-shadow: var(--shadow); transform: translateX(-50%); white-space: nowrap }

.q-tools { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px }

.q-book .q-book-h { justify-self: stretch }

.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px }

/* 글귀 카드 미리보기 */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(15,20,28,.6); display: flex; align-items: center; justify-content: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.q-add-row { display: flex; flex-wrap: wrap; gap: 8px }
.q-add-row .btn { display: inline-flex; align-items: center; gap: 6px }
.q-add-row svg { width: 16px; height: 16px }
.ocr-box { width: min(760px, 100%) }
.ocr-stage { position: relative; align-self: center; max-width: 100%; line-height: 0; user-select: none; -webkit-user-select: none; overflow: hidden; border-radius: 4px }
.ocr-stage canvas { display: block; max-width: 100%; max-height: 62vh; width: auto; height: auto; touch-action: none; cursor: crosshair; border-radius: 4px }
.ocr-sel { position: absolute; border: 2px solid var(--accent); background: color-mix(in srgb, var(--hl) 35%, transparent); box-shadow: 0 0 0 9999px rgba(0,0,0,.35); pointer-events: none; border-radius: 2px }
.ocr-sel .hd { position: absolute; width: 14px; height: 14px; background: #fff; border: 2px solid var(--accent); border-radius: 50% }
.ocr-sel .tl { left: -2px; top: -2px } .ocr-sel .tr { right: -2px; top: -2px } .ocr-sel .bl { left: -2px; bottom: -2px } .ocr-sel .br { right: -2px; bottom: -2px }
@media (max-width: 600px) { .ocr-stage canvas { max-height: 70vh } }
.ocr-flash { animation: ocrflash 1.6s ease }
@keyframes ocrflash { 0%, 40% { background: var(--hl) } 100% { background: var(--paper) } }
.modal-box { background: var(--card); border-radius: 12px; padding: 16px; width: min(440px, 100%); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px }
.modal-box img { width: 100%; border-radius: 6px; box-shadow: var(--shadow); display: block }
.modal-box .hint { font-size: 13px; color: var(--muted); margin: 0 }
.swatches { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted) }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); padding: 0 }
.sw[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--card) inset }

form label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin: 14px 0 5px }
form input[type=text], form input[type=date], form textarea { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 9px 12px }
form textarea { resize: vertical; min-height: 80px; line-height: 1.6 }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px }
.two > div { min-width: 0 }
.status-one { display: inline-block; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13px; border-radius: 99px; padding: 3px 12px }
.sheet-head h2 .title-input { font-size: 20px }
.status-pick { display: flex; gap: 6px }
.status-pick button { flex: 1; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 4px; font-size: 14px }
.status-pick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.star-pick { display: flex; gap: 2px }
.star-pick button { border: 0; background: none; font-size: 26px; line-height: 1; padding: 2px; color: var(--line) }
.star-pick button.on { color: var(--star) }
.stars .s.off { color: var(--line) }
.stars .s.half, .star-pick button.half { background: linear-gradient(90deg, var(--star) 50%, var(--line) 50%); -webkit-background-clip: text; background-clip: text; color: transparent }
.star-pick.quick button { font-size: 20px; padding: 0 1px }
.tag.add { border-style: dashed; color: var(--muted) }
.tag-sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px }
.cover-pick { display: flex; gap: 14px; align-items: center }

.cover .prev-canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--card) }
.quote-row { display: grid; grid-template-columns: 1fr 64px 34px; gap: 6px; margin-bottom: 8px }
.quote-row textarea { min-height: 60px }
.quote-row input { padding: 9px 8px }
.x { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; color: var(--muted) }
.err { color: var(--danger); font-size: 13px; margin-top: 10px }
.mcal { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px }

.mc.none { background: transparent; border: 1px dashed var(--line) }

.mh b { font-family: var(--f-display); font-size: 16px }

.mh span { font-size: 12px; color: var(--stamp); font-variant-numeric: tabular-nums; font-weight: 600 }
.mbooks { display: flex; flex-wrap: wrap; gap: 6px }

.mbooks .cover { box-shadow: 0 1px 3px rgba(0,0,0,.18) }
.mbooks .ph { padding: 4px 3px 4px 6px }

.mbooks .ph span { display: none }
@media (max-width: 640px) { .mcal { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
@media (max-width: 420px) { .mcal { grid-template-columns: repeat(2, minmax(0, 1fr)) } .tiles { gap: 8px } .tile { padding: 12px } .tile .v { font-size: 24px } }

  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 10px }

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }

/* ---------- 쌓은 높이 · 배지 · 책장 소품 · 읽는 시간 · 책 찾기 ---------- */
.stat-strip { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px }

.stat-strip .h small, .hi-num small { font-size: .5em; font-weight: 400; color: var(--muted); margin-left: 2px }
.stat-strip .mid { flex: 1; min-width: 0 }
.stat-strip .mid > span { display: block }
.stat-strip .lbl { font-size: 11px; letter-spacing: .08em; font-weight: 600; color: var(--muted) }
.stat-strip .next { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

.hi-top { text-align: center; margin: 4px 0 14px }

.stack { display: flex; flex-direction: column; align-items: center; margin: 0 auto 6px; max-width: 300px; border-bottom: 7px solid var(--ledge); padding: 0 10px }
.stack .lay { width: 100%; border-radius: 2px 3px 3px 2px; color: #fbfcf8; font-family: var(--f-display); font-size: 11px; line-height: 1; padding: 0 10px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; box-shadow: inset 0 -1px 0 rgba(0,0,0,.18), inset 4px 0 0 rgba(255,255,255,.14) }
.stack .lay span { overflow: hidden; text-overflow: ellipsis }
.stack .lay:nth-child(3n+1) { width: 94% } .stack .lay:nth-child(3n+2) { width: 98%; align-self: flex-start }
.stack-more { text-align: center; font-size: 12.5px; color: var(--muted); margin-bottom: 14px }
.est-note { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin: 10px 0 0 }
.est-note .row { margin-top: 8px }
.miles { display: flex; flex-wrap: wrap; gap: 6px }
.mile { border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 13px; color: var(--muted); background: var(--paper) }
.mile b { font-weight: 600; color: var(--ink) }
.mile.on { border-color: var(--accent); background: var(--accent-soft) } .mile.on b { color: var(--accent) }
.mile.next { border-style: dashed; border-color: var(--stamp) }
.bdg-group { font-size: 12px; letter-spacing: .08em; font-weight: 600; color: var(--muted); margin: 16px 0 8px }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 14px 6px }
.bdg { border: 0; background: none; padding: 0; text-align: center; min-width: 0 }
.bdg .ic { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 27px; line-height: 1; margin: 0 auto 5px; background: var(--accent-soft); border: 2px solid var(--accent) }
.bdg .nm { display: block; font-size: 12.5px; font-weight: 500; line-height: 1.3; word-break: keep-all }
.bdg .pg { display: block; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums }
.bdg.off .ic { background: var(--paper); border: 2px dashed var(--line); filter: grayscale(1); opacity: .5 }
.bdg.off .nm { color: var(--muted) }
.bdg[aria-pressed="true"] .ic { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--stamp) }
.bdg .placed { color: var(--stamp) }
.bdg-panel { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; margin-top: 12px; padding: 10px 12px; font-size: 13.5px }
.bdg-hint { font-size: 13px; color: var(--muted); margin: -4px 0 0 }

/* 나무 책장: 칸마다 나무 틀, 줄이 넘어가면 선반 판이 하나씩 더 생긴다 */
.spines { --row: 206px; --board: 14px; gap: var(--board) 2px; padding: 0 10px var(--board); border: solid #7b4f34; border-width: 12px 12px 0; border-radius: 5px 5px 3px 3px;
  border-image: linear-gradient(90deg, #6a422b, #8c5c3e 12%, #7b4f34 50%, #8c5c3e 88%, #6a422b) 1; box-shadow: 0 10px 18px -8px rgba(0,0,0,.45);
  background:
    repeating-linear-gradient(to bottom, transparent 0 var(--row), #a06c49 var(--row) calc(var(--row) + 3px), #7b4f34 calc(var(--row) + 3px) calc(var(--row) + var(--board) - 2px), #5a3723 calc(var(--row) + var(--board) - 2px) calc(var(--row) + var(--board))),
    repeating-linear-gradient(to bottom, rgba(0,0,0,.5) 0, rgba(0,0,0,.16) 34px, rgba(0,0,0,0) 110px, rgba(0,0,0,0) calc(var(--row) - 10px), rgba(0,0,0,.2) var(--row), rgba(0,0,0,0) var(--row), rgba(0,0,0,0) calc(var(--row) + var(--board))),
    linear-gradient(90deg, rgba(0,0,0,.34), rgba(0,0,0,0) 9% 91%, rgba(0,0,0,.34)),
    repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 2px, rgba(0,0,0,.03) 2px 5px),
    #654230 }
.spine { margin-top: calc(var(--row) - var(--h)); box-shadow: 0 1px 2px rgba(0,0,0,.4), 2px 0 3px -1px rgba(0,0,0,.35) }
.spine.img { padding: 0; background: #d9d4cb }
.spine.img .sp-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; display: block }
/* 빈 칸: 안내 글은 뒤에 깔고, 소품은 선반 어디든 놓을 수 있게 */
.spines.empty { position: relative; min-height: calc(var(--row) + var(--board)) }
.spines .shelf-empty { color: #e7d8c8; position: absolute; left: 16px; right: 16px; top: 0; height: var(--row); display: flex; align-items: center; pointer-events: none }
.decor { flex: none; height: var(--row); display: flex; align-items: flex-end; border: 0; background: none; padding: 0 6px; font-size: 46px; line-height: 1; filter: drop-shadow(0 3px 3px rgba(0,0,0,.45)); transition: transform .15s ease }

.decor:hover { transform: translateY(-3px) }
.decor.dragging { transition: none; cursor: grabbing; z-index: 30; position: relative; pointer-events: none; filter: drop-shadow(0 10px 8px rgba(0,0,0,.5)) }
.decor svg { display: block; height: 96px; width: auto }
.decor.cat svg { height: 72px }
.spine-pick { display: flex; gap: 12px; align-items: center }
.spine-pick .prev { width: 22px; height: 96px; flex: none; border-radius: 2px; background: var(--line) center / 100% 100% no-repeat; box-shadow: var(--shadow) }
.bs-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap }

.timer { position: fixed; inset: 0; z-index: 60; background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px)) }

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
  const fmtDate = s => s ? s.replace(/^(\d{4})-(\d{2})-(\d{2})$/, (m,y,mo,d) => `${y}. ${+mo}. ${+d}.`) : "";
  const statusOf = b => b.status === "want" || b.status === "reading" ? b.status : "read";
  const STATUS_NAME = { read: "읽은 책", reading: "읽는 중", want: "읽고 싶은 책" };

  let books = [];
  let tab = "read";
  let query = "";
  let tagFilter = "";
  let shelfFilter = "";
  const qOpen = new Set();
  let viewMode = "spine";
  try { viewMode = localStorage.getItem("reading-log-view") || "spine"; } catch {}
  const SPINE_COLORS = ["#6f7f68", "#9b5f48", "#4d6a8c", "#b8913f", "#6a5a7c", "#3f6b63", "#a9775f", "#7f8452", "#5b6470", "#8c4f5c"];
  const spineCache = new Map();
  const hashN = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
  function paintSpines() {
    document.querySelectorAll(".spine[data-cover]").forEach(el => {
      const src = el.dataset.cover;
      const apply = c => { if (c) { el.style.setProperty("--sp", c.bg); el.style.setProperty("--sp-ink", c.ink); } };
      if (spineCache.has(src)) { const c = spineCache.get(src); if (c && c.then) c.then(apply); else apply(c); return; }
      const p = new Promise(res => {
        const img = new Image();
        img.onload = () => {
          try {
            const cv = document.createElement("canvas"); cv.width = 20; cv.height = 30;
            const cx = cv.getContext("2d"); cx.drawImage(img, 0, 0, 20, 30);
            const d = cx.getImageData(0, 0, 20, 30).data; let r = 0, g = 0, b = 0, n = 0;
            for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
            r /= n; g /= n; b /= n;
            // 너무 밝은 표지는 조금 눌러서 책등 같은 색으로
            const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            if (lum > 0.82) { r *= 0.88; g *= 0.88; b *= 0.88; }
            const L = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            res({ bg: `rgb(${r | 0}, ${g | 0}, ${b | 0})`, ink: L > 0.58 ? "#1f2a3a" : "#fbfcf8" });
          } catch { res(null); }
        };
        img.onerror = () => res(null);
        img.src = src;
      });
      spineCache.set(src, p);
      p.then(c => { spineCache.set(src, c); apply(c); });
    });
  }
  let reviewYear = String(new Date().getFullYear());
  let todayPick = null;
  let store = null;      // db collection or null
  let assets = null;
  let downloads = null;
  let canWrite = true;
  const LS = "reading-log-books";

  // ---------- storage ----------
  function lsLoad() { try { return JSON.parse(localStorage.getItem(LS) || "[]"); } catch { return []; } }
  function lsSave() { try { localStorage.setItem(LS, JSON.stringify(books)); } catch {} }

  // Firestore는 배열 안의 배열을 받지 않아서, 형광펜 구간 [[a,b]]를 [{s,e}]로 바꿔 저장한다
  function forStore(body) {
    if (!Array.isArray(body.quotes)) return body;
    return { ...body, quotes: body.quotes.map(q => Array.isArray(q.marks) ? { ...q, marks: q.marks.map(r => Array.isArray(r) ? { s: +r[0], e: +r[1] } : r) } : q) };
  }
  async function saveBook(b) {
    b.updatedAt = Date.now();
    if (store) { const { id, ...body } = b; await store.doc(id).set(forStore(body)); }
    else { const i = books.findIndex(x => x.id === b.id); if (i >= 0) books[i] = b; else books.push(b); lsSave(); render(); }
  }
  async function removeBook(b) {
    if (store) await store.doc(b.id).delete();
    else { books = books.filter(x => x.id !== b.id); lsSave(); render(); }
    if (b.cover && assets) { try { await assets.delete(b.cover); } catch {} }
  }
  const newId = () => "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // ---------- 기록장 제목 ----------
  const TITLE_DEFAULT = "나의 서재";
  let titleDoc = null;
  let settings = {};
  try { settings = JSON.parse(localStorage.getItem("reading-log-settings") || "{}"); } catch {}
  async function saveSettings(patch) {
    settings = { ...settings, ...patch };
    try { localStorage.setItem("reading-log-settings", JSON.stringify(settings)); } catch {}
    if (titleDoc) { try { await titleDoc.set(settings); } catch { showNotice("저장하지 못했어요. 다시 바꿔 주세요."); } }
  }
  const MOTTO_DEFAULT = "밑줄 그은 자리마다, 그때의 내가 머물러 있다.";
  $("#mottoBtn").addEventListener("click", () => {
    if (!canWrite) return;
    const inp = $("#mottoInput"); inp.value = $("#mottoText").textContent;
    $("#mottoBtn").hidden = true; inp.hidden = false; inp.focus(); inp.select();
  });
  async function finishMotto(save) {
    const inp = $("#mottoInput"); if (inp.hidden) return;
    inp.hidden = true; $("#mottoBtn").hidden = false;
    if (!save) return;
    const v = inp.value.trim();
    $("#mottoText").textContent = v || MOTTO_DEFAULT;
    await saveSettings({ motto: v && v !== MOTTO_DEFAULT ? v : "" });
  }
  $("#mottoInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); finishMotto(true); } if (e.key === "Escape") finishMotto(false); });

  // ---------- cover image ----------
  // 사진 읽기: createImageBitmap 을 먼저 쓰고, 안 되면 FileReader 로 읽는다
  async function decodeImage(file) {
    if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch {} }
    return await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = fr.result; };
      fr.onerror = rej; fr.readAsDataURL(file);
    });
  }
  async function resizeImage(file, max, q) {
    const img = await decodeImage(file);
    const iw = img.width || img.naturalWidth, ih = img.height || img.naturalHeight;
    if (!iw || !ih) throw new Error("empty");
    const s = Math.min(1, max / Math.max(iw, ih));
    const c = document.createElement("canvas"); c.width = Math.round(iw * s); c.height = Math.round(ih * s);
    const cx = c.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, c.width, c.height); cx.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("blob")), "image/jpeg", q));
    return { blob, dataUrl: c.toDataURL("image/jpeg", q), canvas: c };
  }
  const CAMERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
  const PEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>';
  const ERASER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20H7l-4-4 10-10 7 7-6.5 6.5"/><path d="M6 11l7 7"/></svg>';
  const CARD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>';

  // 형광펜 구간: q.marks = [[시작, 끝], ...] (글자 위치). 예전 기록의 q.hl 은 문장 전체로 읽음.
  function getMarks(q) {
    const len = (q.text || "").length;
    let m = Array.isArray(q.marks) ? q.marks.map(r => Array.isArray(r) ? r : [r && r.s, r && r.e]) : (q.hl ? [[0, len]] : []);
    m = m.map(([a, b]) => [Math.max(0, Math.min(len, +a)), Math.max(0, Math.min(len, +b))]).filter(([a, b]) => b > a).sort((x, y) => x[0] - y[0]);
    const out = [];
    for (const r of m) { const last = out[out.length - 1]; if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else out.push([r[0], r[1]]); }
    return out;
  }
  function qtHTML(q, clickable = true) {
    const t = q.text || ""; let pos = 0, html = "";
    getMarks(q).forEach(([a, b], k) => { html += esc(t.slice(pos, a)) + `<mark${clickable ? ` data-m="${k}" title="누르면 형광펜이 지워져요"` : ""}>${esc(t.slice(a, b))}</mark>`; pos = b; });
    return html + esc(t.slice(pos));
  }
  function quoteHTML(b, q, i, withSrc) {
    const has = getMarks(q).length > 0;
    return `<blockquote data-b="${esc(b.id)}" data-i="${i}"><span class="qt">${qtHTML(q)}</span>${q.part || q.page ? `<small>${[q.part ? `〈${esc(q.part)}〉` : "", q.page ? `${esc(q.page)}쪽` : ""].filter(Boolean).join(" · ")}</small>` : ""}${withSrc ? `<small><button class="quote-src" data-open="${esc(b.id)}">${esc(b.title)}${b.author ? " · " + esc(b.author) : ""}</button></small>` : ""}
      <span class="q-tools"><button class="q-tool" data-card aria-label="글귀 카드 만들기" title="글귀 카드로 저장">${CARD}</button>${canWrite && has ? `<button class="q-tool" data-hlclear aria-label="이 글귀의 형광펜 모두 지우기" title="형광펜 모두 지우기">${ERASER}</button>` : ""}</span></blockquote>`;
  }
  async function setMarks(id, i, marks) {
    const b = books.find(x => x.id === id); if (!b?.quotes?.[i]) return;
    const nb = JSON.parse(JSON.stringify(b));
    nb.quotes[i].marks = marks; delete nb.quotes[i].hl;
    nb.quotes[i].marks = getMarks(nb.quotes[i]);
    const k = books.findIndex(x => x.id === id); if (k >= 0) books[k] = nb;
    document.querySelectorAll(`blockquote[data-b="${CSS.escape(id)}"][data-i="${i}"]`).forEach(el => {
      el.outerHTML = quoteHTML(nb, nb.quotes[i], i, !!el.querySelector(".quote-src"));
    });
    if (!layer.innerHTML) render(); else updateCounts();
    try { await saveBook(nb); } catch { showNotice("형광펜을 저장하지 못했어요. 다시 칠해 주세요."); }
  }

  const coverSrc = b => b.cover ? "/_blob/" + b.cover : (b.coverData || "");
  function coverHTML(b) {

  }
  const clampRate = n => Math.max(0, Math.min(5, Math.round((+n || 0) * 2) / 2));
  const starCls = (k, r) => k <= r ? "on" : (k - 0.5 === r ? "half" : "");
  function starsHTML(n) {
    n = clampRate(n); if (!n) return "";
    return `<span class="stars" aria-label="별점 ${n}점">${[1,2,3,4,5].map(k => `<span class="s ${starCls(k, n) || "off"}">★</span>`).join("")}</span>`;
  }
  // 별의 왼쪽 절반을 누르면 반 개, 오른쪽을 누르면 한 개
  function rateFromClick(btn, n, e, cur) {
    let v = n;
    if (e.detail !== 0) { const r = btn.getBoundingClientRect(); if (e.clientX - r.left < r.width / 2) v = n - 0.5; }
    return clampRate(cur) === v ? 0 : v;
  }
  // 읽은 순서: 한글 파일에서 옮긴 책(날짜 없음)은 파일에 적힌 차례대로 먼저, 그다음 날짜가 있는 책은 읽은 날짜 순서대로
  function readOrder(a, b) {
    const da = a.date || "", db = b.date || "";
    if (!da && !db) return (b.createdAt || 0) - (a.createdAt || 0);
    if (!da) return -1; if (!db) return 1;
    return da.localeCompare(db) || (a.createdAt || 0) - (b.createdAt || 0);
  }
  const tagsOf = b => Array.isArray(b.tags) ? b.tags.filter(Boolean) : [];

  // ---------- 오늘의 문장 ----------
  function allQuotes() {
    const out = []; books.forEach(b => (b.quotes || []).forEach((q, i) => { if (q.text) out.push({ b, q, i }); }));
    return out;
  }
  function pickToday(force) {
    const all = allQuotes(); if (!all.length) { todayPick = null; return; }
    // 섞어서 고르기: 형광펜 칠한 글귀가 더 자주(10번 중 7번), 가끔 칠하지 않은 글귀도
    const marked = all.filter(x => getMarks(x.q).length);
    const plain = all.filter(x => !getMarks(x.q).length);
    const valid = todayPick && all.some(x => x.b.id === todayPick.id && x.i === todayPick.i);
    if (valid && !force) return;
    let pool = !marked.length ? plain : !plain.length ? marked : (Math.random() < 0.7 ? marked : plain);
    let cand = pool;
    if (force && todayPick) { cand = pool.filter(x => !(x.b.id === todayPick.id && x.i === todayPick.i)); if (!cand.length) cand = all.filter(x => !(x.b.id === todayPick.id && x.i === todayPick.i)); if (!cand.length) cand = pool; }
    const x = cand[Math.floor(Math.random() * cand.length)];
    todayPick = { id: x.b.id, i: x.i };
  }
  function renderToday() {
    const el = $("#today");
    if (tab !== "read" || query.trim()) { el.hidden = true; return; }
    pickToday(false);
    const b = todayPick && books.find(x => x.id === todayPick.id);
    const q = b?.quotes?.[todayPick.i];
    if (!q) { el.hidden = true; return; }
    const marks = getMarks(q);
    const text = marks.length ? marks.map(([a, e]) => `<mark>${esc(q.text.slice(a, e))}</mark>`).join(" … ") : esc(q.text);
    const many = allQuotes().length > 1;
    el.innerHTML = `<div class="lbl"><span>오늘의 문장</span>${many ? `<button class="btn ghost sm" data-today-next aria-label="다른 문장" title="다른 문장">↻</button>` : ""}</div>
      <div class="txt">${text}</div>
      <button class="src" data-open="${esc(b.id)}">— ${esc(b.title)}${b.author ? ", " + esc(b.author) : ""}${q.page ? ` · ${esc(q.page)}쪽` : ""}</button>`;

  // ---------- render ----------

    const q = query.trim().toLowerCase();
    const el = $("#list");

    if (tab === "year" || tab === "hl" || tab === "map") $("#shelfbar").innerHTML = "";
    if (tab === "map") { $("#tagbar").innerHTML = ""; el.innerHTML = mapHTML(); return; }
    if (tab === "year") { $("#tagbar").innerHTML = ""; el.innerHTML = reviewHTML(read); return; }

    if (tab === "hl") {
      $("#tagbar").innerHTML = "";
      let items = hls;
      if (q) items = items.filter(h => [h.q.text, h.b.title, h.b.author].join(" ").toLowerCase().includes(q));
      // 책마다 남긴 글귀를 책별로 묶어 보여 준다 (형광펜 칠한 부분은 그대로 표시)
      const order = [];
      items.forEach(h => { let g = order.find(x => x.b === h.b); if (!g) { g = { b: h.b, qs: [] }; order.push(g); } g.qs.push(h); });
      order.sort((a, b) => readOrder(a.b, b.b));
      // 책 제목만 보이게 접어 두고, 누르면 글귀가 펼쳐진다. 검색 중에는 모두 펼친다

        : `<div class="empty"><p>${q ? `“${esc(query)}”에 맞는 문장이 없어요.` : "읽은 책에 오래 머문 문장을 남기면 여기에 책별로 모여요."}</p></div>`;

    let list = tab === "read" ? read : tab === "reading" ? reading : want;
    // 꼬리표 모음

    const tagNames = Object.keys(tc).sort((a, b) => tc[b] - tc[a] || a.localeCompare(b, "ko"));

      tagNames.map(t => `<button class="tag" data-tagf="${esc(t)}" aria-pressed="${tagFilter === t}">#${esc(t)}<span class="c">${tc[t]}</span></button>`).join("") : "";
    if (tagFilter) list = list.filter(b => tagsOf(b).includes(tagFilter));
    if (q) list = list.filter(b => [b.title, b.author, b.memo, b.oneLine, b.shelf, ...tagsOf(b), ...(b.quotes || []).map(x => x.text)].join(" ").toLowerCase().includes(q));
    const shelves = shelfList();

      const names = narrowing ? shelves.filter(n => sc[n]) : shelves;
      const allLabel = settings.allLabel || "전체 서재";
      $("#shelfbar").innerHTML = `<button class="tag sh" data-shf="" aria-pressed="${!shelfFilter}">${esc(allLabel)}</button>`
        + (canWrite ? `<button class="sh-rename" data-allrename aria-label="${esc(allLabel)} 이름 바꾸기" title="이름 바꾸기">${EDIT_PEN}</button>` : "")
        + names.map(n => `<button class="tag sh" data-shf="${esc(n)}" aria-pressed="${shelfFilter === n}">${esc(n)}<span class="c">${sc[n] || 0}</span></button>`).join("")
        + (canWrite ? `<button class="tag sh add" data-addshelf aria-label="칸 추가" title="칸 추가">＋</button>` : "")
        + `<span class="viewtog" role="group" aria-label="보기 방식"><button data-view="spine" aria-pressed="${viewMode === "spine"}">꽂아 보기</button><button data-view="cover" aria-pressed="${viewMode === "cover"}">표지 보기</button></span>`;
    } else $("#shelfbar").innerHTML = "";
    const sorters = {
      read: readOrder,
      reading: (a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0),
      want: (a, b) => (b.createdAt || 0) - (a.createdAt || 0)
    };
    list = list.slice().sort(sorters[tab]);

    if (!list.length) {
      const msg = { read: "다 읽은 책을 기록해 보세요. 표지 사진, 별점, 마음에 남은 글귀, 메모를 함께 남길 수 있어요.",
        reading: "지금 읽고 있는 책을 넣어 두세요. 읽기 시작한 날도 함께 남아요.",
        want: "나중에 읽고 싶은 책의 제목과 저자를 적어 두세요." }[tab];
      el.innerHTML = q || tagFilter ? `<div class="empty"><p>찾는 책이 없어요.</p></div>`
        : `<div class="empty"><p>${msg}</p>${canWrite ? `<button class="btn primary" data-add="${tab}">＋ ${STATUS_NAME[tab]} 추가</button>` : ""}</div>`;
      if (tab === "want" && !q && !tagFilter) el.insertAdjacentHTML("afterbegin", recoBar());
      return;
    }
    if (tab === "reading") {
      el.innerHTML = `<ul class="wlist">${list.map(b => {
        const p = [b.pageNow ? `${esc(b.pageNow)}${num(b.pages) ? ` / ${num(b.pages)}` : ""}쪽` : "", num(b.readSecs) >= 60 ? `읽은 시간 ${fmtDur(b.readSecs)}` : ""].filter(Boolean).join(" · ");
        return `<li class="rl"><button data-open="${esc(b.id)}"><span class="t">${esc(b.title)}</span><span class="a">${esc(b.author)}</span>${p ? `<span class="p">${p}</span>` : ""}</button>${canWrite ? `<button class="btn sm${timer && timer.id === b.id ? " primary" : ""}" data-timer="${esc(b.id)}">${timer && timer.id === b.id ? "읽는 중" : "지금 읽기"}</button>` : ""}</li>`;
      }).join("")}</ul>`;
      return;
    }
    if (tab === "want") {
      el.innerHTML = (q || tagFilter ? "" : recoBar()) + `<ul class="wlist">${list.map(b => `<li><button data-open="${esc(b.id)}"><span class="t">${esc(b.title)}</span><span class="a">${esc(b.author)}</span></button></li>`).join("")}</ul>`;
      return;
    }
    const card = b => `
      <button class="book" data-open="${esc(b.id)}">
        ${coverHTML(b)}
        <div class="meta">
          <div class="t">${esc(b.title)}</div>
          <div class="a">${esc(b.author)}</div>
          ${tab === "read" ? starsHTML(b.rating) : ""}
          ${tab === "read" && b.oneLine ? `<div class="one">${esc(b.oneLine)}</div>` : ""}
          ${tab === "read" && b.date ? `<span class="stamp">${fmtDate(b.date)}</span>` : ""}
        </div>
      </button>`;
    const spine = b => {
      const h = hashN(b.id), t = b.title || "";
      // 제목과 저자가 다 들어가도록 책등 높이·두께 계산
      // 띄어쓰기에서만 줄을 나눠 한 단어가 갈라지지 않게 줄 수를 셈다
      const wordsOf = x => String(x || "").split(/\s+/).filter(Boolean).map(w => [...w].length);
      const colsFor = (ws, per) => { let cols = 0, cur = 0; for (let n of ws) { while (n > per) { if (cur) { cols++; cur = 0; } cols++; n -= per; } if (!n) continue; if (!cur) cur = n; else if (cur + 1 + n <= per) cur += 1 + n; else { cols++; cur = n; } } return cols + (cur ? 1 : 0); };
      const tw = wordsOf(t), aw = wordsOf(b.author), tl = [...t].length, al = [...(b.author || "")].length;
      // 책등 크기는 모두 같게, 제목이 길면 글자를 줄여서 맞춘다
      // 그린 책등도 책의 실제 두께에 맞춰 얇게: 제목이 다 안 들어가면 그만큼만 넓힌다
      const ht = 190; let w = Math.max(24, Math.min(44, Math.round(thickOf(b).mm * 0.88) + 6)), inner = w - 10;
      // 저자: 한 줄에 다 들어가면 한 줄, 아니면 띄어쓰기에서 두 줄로. 글자는 칸에 맞게 줄인다
      const AREA = 62, aWords = String(b.author || "").trim().split(/\s+/).filter(Boolean);
      let aCols = [], aFs = 10.5;
      if (al) {
        const one = aWords.join(" "), oneLen = [...one].length;
        if (AREA / oneLen >= 8.5 || aWords.length < 2 && oneLen <= 7) { aCols = [one]; aFs = Math.min(10.5, AREA / oneLen); }
        else {
          let best = null;
          if (aWords.length >= 2) for (let k = 1; k < aWords.length; k++) { const L = aWords.slice(0, k).join(" "), R = aWords.slice(k).join(" "); const m = Math.max([...L].length, [...R].length); if (!best || m < best.m) best = { L, R, m }; }
          else { const c = [...one], k = Math.ceil(c.length / 2); best = { L: c.slice(0, k).join(""), R: c.slice(k).join(""), m: k }; }
          aCols = [best.L, best.R]; aFs = Math.min(10.5, AREA / best.m, inner / 2 / 1.15);
        }
        aFs = Math.max(7, Math.round(aFs * 10) / 10);
      }
      const authorH = al ? Math.ceil(Math.max(...aCols.map(c => [...c].length)) * aFs * 1.1) + 10 : 0;
      const avail = ht - 46 - (al ? authorH + 6 : 0);
      // 제목을 단어 단위로 줄에 나눠 담는다 (예: 그리스인 / 조르바)
      const tWords = t.trim().split(/\s+/).filter(Boolean);
      const pack = per => { const cols = []; let cur = ""; for (let wd of tWords) { while ([...wd].length > per) { if (cur) { cols.push(cur); cur = ""; } cols.push([...wd].slice(0, per).join("")); wd = [...wd].slice(per).join(""); } if (!wd) continue; if (!cur) cur = wd; else if ([...cur].length + 1 + [...wd].length <= per) cur += " " + wd; else { cols.push(cur); cur = wd; } } if (cur) cols.push(cur); return cols; };
      let fs = 9, tCols = pack(Math.max(1, Math.floor(avail / (9 * 1.04))));
      { const wNeed = Math.ceil(tCols.length * 9 * 1.18) + 10; if (wNeed > w) { w = Math.min(60, wNeed); inner = w - 10; } }
      for (const f of [14, 13, 12, 11, 10, 9]) {
        const per = Math.max(1, Math.floor(avail / (f * 1.04))), maxCols = Math.max(1, Math.floor(inner / (f * 1.18)));
        const cols = pack(per);
        if (cols.length <= maxCols) { fs = f; tCols = cols; break; }
      }
      const src = coverSrc(b);
      if (b.spineData) {   // 진짜 책등 그림이 있는 책: 그림의 비율대로 세운다
        const hh = num(b.tall) ? Math.max(150, Math.min(200, Math.round(num(b.tall) * 0.88))) : 190;
        const ww = Math.max(9, Math.min(70, Math.round((num(b.thick) || 18) * hh / (num(b.tall) || 215))));
        return `<button class="spine img" data-open="${esc(b.id)}" ${src ? `data-cover="${esc(src)}"` : ""} title="${esc(t)}${b.author ? " · " + esc(b.author) : ""}" style="--h:${hh}px;--w:${ww}px"><img class="sp-img" src="${esc(b.spineData)}" alt="${esc(t)}" onload="var p=this.parentNode,h=parseFloat(p.style.getPropertyValue('--h'));p.style.setProperty('--w',Math.max(9,Math.min(70,Math.round(this.naturalWidth/this.naturalHeight*h)))+'px')" onerror="this.remove()">${src ? `<span class="face">${coverHTML(b)}</span>` : ""}</button>`;
      }
      return `<button class="spine" data-open="${esc(b.id)}" ${src ? `data-cover="${esc(src)}"` : ""} title="${esc(t)}${b.author ? " · " + esc(b.author) : ""}"
        style="--h:${ht}px;--w:${Math.round(w)}px;--fs:${fs}px;--ah:${authorH}px;--sp:${SPINE_COLORS[h % SPINE_COLORS.length]}"><span class="st">${tCols.map(esc).join("<br>")}</span>${al ? `<span class="sa" style="font-size:${aFs}px">${aCols.map(esc).join("<br>")}</span>` : ""}${src ? `<span class="face">${coverHTML(b)}</span>` : ""}</button>`;
    };
    // 선반마다 대표 책 한 권은 표지가 앞을 보게
    const pickFace = list => {
      const withCover = list.filter(b => coverSrc(b)); if (!withCover.length) return null;
      return withCover.slice().sort((a, b) => (+b.rating || 0) - (+a.rating || 0) || (b.quotes || []).length - (a.quotes || []).length || (b.createdAt || 0) - (a.createdAt || 0))[0];
    };
    const shelfRow = list => {
      const f = null;   // 꽂아 보기에서는 모두 책등으로
      return (f ? `<button class="faceout" data-open="${esc(f.id)}" title="${esc(f.title)}">${coverHTML(f)}</button>` : "") + list.filter(b => b !== f).map(spine).join("");
    };
    const groups = shelves.map(n => ({ name: n, books: list.filter(b => b.shelf === n) })).filter(g => g.books.length || !(q || tagFilter));
    const rest = list.filter(b => !shelves.includes(b.shelf));
    if (rest.length) groups.push({ name: "", books: rest });
    const shown = shelfFilter ? groups.filter(g => g.name === shelfFilter) : groups;
    const stNow = calcStats();
    el.innerHTML = shown.map(g => `<section class="sh-sec">
      <div class="sh-head" data-shhead="${esc(g.name)}"><h3>${g.name ? esc(g.name) : "아직 칸을 정하지 않은 책"}</h3><span class="c">${g.books.length}권</span>
        ${canWrite && g.name ? `<button class="sh-rename" data-shrename="${esc(g.name)}" aria-label="${esc(g.name)} 칸 이름 바꾸기" title="칸 이름 바꾸기">${EDIT_PEN}</button>` : ""}</div>
      ${!g.books.length ? `<div class="spines empty"><span class="shelf-empty">아직 꽂힌 책이 없어요. 책을 추가하거나 수정할 때 이 칸을 고르면 여기에 꽂혀요.</span>${g.name ? placeDecor([], g.name, stNow) : ""}</div>`
        : viewMode === "spine" ? `<div class="spines">${g.name ? placeDecor(g.books.map(spine), g.name, stNow) : shelfRow(g.books)}</div>` : `<div class="grid">${g.books.map(card).join("")}</div>`}</section>`).join("");
    if (viewMode === "spine") paintSpines();
  }

  // ---------- 한 해 돌아보기 ----------
  function reviewHTML(read) {
    const years = [...new Set(read.map(b => (b.date || "").slice(0, 4)).filter(Boolean).concat(String(new Date().getFullYear())))].sort().reverse();
    if (!years.includes(reviewYear)) reviewYear = years[0];
    const yb = read.filter(b => (b.date || "").startsWith(reviewYear));
    let quotes = 0; yb.forEach(b => (b.quotes || []).forEach(q => { if (q.text) quotes++; }));
    const byMonth = Array.from({ length: 12 }, () => []);
    yb.slice().sort((a, b) => (a.date || "").localeCompare(b.date || "")).forEach(b => { const m = +(b.date || "").slice(5, 7); if (m) byMonth[m - 1].push(b); });
    const now = new Date(); const curM = String(now.getFullYear()) === reviewYear ? now.getMonth() : -1;
    const rated = yb.filter(b => +b.rating > 0);
    const avg = rated.length ? (rated.reduce((s, b) => s + +b.rating, 0) / rated.length).toFixed(1) : "–";
    const tc = {}; yb.forEach(b => tagsOf(b).forEach(t => tc[t] = (tc[t] || 0) + 1));
    const tags = Object.entries(tc).sort((a, b) => b[1] - a[1]).slice(0, 8);
    const best = rated.slice().sort((a, b) => +b.rating - +a.rating || (b.date || "").localeCompare(a.date || "")).filter(b => +b.rating >= 4).slice(0, 5);
    const ysecs = books.reduce((s, b) => s + Object.entries(b.readLog || {}).filter(([d]) => d.startsWith(reviewYear)).reduce((a, [, v]) => a + num(v), 0), 0);
    const goal = +((settings.goals || {})[reviewYear]) || 0;
    const pct = goal ? Math.min(100, Math.round(yb.length / goal * 100)) : 0;
    const goalHTML = `<div class="goal" id="goalBox">${goal
      ? `<div class="g-top"><span><b>${reviewYear}년 목표</b> ${goal}권 중 <b class="g-num">${yb.length}권</b> 읽었어요</span>${canWrite ? `<button class="btn ghost sm" data-goaledit>목표 바꾸기</button>` : ""}</div>
         <div class="g-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${goal}" aria-valuenow="${yb.length}"><span style="width:${pct}%"></span></div>
         <div class="g-note">${pct >= 100 ? "목표를 이뤘어요!" : `${goal - yb.length}권 남았어요`}</div>`
      : `<div class="g-top"><span>${reviewYear}년에 몇 권 읽을지 목표를 정해 보세요.</span>${canWrite ? `<button class="btn sm" data-goaledit>목표 정하기</button>` : ""}</div>`}</div>`;
    return `
      <div class="years">${years.map(y => `<button class="tag" data-year="${y}" aria-pressed="${y === reviewYear}">${y}년</button>`).join("")}</div>
      ${goalHTML}
      <div class="tiles t4">
        <div class="tile"><div class="v">${yb.length}<small>권</small></div><div class="k">읽은 책</div></div>
        <div class="tile"><div class="v">${quotes}<small>개</small></div><div class="k">남긴 글귀</div></div>
        <div class="tile"><div class="v">${avg}${rated.length ? "<small>점</small>" : ""}</div><div class="k">평균 별점</div></div>
        <div class="tile"><div class="v">${ysecs >= 60 ? (ysecs / 3600).toFixed(1) + "<small>시간</small>" : "–"}</div><div class="k">읽은 시간</div></div>
      </div>
      <div class="r-sec"><h3>달마다 읽은 책</h3>
        <div class="mcal">${byMonth.map((list, i) => `<div class="mc${list.length ? "" : " none"}${i === curM ? " now" : ""}">
          <div class="mh"><b>${i + 1}월</b>${list.length ? `<span>${list.length}권</span>` : ""}</div>
          ${list.length ? `<div class="mbooks">${list.map(b => `<button class="book" data-open="${esc(b.id)}" title="${esc(b.title)}">${coverHTML(b)}</button>`).join("")}</div>` : ""}
        </div>`).join("")}</div>
      </div>
      ${tags.length ? `<div class="r-sec"><h3>많이 읽은 꼬리표</h3><div class="tagbar" style="margin:0">${tags.map(([t, c]) => `<span class="tag">#${esc(t)}<span class="c">${c}</span></span>`).join("")}</div></div>` : ""}
      ${best.length ? `<div class="r-sec"><h3>별점 높은 책</h3><ul class="best">${best.map(b => `<li><button data-open="${esc(b.id)}"><span class="t">${esc(b.title)}</span>${starsHTML(b.rating)}${b.oneLine ? `<span class="one">${esc(b.oneLine)}</span>` : ""}</button></li>`).join("")}</ul></div>` : ""}
      ${yb.length ? "" : `<div class="empty"><p>${reviewYear}년에 다 읽은 날짜가 적힌 책이 아직 없어요.</p></div>`}
      <div class="r-sec" style="margin-top:34px"><h3>내려받기</h3>
        <div class="exp">
          <button class="exp-btn" data-export="xlsx"><b>기록 내려받기</b><span>서재 전체를 엑셀 표로 받아요. 백업할 때 좋아요.</span></button>
          <button class="exp-btn" data-export="doc"><b>오래 머문 문장 모음</b><span>문장을 책별로 엮은 문서예요. 인쇄하거나 나눌 때 좋아요.</span></button>
        </div>
        <p class="exp-msg" id="expMsg" aria-live="polite"></p>
      </div>
      ${!window.SEED && (!store || window.FIREBASE_CONFIG) ? `<div class="r-sec"><h3>서재 옮기기</h3>
        <div class="exp">
          <button class="exp-btn" data-backup="save"><b>서재 파일 저장</b><span>책, 문장, 표지, 칸까지 파일 하나로 저장해요. 백업할 때 좋아요.</span></button>
          <label class="exp-btn" style="cursor:pointer"><b>서재 파일 불러오기</b><span>저장해 둔 서재 파일로 다른 컴퓨터나 새 주소에서 이어 써요.</span><input type="file" id="restoreFile" accept=".json,application/json" hidden></label>
        </div>
        <div class="exp-msg" id="bkMsg" aria-live="polite">${esc(bkNote)}</div>
      </div>` : ""}
      ${!window.SEED && canWrite ? `<div class="r-sec"><h3>책 검색 연결</h3>
        <p class="exp-msg" style="margin:0 0 8px">예스24 키를 넣은 앱스 스크립트 '웹 앱' 주소를 한 번 붙여 넣어 두면, 책을 추가할 때 제목으로 찾아 표지·쪽수·두께를 채울 수 있어요.</p>
        <div class="relay-row"><input id="relayInput" type="url" inputmode="url" autocomplete="off" aria-label="책 검색 연결 주소" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(settings.relayUrl || "")}"><button class="btn primary" data-relaysave>저장</button></div>
        <p class="exp-msg" id="relayMsg" aria-live="polite">${esc(relayNote || (settings.relayUrl ? "연결 주소가 저장되어 있어요." : ""))}</p>
      </div>` : ""}
    `;
  }

  // ---------- sheets ----------
  const layer = $("#layer");
  function openSheet(html) {
    const keepScroll = layer.querySelector(".sheet")?.scrollTop;
    layer.innerHTML = `<div class="overlay" data-close><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
    document.body.style.overflow = "hidden";
    return keepScroll;
  }
  function closeSheet() { layer.innerHTML = ""; document.body.style.overflow = ""; render(); }

  function showDetail(id) {
    const b = books.find(x => x.id === id); if (!b) return;
    const st = statusOf(b);
    const quotes = (b.quotes || []).map((q, i) => ({ q, i })).filter(x => x.q.text);
    const tags = tagsOf(b);
    if (st !== "read") {
      openSheet(`
        <div class="sheet-head"><h2>${STATUS_NAME[st]}</h2><button class="btn ghost" data-close-btn aria-label="닫기">닫기 ✕</button></div>
        <h3 class="d-title">${esc(b.title)}</h3>${b.author ? `<div class="author">${esc(b.author)}</div>` : (canWrite ? `<button class="tag add" data-editfocus="f-author" data-book="${esc(b.id)}">＋ 저자</button>` : "")}
        ${st === "reading" ? `<div class="d-read">${[b.pageNow ? `${esc(b.pageNow)}${num(b.pages) ? ` / ${num(b.pages)}` : ""}쪽까지 읽음` : (num(b.pages) ? `${num(b.pages)}쪽` : ""), num(b.readSecs) >= 60 ? `읽은 시간 ${fmtDur(b.readSecs)}` : ""].filter(Boolean).join(" · ")}</div>` : ""}
        ${canWrite ? `<div class="row actions">
          ${st === "want" ? `<button class="btn primary" data-start="${esc(b.id)}">읽기 시작</button>` : ""}
          ${st === "reading" ? `<button class="btn primary" data-timer="${esc(b.id)}">지금 읽기</button>` : ""}
          <button class="btn${st === "reading" ? "" : " primary"}" data-finish="${esc(b.id)}">다 읽었어요</button>
          <button class="btn" data-edit="${esc(b.id)}">수정</button>
          <button class="btn danger" data-del="${esc(b.id)}">삭제</button>
        </div><div id="delConfirm"></div>` : ""}`);
      return;
    }
    openSheet(`
      <div class="sheet-head"><h2>${STATUS_NAME[st]}</h2><button class="btn ghost" data-close-btn aria-label="닫기">닫기 ✕</button></div>
      <div class="detail-top">${coverHTML(b)}
        <div><h3>${esc(b.title)}</h3>${b.author ? `<div class="author">${esc(b.author)}</div>` : (canWrite ? `<button class="tag add" data-editfocus="f-author" data-book="${esc(b.id)}">＋ 저자</button>` : "")}
        ${st === "read" ? (canWrite ? `<div class="star-pick quick" role="group" aria-label="별점">${[1,2,3,4,5].map(n => `<button type="button" class="${starCls(n, clampRate(b.rating))}" data-qr="${n}" data-book="${esc(b.id)}" aria-label="별 ${n}개">★</button>`).join("")}</div>` : starsHTML(b.rating)) : ""}

  function layoutLines(ctx, text, maxW) {
    const lines = []; let idx = 0;

    ctx.font = `${fs}px ${FONT}`;
    lines.forEach(([s, e], li) => {
      const base = y0 + li * lh + fs;
      let x = X, k = s;
      const end = e;
      while (k < end) {
        const on = marked[k]; let j = k; while (j < end && marked[j] === on) j++;

  // 책장에 놓는 그림 소품 (나머지 배지는 그림 글자를 그대로 놓는다)

  const earned = (b, s) => b.cur(s) >= b.need;
  const bdgProg = (b, s) => b.height ? `${fmtCm(Math.min(b.cur(s), b.need))} / ${fmtCm(b.need)}` : b.time ? `${fmtDur(Math.min(b.cur(s), b.need))} / ${fmtDur(b.need)}` : `${Math.min(b.cur(s), b.need).toLocaleString()} / ${b.need.toLocaleString()}${b.unit}`;
  const decorMap = () => (settings.decor && typeof settings.decor === "object") ? settings.decor : {};
  // 칸에 놓인 소품 (받은 배지만). 끌어서 옮긴 소품은 정해 둔 자리(몇 번째 책 앞)에 끼워 넣는다

  function placeDecor(spines, shelf, s) {

    mine.sort((x, y) => y.i - x.i);   // 뒤쪽 자리부터 끼워야 앞쪽 자리가 밀리지 않는다
    mine.forEach(({ b, i }) => out.splice(i, 0, `<button class="decor${b.art ? " " + b.art : ""}" data-badges="${b.id}" title="${esc(b.name)} 배지 소품 · 끌어서 옮길 수 있어요" aria-label="${esc(b.name)} 배지 소품"${num(gp[b.id]) ? ` style="margin-left:${(Math.min(0.9, num(gp[b.id])) * 100).toFixed(1)}%"` : ""}>${b.art ? ART[b.art] : b.ic}</button>`));
    return out.join("");
  }

  function renderStrip() {
    const el = $("#statStrip"); if (!el) return;
    const s = calcStats();
    if (tab !== "read" || query.trim() || !s.n) { el.hidden = true; return; }
    const next = MILESTONES.find(m => m.mm > s.mm), prev = MILESTONES.filter(m => m.mm <= s.mm).pop();
    const base = prev ? prev.mm : 0, pct = next ? Math.max(3, Math.round((s.mm - base) / (next.mm - base) * 100)) : 100;
    const [v, u] = cmParts(s.mm), got = BADGES.filter(b => earned(b, s)).length;
    el.innerHTML = `<span class="h">${v}<small>${u}</small></span>
      <span class="mid"><span class="lbl">쌓은 높이 · ${s.n}권</span><span class="next">${next ? `${next.ic} ${esc(next.name)}까지 ${fmtCm(next.mm - s.mm)}` : "가장 높은 곳까지 쌓았어요"}</span><span class="g-bar"><span style="width:${pct}%"></span></span></span>
      <span class="bd">배지 ${got}/${BADGES.length} ›</span>`;

  let bdgSel = "";
  let fill = null;   // 책 정보 한꺼번에 채우기 진행 상태
  function showStats(sel) {

    const s = calcStats(), [v, u] = cmParts(s.mm);

    const next = MILESTONES.find(m => m.mm > s.mm);

        + (on && canWrite ? `<div style="margin-top:8px;color:var(--muted)">이 소품을 놓을 칸</div><div class="tag-sugg">${shelfList().map(n => `<button type="button" class="tag sh" data-decorshelf="${esc(n)}" aria-pressed="${d[selB.id] === n}">${esc(n)}</button>`).join("")}${d[selB.id] ? `<button type="button" class="tag add" data-decorshelf="">치우기</button>` : ""}</div>` : "");
    }
    const keep = openSheet(`

        <div class="hi-sub">읽은 책 ${s.n}권${s.pages ? ` · ${s.pages.toLocaleString()}쪽` : ""}${s.secs >= 60 ? ` · 읽은 시간 ${fmtDur(s.secs)}` : ""}</div></div>
      ${top.length ? `<div class="stack">${top.map(b => { const t = thickOf(b).mm; return `<div class="lay" style="height:${Math.max(13, Math.min(44, Math.round(t * 1.3)))}px;background:${SPINE_COLORS[hashN(b.id) % SPINE_COLORS.length]}"><span>${esc(b.title)}</span></div>`; }).join("")}</div>
        <div class="stack-more">${read.length > top.length ? `그 아래로 ${read.length - top.length}권이 더 쌓여 있어요` : "읽은 책이 한 권씩 쌓여요"}</div>` : `<div class="stack-more">다 읽은 책을 기록하면 여기에 쌓여요.</div>`}
      ${s.est || todo ? `<div class="est-note">${s.est ? `읽은 책 ${s.n}권 가운데 ${s.est}권은 두께를 몰라서 쪽수나 평균 두께(1.8cm)로 어림했어요.` : `책등 그림을 아직 찾아보지 않은 책이 ${todo}권 있어요.`}
        ${canWrite ? (settings.relayUrl
          ? (todo || (fill && fill.run) ? `<div class="row"><button class="btn sm primary" data-fill ${fill && fill.run ? "hidden" : ""}>책 정보·책등 찾아 채우기 (${todo}권)</button>${fill && fill.run ? `<button class="btn sm" data-fillstop>멈추기</button>` : ""}</div><div id="fillMsg" aria-live="polite">${fill ? esc(fill.msg) : "제목과 저자가 꼭 맞는 책만 쪽수·두께·표지·책등 그림을 채워요. 책등이 없는 판본이면 같은 책의 다른 판본에서 찾아봐요. 이미 넣은 표지와 값은 그대로 둬요."}</div>` : `<div id="fillMsg">${fill ? esc(fill.msg) + " " : ""}찾지 못한 책은 '수정'에서 쪽수나 두께를 직접 적을 수 있어요.</div>`)
          : `<div>'돌아보기'에서 책 검색을 연결하면 쪽수와 두께를 한꺼번에 채울 수 있어요.</div>`) : ""}</div>` : ""}
      <div class="sec-label">넘은 곳</div>
      <div class="miles">${MILESTONES.map(m => `<span class="mile${m.mm <= s.mm ? " on" : m === next ? " next" : ""}" title="${esc(m.desc)}">${m.ic} <b>${esc(m.name)}</b> ${fmtCm(m.mm)}${m === next ? ` · ${fmtCm(m.mm - s.mm)} 남음` : ""}</span>`).join("")}</div>
      <div class="sec-label">배지 ${got} / ${BADGES.length}</div>
      <p class="bdg-hint">배지를 누르면 설명이 보여요. 받은 배지는 책장 칸에 소품으로 놓을 수 있고, 책장에서 끌어서 자리를 옮길 수 있어요.</p>
      ${groups.map(g => `<div class="bdg-group">${g}</div><div class="badges">${BADGES.filter(b => b.g === g).map(b => { const on = earned(b, s); return `<button type="button" class="bdg${on ? "" : " off"}" data-bdg="${b.id}" aria-pressed="${bdgSel === b.id}"><span class="ic">${b.ic}</span><span class="nm">${esc(b.name)}</span><span class="pg${on && d[b.id] ? " placed" : ""}">${on ? (d[b.id] ? `${esc(d[b.id])} 칸에 있어요` : "받았어요") : bdgProg(b, s)}</span></button>`; }).join("")}</div>${selB && selB.g === g ? `<div class="bdg-panel" id="bdgPanel">${panel}</div>` : ""}`).join("")}`);
    const sh = layer.querySelector(".sheet"); if (sh && keep) sh.scrollTop = keep;
    if (sel) { const p = $("#bdgPanel"); if (p) p.scrollIntoView({ block: "nearest" }); }
  }

  // ---------- 책 찾기: 앱스 스크립트를 거쳐 예스24에서 책 정보를 가져온다 ----------
  async function relay(params) {
    const u = (settings.relayUrl || "").trim(); if (!u) throw new Error("norelay");
    const r = await fetch(u + (u.includes("?") ? "&" : "?") + new URLSearchParams(params));
    const j = await r.json(); if (j && j.error) throw new Error(j.error); return j;
  }
  let bsItems = [];
  let relayNote = "";
  async function bookSearch() {
    const msg = $("#bsMsg"), list = $("#bsList"); if (!msg) return;
    if (!(settings.relayUrl || "").trim()) { msg.textContent = "책 찾기는 '돌아보기' 맨 아래 '책 검색 연결'을 한 번 해 두면 쓸 수 있어요."; return; }
    const q = [$("#f-title").value, $("#f-author").value].map(x => x.trim()).filter(Boolean).join(" ");
    if (!q) { msg.textContent = "제목을 조금만 적고 눌러 주세요."; $("#f-title").focus(); return; }
    msg.textContent = "찾는 중…"; list.innerHTML = "";
    try {
      const r = await relay({ action: "search", q }); bsItems = (r.items || []).slice(0, 8);
      if (!bsItems.length) { msg.textContent = "찾은 책이 없어요. 제목을 짧게 바꿔 보세요."; return; }
      msg.textContent = "맞는 책을 누르면 정보가 채워져요.";
      list.innerHTML = `<div class="bs-list">${bsItems.map((it, i) => `<button type="button" class="bs-item" data-bspick="${i}">${it.cover ? `<img src="${esc(it.cover)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=noimg></span>'">` : `<span class="noimg"></span>`}<span><span class="t">${esc(it.title)}</span><span class="a">${esc([it.author, it.publisher, (it.pubDate || "").slice(0, 4)].filter(Boolean).join(" · "))}</span></span></button>`).join("")}</div>`;
    } catch (e) { msg.textContent = "책을 찾지 못했어요. " + (String(e.message || "").startsWith("예스24") ? e.message : "책 검색 연결 주소를 확인해 주세요."); }
  }
  async function dataUrlCover(dataUrl) {
    const blob = await (await fetch(dataUrl)).blob();
    const big = await resizeImage(blob, 900, 0.85), small = await resizeImage(blob, 360, 0.75);
    return { blob: big.blob, dataUrl: big.dataUrl, small: small.dataUrl };
  }
  const shrinkSpine = async dataUrl => {
    const r = await resizeImage(await (await fetch(dataUrl)).blob(), 420, 0.82);
    if (r.canvas.height / r.canvas.width < 3) throw new Error("notspine");   // 책등 그림이 없는 책은 다른 그림이 와서 걸러 낸다
    return r.dataUrl;
  };
  // 아직 책 정보나 책등 그림을 찾아보지 않은 책
  const needInfo = b => !!b.title && ((!num(b.thick) && !b.infoTried) || (!b.spineData && !b.spineTried));
  // 고른 판본에 책등 그림이 없으면, 제목과 저자가 같은 다른 판본에서 찾아본다 (세 권까지)
  async function altSpine(ref, items) {
    const t = normT(ref.title), a = normT(String(ref.author || "").trim().split(/[,·\s]+/)[0]); let n = 0;
    for (const it of items || []) {
      if (it === ref || !it.side || it.side === ref.side || normT(it.title) !== t || (a && !normT(it.author).includes(a))) continue;
      if (++n > 3) break;
      try { const r = await relay({ action: "images", cover: "", side: it.side }); if (r.spineData) return await shrinkSpine(r.spineData); } catch {}
    }
    return "";
  }
  async function pickResult(i) {
    const it = bsItems[i]; if (!it) return;
    syncDraft(); $("#bsMsg").textContent = "책 정보를 가져오는 중…";
    const hasCover = !!(coverSrc(draft) || draft._newCover);
    let d = it;
    try { d = { ...it, ...(await relay({ action: "images", cover: hasCover ? "" : (it.cover || ""), side: it.side || "" })) }; } catch {}
    draft.title = d.title || draft.title; if (d.author) draft.author = d.author;
    if (num(d.pages)) draft.pages = num(d.pages); if (num(d.thick)) draft.thick = num(d.thick);
    if (d.isbn) draft.isbn = d.isbn; if (d.publisher) draft.publisher = d.publisher;
    if (d.coverData && !hasCover) { try { draft._newCover = await dataUrlCover(d.coverData); } catch {} }
    if (num(d.tall)) draft.tall = num(d.tall);
    let sp = ""; if (d.spineData) { try { sp = await shrinkSpine(d.spineData); } catch {} }
    if (!sp) sp = await altSpine(it, bsItems);
    if (sp) draft.spineData = sp;
    renderForm(draft._editing);
    $("#bsMsg").textContent = "책 정보를 채웠어요. 틀린 곳은 고쳐 주세요.";
  }
  // 이미 있는 책들: 제목(과 저자)이 꼭 맞는 책만 쪽수·두께·표지를 채운다
  const normT = s => String(s || "").toLowerCase().replace(/\(.*?\)|\[.*?\]/g, "").split(/\s[-:–—]\s/)[0].replace(/[^0-9a-z가-힣]/g, "");
  function matchBook(b, items) {
    const t = normT(b.title); if (!t) return null;
    const a = normT(String(b.author || "").trim().split(/[,·\s]+/)[0]);
    return (items || []).find(it => normT(it.title) === t && (!a || normT(it.author).includes(a))) || null;
  }
  async function runFill() {
    if (fill && fill.run) return;
    const targets = books.filter(needInfo);
    fill = { run: true, msg: "찾는 중…" }; let done = 0, hit = 0;
    const say = m => { fill.msg = m; const el = $("#fillMsg"); if (el) el.textContent = m; };
    showStats();
    for (const b0 of targets) {
      if (!fill.run) break;
      const b = books.find(x => x.id === b0.id); if (!b) continue;
      const nb = JSON.parse(JSON.stringify(b));
      try {
        const r = await relay({ action: "search", q: [b.title, String(b.author || "").split(/[,·]/)[0]].filter(Boolean).join(" ") });
        const m = matchBook(b, r.items);
        if (m) {
          let d = m;
          try { d = { ...m, ...(await relay({ action: "images", cover: coverSrc(b) ? "" : (m.cover || ""), side: b.spineData ? "" : (m.side || "") })) }; } catch {}
          let got = false;
          if (num(d.pages) && !num(b.pages)) { nb.pages = Math.round(num(d.pages)); got = true; }
          if (num(d.thick) && !num(b.thick)) { nb.thick = num(d.thick); got = true; }
          if (num(d.tall) && !num(b.tall)) nb.tall = num(d.tall);
          if (m.isbn && !b.isbn) nb.isbn = m.isbn; if (d.publisher && !b.publisher) nb.publisher = d.publisher;
          if (!b.spineData) {
            let sp = ""; if (d.spineData) { try { sp = await shrinkSpine(d.spineData); } catch {} }
            if (!sp) sp = await altSpine(m, r.items);
            if (sp) { nb.spineData = sp; got = true; }
          }
          if (d.coverData && !coverSrc(b) && d.coverData.length < 300000) { nb.cover = null; nb.coverData = d.coverData; got = true; }
          if (got) hit++;
        }
        if (!num(nb.thick)) nb.infoTried = 1;
        if (!nb.spineData) nb.spineTried = 1;
        const k = books.findIndex(x => x.id === nb.id); if (k >= 0) books[k] = nb;
        await saveBook(nb);
      } catch (e) { fill.run = false; say(`${done}권까지 보고 멈췄어요. ${String(e.message || "").startsWith("예스24") ? e.message : "연결을 확인하고 다시 눌러 주세요."}`); if ($("#fillMsg")) showStats(); return; }
      done++; say(`${done} / ${targets.length}권 살펴보는 중… 정보를 채운 책 ${hit}권`);
      await new Promise(r => setTimeout(r, 150));
