      };
      const step = () => {
        while (next < ctx.currentTime + 1.2) {
          prev = Math.max(0, Math.min(scale.length - 1, prev + Math.round((Math.random() - 0.5) * 5)));
          note(scale[prev], next, 0.32, 4.5);
          if (Math.random() < 0.3) note(scale[Math.max(0, prev - 4)] / 2, next, 0.24, 6);
          if (Math.random() < 0.25) note(scale[Math.min(scale.length - 1, prev + 2)], next + 0.5, 0.18, 3.5);
          next += 1.8 + Math.random() * 2.6;
        }
      };
      step(); mus.tick = setInterval(step, 500);
    }
    mus.on = kind;
  }
  // 유튜브 주소를 서재 안에서 틀 수 있는 주소로 바꾼다 (영상 하나 또는 재생목록)
  function ytEmbed(u) {
    try {
      const x = new URL(String(u || "").trim()), h = x.hostname.replace(/^(www|m|music)\./, "");
      let id = "", list = x.searchParams.get("list") || "";
      if (h === "youtu.be") id = x.pathname.slice(1).split("/")[0];
      else if (h === "youtube.com" || h === "youtube-nocookie.com") { if (x.pathname === "/watch") id = x.searchParams.get("v") || ""; else { const m = x.pathname.match(/^\/(shorts|live|embed)\/([\w-]{6,})/); if (m) id = m[2]; } }
      else return "";
      if (!/^[\w-]{6,20}$/.test(id)) id = ""; if (!/^[\w-]{10,60}$/.test(list)) list = "";
      if (!id && !list) return "";
      return "https://www.youtube.com/embed/" + (id || "videoseries") + "?autoplay=1&playsinline=1&rel=0" + (list ? "&list=" + list : "&loop=1&playlist=" + id);
    } catch { return ""; }
  }
  function musRender() {
    const list = musList(), playing = !!(mus.on || mus.yt >= 0);
    $("#musicBtn").classList.toggle("on", playing); $("#musicBtn").textContent = playing ? "♪ 재생 중" : "♪ 음악";
    $("#musBody").innerHTML = `
      <div class="mus-head"><h3>배경 음악</h3><span><button class="btn sm" data-musstop ${playing ? "" : "hidden"}>■ 끄기</button> <button class="btn ghost sm" data-musclose aria-label="닫기">접기 ⌄</button></span></div>
      <div class="mus-sec">서재의 조용한 소리</div>
      <div class="mus-row">${MUS_KINDS.map(([k, n]) => `<button class="btn sm" data-mus="${k}" aria-pressed="${mus.on === k}">${n}</button>`).join("")}</div>
      <div class="mus-vol"><span>작게</span><input id="musVol" type="range" min="0" max="1" step="0.05" value="${mus.vol}" aria-label="소리 크기"><span>크게</span></div>
      <div class="mus-sec">내 유튜브 음악</div>
      ${list.length ? `<ul class="mus-list">${list.map((m, i) => `<li><button class="pl" data-ytplay="${i}" aria-pressed="${mus.yt === i}">${mus.yt === i ? "▶ " : ""}${esc(m.n || "유튜브 음악")}</button>${canWrite ? `<button class="x" data-ytdel="${i}" aria-label="${esc(m.n || "유튜브 음악")} 지우기">✕</button>` : ""}</li>`).join("")}</ul>` : `<p class="mus-note" style="margin-top:0">자주 듣는 유튜브 영상이나 재생목록 주소를 넣어 두면 여기서 바로 틀 수 있어요.</p>`}
      ${canWrite ? `<div class="mus-add"><input id="ytUrl" type="url" inputmode="url" placeholder="유튜브 주소 붙여 넣기" aria-label="유튜브 주소"><input id="ytName" type="text" maxlength="30" placeholder="이름 (예: 비 오는 날 피아노)" aria-label="음악 이름"><button class="btn sm primary" data-ytadd>내 음악에 넣기</button></div>` : ""}
      <p class="mus-note" id="musMsg" aria-live="polite">${esc(mus.msg || (mus.yt >= 0 ? "소리가 안 나면 아래 영상의 재생 단추를 한 번 눌러 주세요." : ""))}</p>`;
  }
  const musOpen = open => { $("#music").classList.toggle("closed", !open); if (open) musRender(); };
  $("#musicBtn").addEventListener("click", () => musOpen($("#music").classList.contains("closed")));
  $("#timerLayer").addEventListener("click", e => { if (e.target.closest("[data-musopen]")) musOpen($("#music").classList.contains("closed")); });
  $("#music").addEventListener("click", async e => {
    const t = e.target; mus.msg = "";
    if (t.closest("[data-musclose]")) { musOpen(false); return; }
    if (t.closest("[data-musstop]")) { musStopAll(); musRender(); return; }
    const k = t.closest("[data-mus]"); if (k) { if (mus.on === k.dataset.mus) musStopAll(); else musPlay(k.dataset.mus); musRender(); return; }
    const p = t.closest("[data-ytplay]");
    if (p) {
      const i = +p.dataset.ytplay, m = musList()[i], src = m && ytEmbed(m.u);
      if (mus.yt === i) { musStopAll(); musRender(); return; }
      musStopAll(); if (!src) { mus.msg = "이 주소는 틀 수 없어요. 지우고 다시 넣어 주세요."; musRender(); return; }
      mus.yt = i;
      $("#musYt").innerHTML = `<iframe src="${esc(src)}" title="${esc(m.n || "유튜브 음악")}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
      musRender(); return;
    }
    const d = t.closest("[data-ytdel]");
    if (d) { const i = +d.dataset.ytdel, list = musList().slice(); if (mus.yt === i) musStopAll(); else if (mus.yt > i) mus.yt--; list.splice(i, 1); settings = { ...settings, music: list }; musRender(); await saveSettings({ music: list }); return; }
    if (t.closest("[data-ytadd]")) {
      const u = $("#ytUrl").value.trim(), n = $("#ytName").value.trim();
      if (!ytEmbed(u)) { mus.msg = "유튜브 영상이나 재생목록 주소가 아니에요. 유튜브의 '공유' → '링크 복사'로 받은 주소를 붙여 넣어 주세요."; musRender(); $("#ytUrl").value = u; $("#ytName").value = n; return; }
      const list = musList().concat([{ n: n || `유튜브 음악 ${musList().length + 1}`, u }]).slice(0, 20);
      settings = { ...settings, music: list }; musRender(); await saveSettings({ music: list });
    }
  });
  $("#music").addEventListener("input", e => { if (e.target.id !== "musVol") return; mus.vol = +e.target.value; if (mus.master) mus.master.gain.value = mus.vol; try { localStorage.setItem("reading-log-vol", String(mus.vol)); } catch {} });
  $("#music").addEventListener("keydown", e => { if ((e.target.id === "ytUrl" || e.target.id === "ytName") && e.key === "Enter") { e.preventDefault(); $("#music [data-ytadd]").click(); } });

  init();
})();
</script>
